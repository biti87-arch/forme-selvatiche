<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forme Selvatiche</title>
<link rel="stylesheet" href="vendor/fonts.css">
<style>
:root{
  --bg:#F1F4EB; --surface:#FFFFFF; --surface2:#E7EDDD; --ink:#1E2619; --muted:#5A6450;
  --line:#D2DAC6; --accent:#2D5016; --accent2:#4A7C2F; --on-accent:#FFFFFF;
  --gold:#8B6914; --goldbg:#FBF3DC; --cond:#C00000; --chip:#EDF5E5; --lock:#9AA38F;
  --warnbg:#FCEBD2; --warn:#8A4B00;
  --serif:"Alegreya", Georgia, "Times New Roman", serif;
  --sans:"Alegreya Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11150F; --surface:#192016; --surface2:#222B1D; --ink:#E4EADA; --muted:#A0AA94;
    --line:#333F2B; --accent:#93C46E; --accent2:#74A650; --on-accent:#0E130B;
    --gold:#D8B45C; --goldbg:#2A2516; --cond:#FF7B70; --chip:#243020; --lock:#6C7662;
    --warnbg:#3A2A12; --warn:#F2B866;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11150F; --surface:#192016; --surface2:#222B1D; --ink:#E4EADA; --muted:#A0AA94;
  --line:#333F2B; --accent:#93C46E; --accent2:#74A650; --on-accent:#0E130B;
  --gold:#D8B45C; --goldbg:#2A2516; --cond:#FF7B70; --chip:#243020; --lock:#6C7662;
  --warnbg:#3A2A12; --warn:#F2B866;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* testata */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:18px 10px}
.brand{display:flex;flex-direction:column}
.brand h1{font-size:1.6rem;font-weight:800;color:var(--accent);letter-spacing:.01em}
.brand small{color:var(--muted);font-size:.85rem}
.seg{display:inline-flex;border:1px solid var(--accent2);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 16px;cursor:pointer;font-weight:700;color:var(--accent2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.pgline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-bottom:10px}
.pgline select{flex:1 1 180px;min-width:0}

/* schede */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:10px 12px 9px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.panel{padding-top:16px;display:flex;flex-direction:column;gap:16px}

.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.box > h2{font-size:1.15rem;color:var(--accent);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.box > h2 .cnt{font-family:var(--sans);font-size:.85rem;color:var(--muted);font-weight:500}
.hint{color:var(--muted);font-size:.88rem;margin:0}

.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.grid.car{grid-template-columns:repeat(3,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
input[type=number],input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:90px;font-size:.8rem;font-family:ui-monospace,Menlo,Consolas,monospace}
.carbox{display:flex;align-items:center;gap:8px}
.carbox input{width:64px;flex:0 0 64px}
.carbox .mod{font-weight:700;color:var(--accent2);min-width:2.2em}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.btn{border:1px solid var(--accent2);background:var(--surface);color:var(--accent);border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{border-color:var(--cond);color:var(--cond)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-weight:700}
.stepper input{width:64px;text-align:center}
.derived{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;color:var(--muted)}
.derived b{color:var(--ink)}
details.more > summary{cursor:pointer;color:var(--accent2);font-weight:700;margin-top:6px}

/* elenco forme */
.search{position:relative}
.cathead{font-family:var(--serif);font-size:1.05rem;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:10px;margin:4px 0 -4px}
.cathead::after{content:"";flex:1;border-bottom:1px solid var(--line)}
.flist{display:flex;flex-direction:column;gap:8px}
.frow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.frow .fn{font-family:var(--serif);font-weight:700;font-size:1.08rem}
.frow .sp{font-size:.82rem;color:var(--accent2);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--accent2);background:var(--chip);color:var(--accent);border-radius:999px;padding:4px 11px;font-size:.88rem;font-weight:700;cursor:pointer}
.chip.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.locked{border-style:dashed;border-color:var(--line);background:transparent;color:var(--lock);cursor:default;font-weight:500}
.frow.nat{border-color:var(--gold);background:var(--goldbg)}

/* scheda */
.sheethead{display:flex;flex-direction:column;gap:4px}
.sheethead h2{font-size:1.7rem;color:var(--accent);font-weight:800;line-height:1.1}
.sheethead .sp{color:var(--accent2);font-style:italic;font-size:.92rem}
.intro{font-size:.95rem;margin:4px 0 0;max-width:65ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.stat .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.stat .v{font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .s{font-size:.8rem;color:var(--muted)}
.kv{display:grid;grid-template-columns:minmax(90px,max-content) 1fr;gap:5px 14px;font-size:.95rem}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0}
.atk{display:flex;flex-direction:column;gap:6px}
.opt{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--gold);font-weight:700;margin-top:4px}
.aline{padding:7px 10px;background:var(--surface2);border-radius:7px;font-variant-numeric:tabular-nums}
.aline b{font-weight:700}
.aline .tag{display:inline-block;font-size:.72rem;border:1px solid var(--gold);color:var(--gold);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px;font-weight:700}
.cap{padding:8px 0;border-top:1px solid var(--line)}
.cap:first-of-type{border-top:0}
.cap .cn{font-weight:700}
.cap .ct{color:var(--gold);font-style:italic;font-size:.9rem;margin-left:4px}
.cap p{margin:3px 0 0;font-size:.93rem;max-width:70ch}
.cap.off{opacity:.55}
.cond{color:var(--cond);font-weight:700}
.efx{color:var(--ink);font-weight:700;letter-spacing:.02em}
.closing{font-style:italic;color:var(--muted);font-size:.93rem;margin:0;max-width:70ch}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 11px;font-size:.9rem}
.sizebar{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.calc{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.calc b{color:var(--ink)}
.pill{display:inline-block;background:var(--chip);color:var(--accent);border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:700}
.muted{color:var(--muted)}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:.93rem}

/* morfico */
.asp{display:flex;flex-direction:column;gap:8px}
.acard{border:1px solid var(--line);border-radius:9px;padding:9px 11px;display:flex;gap:10px;align-items:flex-start;background:var(--surface)}
.acard.on{border-color:var(--accent2);background:var(--chip)}
.acard input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.acard .an{font-weight:700;font-family:var(--serif);font-size:1.02rem}
.acard .ad{font-size:.86rem;color:var(--muted)}
.acard .ad b{color:var(--ink);font-weight:700}
.acard.dis{opacity:.5}
.subh{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:6px 0 2px}
@media (max-width:460px){
  .grid.car{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sheethead h2{font-size:1.45rem}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats.three{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

ino a 1,5 km. Gli alleati entro 18 m che lo odono ottengono bonus morale +2 ai TxC, ai danni e ai TS contro la paura per 1 minuto. I nemici entro 18 m che lo odono devono superare un Tiro Salvezza su Volontà (CD 10+½DV+mod.Sag) o restare Scossi per 1 minuto."}],"chiusura":"è la forma da gruppo: Sbilanciare al Morso apre il bersaglio agli alleati senza costarti un'azione, e a Enorme l'Ululato del Branco distribuisce +2 a TxC, danni e TS contro la paura prima ancora dell'ingaggio.","canatExtra":0},{"nome":"Orso","cat":"Terrestri","specie":["Orso Nero","Orso Bruno","Orso Grizzly","Orso delle Caverne","Orso Polare"],"intro":"Gli orsi sono onnivori poderosi con artigli forti e un morso devastante. Le forme più grandi possono abbracciare le prede con entrambi gli artigli per stritolarle, e se gravemente feriti diventano ancora più pericolosi. L'orso polare aggiunge il nuoto eccellente alle sue capacità.","vel":[{"sizes":["Minuscola","Piccola"],"label":"Minuscola–Piccola","val":"9 m, Scalare 6 m"},{"sizes":["Media"],"label":"Media","val":"12 m, Scalare 6 m"},{"sizes":["Grande"],"label":"Grande","val":"12 m, Nuotare 6 m, Scalare 6 m"},{"sizes":["Enorme"],"label":"Enorme","val":"12 m, Nuotare 9 m, Scalare 6 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"}],"bonus":"+4 Percezione, +8 Nuotare","attacchi":{"Minuscola":{"alts":[[{"n":2,"name":"Artigli","sec":false,"dice":"1d3","str":1,"crit":null,"extra":[]},{"n":1,"name":"Morso","sec":true,"dice":"1d3","str":0.5,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"2 Artigli (1d3+For), Morso (att.sec. -5TxC, 1d3+½For)","lv18":false},"Piccola":{"alts":[[{"n":2,"name":"Artigli","sec":false,"dice":"1d4","str":1,"crit":null,"extra":["Afferrare"]},{"n":1,"name":"Morso","sec":true,"dice":"1d4","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"2 Artigli (1d4+For più Afferrare), Morso (att.sec. -5TxC, 1d4+½For)","lv18":false},"Media":{"alts":[[{"n":2,"name":"Artigli","sec":false,"dice":"1d6","str":1,"crit":null,"extra":["Afferrare"]},{"n":1,"name":"Morso","sec":true,"dice":"1d8","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"2 Artigli (1d6+For più Afferrare), Morso (att.sec. -5TxC, 1d8+½For)","lv18":false},"Grande":{"alts":[[{"n":2,"name":"Artigli","sec":false,"dice":"1d8","str":1,"crit":null,"extra":["Afferrare"]},{"n":1,"name":"Morso","sec":true,"dice":"1d10","str":0.5,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"1,5 m","raw":"2 Artigli (1d8+For più Afferrare), Morso (att.sec. -5TxC, 1d10+½For)","lv18":false},"Enorme":{"alts":[[{"n":2,"name":"Artigli","sec":false,"dice":"1d10","str":1,"crit":null,"extra":["Afferrare"]},{"n":1,"name":"Morso","sec":true,"dice":"2d8","str":0.5,"crit":null,"extra":[]}]],"spazio":"4,5 m","portata":"3 m","raw":"2 Artigli (1d10+For più Afferrare), Morso (att.sec. -5TxC, 2d8+½For)","lv18":false}},"note":[],"capacita":[{"nome":"Ferocia","tag":"dal Grande","corpo":"Se a ≤ metà PF, ottiene bonus razziale +2 ai TxC in mischia e ai danni e +1 schivare alla CA."},{"nome":"Abbraccio dell'Orso","tag":"dal Media","corpo":"Se colpisce con entrambi gli artigli nello stesso round, afferra automaticamente il bersaglio (come con la manovra Afferrare, senza prova) e infligge immediatamente (Danno da Artiglio)+1For danni da stritolamento. Finché mantiene questa presa ottiene +4 alle prove per mantenere la Lotta. Richiede entrambe le mani."},{"nome":"Stritolare","tag":"dal Grande","corpo":"Infligge danni contundenti aggiuntivi (Grande: 2d8+2For; Enorme: 2d10+2For) con ogni prova di Lottare riuscita per mantenere la presa, anche successiva all'Abbraccio dell'Orso."},{"nome":"Resistenza al Freddo","tag":"solo Enorme — Orso Polare","corpo":"Ottiene RE 10 al freddo e bonus +4 ai TS contro gli effetti ambientali freddi."}],"chiusura":"gioca sulla presa: Abbraccio dell'Orso afferra in automatico se entrambi gli artigli vanno a segno, e dal Grande ogni prova di Lottare riuscita aggiunge i danni di Stritolare. Ferocia ti dà il margine per restare aggrappato anche sotto metà PF.","canatExtra":0},{"nome":"Ungulato Agile","cat":"Terrestri","specie":["Capra","Ariete","Cervo","Alce","Renna","Antilope"],"intro":"Gli ungulati agili includono creature che vanno dalla capra arrampicatrice al grande alce. Le corna o gli zoccoli sono le loro armi principali. Nelle taglie maggiori la Carica Possente diventa devastante, e la Carica Mobile permette di colpire e allontanarsi rapidamente. Molte forme hanno straordinaria capacità di scalare rocce.","vel":[{"sizes":["Minuscola","Piccola"],"label":"Minuscola–Piccola","val":"9 m, Scalare 6 m"},{"sizes":["Media"],"label":"Media","val":"9 m, Scalare 9 m"},{"sizes":["Grande"],"label":"Grande","val":"12 m, Scalare 9 m"},{"sizes":["Enorme"],"label":"Enorme","val":"12 m, Scalare 9 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"}],"bonus":"+8 Acrobazia (+12 per scalare rocce), +4 Percezione","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Colpo di testa","sec":false,"dice":"1d2","str":1.5,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Colpo di testa (1d2+1½For)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Corna","sec":false,"dice":"1d4","str":1.5,"crit":null,"extra":[]}],[{"n":2,"name":"Zoccoli","sec":true,"dice":"1d3","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Corna (1d4+1½For) o 2 Zoccoli (att.sec. -5TxC, 1d3+½For)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Corna","sec":false,"dice":"1d6","str":1.5,"crit":null,"extra":[]}],[{"n":2,"name":"Zoccoli","sec":true,"dice":"1d4","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Corna (1d6+1½For) o 2 Zoccoli (att.sec. -5TxC, 1d4+½For)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Corna","sec":false,"dice":"2d6","str":1.5,"crit":null,"extra":[]}],[{"n":2,"name":"Zoccoli","sec":true,"dice":"1d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"1,5 m","raw":"Corna (2d6+1½For) o 2 Zoccoli (att.sec. -5TxC, 1d6+½For)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Corna","sec":false,"dice":"2d8","str":1.5,"crit":null,"extra":[]}],[{"n":2,"name":"Zoccoli","sec":true,"dice":"1d8","str":0.5,"crit":null,"extra":[]}]],"spazio":"4,5 m","portata":"3 m","raw":"Corna (2d8+1½For) o 2 Zoccoli (att.sec. -5TxC, 1d8+½For)","lv18":false}},"note":[],"capacita":[{"nome":"Carica Possente","tag":"dal Media","corpo":"Quando effettua una Carica con le Corna, infligge danni raddoppiati: Media 2d6+2×For, Grande 4d6+2×For, Enorme 4d8+2×For."},{"nome":"Carica Mobile","tag":"dal Media","corpo":"Dopo una Carica Possente andata a segno, può muoversi fino a metà della propria velocità senza provocare attacchi di opportunità dal bersaglio caricato."},{"nome":"Passo sicuro","tag":null,"corpo":"La creatura ignora il terreno difficile naturale (rocce, neve, fango). Non conta come Scalare per i quadretti di roccia."}],"chiusura":"non fermarti mai: Carica Possente raddoppia dadi e Forza, Carica Mobile ti riporta fuori portata senza provocare attacchi di opportunità. Passo sicuro ti lascia scegliere qualsiasi percorso, ignorando il terreno accidentato.","canatExtra":0},{"nome":"Ungulato Pesante","cat":"Terrestri","specie":["Cavallo","Cavallo da guerra","Toro","Bisonte","Bue moscato"],"intro":"Gli ungulati pesanti sono animali da soma o da guerra, con una corporatura robusta e zoccoli pericolosi. Il toro aggiunge le corna alla sua dotazione. La loro mole li rende quasi impossibili da spostare, e nelle taglie maggiori possono Travolgere le creature più piccole.","vel":[{"sizes":["Minuscola","Piccola"],"label":"Minuscola–Piccola","val":"12 m"},{"sizes":["Media"],"label":"Media","val":"12 m"},{"sizes":["Grande"],"label":"Grande","val":"15 m"},{"sizes":["Enorme"],"label":"Enorme","val":"15 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"}],"bonus":"+4 Percezione","attacchi":{"Minuscola":{"alts":[[{"n":2,"name":"Zoccoli","sec":false,"dice":"1d2","str":1,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"2 Zoccoli (1d2+For)","lv18":false},"Piccola":{"alts":[[{"n":2,"name":"Zoccoli","sec":false,"dice":"1d3","str":1,"crit":null,"extra":[]},{"n":1,"name":"Morso","sec":true,"dice":"1d2","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"2 Zoccoli (1d3+For), Morso (att.sec. -5TxC, 1d2+½For)","lv18":false},"Media":{"alts":[[{"n":2,"name":"Zoccoli","sec":false,"dice":"1d4","str":1,"crit":null,"extra":[]},{"n":1,"name":"Morso","sec":true,"dice":"1d3","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"2 Zoccoli (1d4+For), Morso (att.sec. -5TxC, 1d3+½For)","lv18":false},"Grande":{"alts":[[{"n":2,"name":"Zoccoli","sec":false,"dice":"1d6","str":1,"crit":null,"extra":[]},{"n":1,"name":"Corna","sec":true,"dice":"1d8","str":0.5,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"1,5 m","raw":"2 Zoccoli (1d6+For), Corna (att.sec. -5TxC, 1d8+½For)","lv18":false},"Enorme":{"alts":[[{"n":2,"name":"Zoccoli","sec":false,"dice":"1d8","str":1,"crit":null,"extra":[]},{"n":1,"name":"Corna","sec":true,"dice":"2d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"4,5 m","portata":"3 m","raw":"2 Zoccoli (1d8+For), Corna (att.sec. -5TxC, 2d6+½For)","lv18":false}},"note":[],"capacita":[{"nome":"Carica con Zoccoli","tag":"dal Media","corpo":"Se carica e poi esegue un attacco completo, può usare un attacco extra con gli zoccoli al -5."},{"nome":"Travolgere","tag":"dal Grande","corpo":"Come azione di round completo, può tentare di Oltrepassare creature di almeno una taglia inferiore senza effettuare prove. I bersagli subiscono Grande: 3d6+2For; Enorme: 4d8+2For. CD 10+½DV+mod.For."},{"nome":"Stazza","tag":"dal Media","corpo":"La sua mole lo rende difficile da spostare: ottiene +4 alla CMD contro Spinta, Sbilanciare, Oltrepassare e Trascinare, e non può essere bersaglio del Travolgere di creature della sua taglia o inferiore."}],"chiusura":"forma da linea di contenimento: Stazza vale +4 alla CMD contro Spinta, Sbilanciare, Oltrepassare e Trascinare, e dal Grande Travolgere apre un varco senza bisogno di prove. Chiudi con Carica con Zoccoli per l'attacco extra.","canatExtra":0},{"nome":"Cinghiale / Suide","cat":"Terrestri","specie":["Maiale","Cinghiale","Facocero","Cinghiale Crudele","Pecari"],"intro":"I suidi sono animali robusti e straordinariamente tenaci. La Ferocia li rende particolarmente pericolosi quando feriti: non si ritirano, continuano ad attaccare anche con ferite mortali. Le zanne crescono con la taglia, diventando vere e proprie armi laceranti nelle versioni più grandi, soprattutto quando caricano.","vel":[{"sizes":["Minuscola","Piccola"],"label":"Minuscola–Piccola","val":"9 m"},{"sizes":["Media"],"label":"Media","val":"12 m"},{"sizes":["Grande"],"label":"Grande","val":"12 m"},{"sizes":["Enorme"],"label":"Enorme","val":"15 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"}],"bonus":"+4 Percezione","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso/Zanne","sec":false,"dice":"1d2","str":1.5,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Morso/Zanne (1d2+1½For)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Zanne","sec":false,"dice":"1d4","str":1.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Zanne (1d4+1½For)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Zanne","sec":false,"dice":"1d6","str":1.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Zanne (1d6+1½For)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Zanne","sec":false,"dice":"2d6","str":1.5,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"1,5 m","raw":"Zanne (2d6+1½For)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Zanne","sec":false,"dice":"3d8","str":1.5,"crit":null,"extra":[]}]],"spazio":"4,5 m","portata":"3 m","raw":"Zanne (3d8+1½For)","lv18":false}},"note":[],"capacita":[{"nome":"Ferocia","tag":null,"corpo":"Se a ≤ metà PF, ottiene bonus razziale +2 ai TxC in mischia e ai danni e +1 schivare alla CA. Inoltre, mentre è a ≤ metà PF è immune a Scosso, Spaventato e In Preda al Panico e non cade Privo di Sensi finché ha almeno 1 PF."},{"nome":"Carica Lacerante","tag":"dal Media","corpo":"Quando carica con le Zanne, infligge danni raddoppiati (dadi) e apre una ferita che provoca [SANGUINAMENTO]: il bersaglio perde all'inizio di ogni suo turno 1d4 PF (Media), 1d6 PF (Grande) o 1d8 PF (Enorme) finché non riceve cure magiche o una prova di Guarire (CD 15). Non cumulativo."},{"nome":"Incombente","tag":"dal Media","corpo":"Una volta al round, quando colpisce con le Zanne, può tentare Sbilanciare come azione gratuita senza provocare attacchi di opportunità."}],"chiusura":"Carica Lacerante è il colpo d'apertura: dadi raddoppiati e una ferita con effetto di [SANGUINAMENTO]. Poi resta in mischia e sfrutta Incombente per Sbilanciare gratis ogni round; Ferocia ti premia proprio quando i PF calano.","canatExtra":0},{"nome":"Ippopotamo","cat":"Terrestri","specie":["Ippopotamo","Ippopotamo Behemoth"],"intro":"L'ippopotamo è uno degli animali più pericolosi al mondo. Trascorre gran parte del tempo in acqua, dove la sua furtività è sorprendentemente alta e gli permette di sferrare agguati fulminei. Il sudore rossastro che secerne lo protegge dal calore e dalle malattie. Nelle taglie più grandi acquista la capacità di Capovolgere imbarcazioni.","vel":[{"sizes":["Minuscola","Piccola"],"label":"Minuscola–Piccola","val":"9 m, Nuotare 6 m"},{"sizes":["Media"],"label":"Media","val":"12 m, Nuotare 6 m"},{"sizes":["Grande"],"label":"Grande","val":"12 m, Nuotare 9 m"},{"sizes":["Enorme"],"label":"Enorme","val":"12 m, Nuotare 12 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"},{"sizes":["Enorme"],"label":"Enorme","val":"+10 Furtività sott'acqua aggiuntivo"}],"bonus":"+10 Furtività sott'acqua, +8 Nuotare","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d3","str":1.5,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Morso (1d3+1½For)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":1.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d6+1½For)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d8","str":1.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d8+1½For)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d8","str":1.5,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"1,5 m","raw":"Morso (2d8+1½For)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"4d8","str":1.5,"crit":"19-20","extra":["Afferrare"]}]],"spazio":"4,5 m","portata":"3 m","raw":"Morso (4d8+1½For più Afferrare, 19-20)","lv18":false}},"note":[],"capacita":[{"nome":"Sudore","tag":null,"corpo":"Il sudore rossastro protegge dai Danni Non Letali in ambienti caldi e conferisce bonus razziale +2 ai TS contro malattie non magiche."},{"nome":"Trattenere il fiato","tag":null,"corpo":"Può trattenere il fiato per round pari a 6× il punteggio di Costituzione prima di rischiare l'annegamento."},{"nome":"Agguato dalle Acque","tag":"dal Grande","corpo":"Quando attacca emergendo dall'acqua contro un bersaglio che non lo aveva individuato, sfruttando la sua Furtività sott'acqua, il Morso conta come attacco di Carica e, se colpisce, tenta automaticamente Afferrare senza prova. Un bersaglio Afferrato di taglia inferiore può essere trascinato sott'acqua, dove rischia l'annegamento."},{"nome":"Capovolgere","tag":null,"corpo":"Come attacco in Carica, può tentare di capovolgere un'imbarcazione di taglia pari o inferiore. Prova BMC, CD 25 (o prova Professione marinaio del capitano, prendendo il risultato più alto). Penalità -10 alla prova per ogni categoria di taglia dell'imbarcazione superiore a quella dell'ippopotamo."},{"nome":"Doppio Morso","tag":null,"corpo":"Come azione standard, può sferrare un singolo attacco con le fauci che bersaglia due creature adiacenti. Si effettua un solo TxC e si applica il danno separatamente a entrambi i bersagli. Conta come due attacchi per le penalità da attacchi multipli."}],"chiusura":"combatti dall'acqua: +10 Furtività sott'acqua e Agguato dalle Acque trasformano ogni fiume in un'imboscata. Doppio Morso colpisce due creature adiacenti con una sola azione standard, quindi cerca i nemici affiancati.","canatExtra":0},{"nome":"Rinoceronte","cat":"Terrestri","specie":["Rinoceronte","Rinoceronte Lanoso (preistorico)"],"intro":"Il rinoceronte è un corazzato vivente. La sua carica è tra le più devastanti del regno animale, e nelle taglie maggiori è in grado di Travolgere chiunque gli si pari davanti. Anche nelle taglie più piccole mantiene un'armatura naturale eccellente. Il rinoceronte standard vive in climi caldi e secchi; il rinoceronte lanoso è adattato alle steppe ghiacciate.","vel":[{"sizes":["Minuscola","Piccola","Media"],"label":"Minuscola–Media","val":"12 m"},{"sizes":["Grande"],"label":"Grande","val":"12 m"},{"sizes":["Enorme"],"label":"Enorme","val":"15 m"}],"sensi":[{"sizes":null,"label":"Rinoceronte standard","val":"Fiuto, Visione crepuscolare"},{"sizes":null,"label":"Rinoceronte Lanoso","val":"Fiuto, Visione crepuscolare"}],"bonus":"+4 Percezione","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Corno","sec":false,"dice":"1d4","str":1.5,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Corno (1d4+1½For)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Corno","sec":false,"dice":"1d8","str":1.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Corno (1d8+1½For)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Corno","sec":false,"dice":"1d10","str":1.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Corno (1d10+1½For)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Corno","sec":false,"dice":"2d8","str":1.5,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"1,5 m","raw":"Corno (2d8+1½For)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Corno","sec":false,"dice":"3d8","str":1.5,"crit":null,"extra":[]}]],"spazio":"4,5 m","portata":"3 m","raw":"Corno (3d8+1½For)","lv18":false}},"note":[],"capacita":[{"nome":"Carica Possente","tag":null,"corpo":"Quando effettua una Carica con il Corno, i danni sono raddoppiati (dadi) e la Forza conta doppia: Piccola 2d8+2×For, Media 2d10+2×For, Grande 4d8+2×For, Enorme 6d8+2×For."},{"nome":"Travolgere","tag":"dal Grande","corpo":"Come azione di round completo, Oltrepassa creature di almeno una taglia inferiore senza effettuare prove. Danni automatici: Grande 2d8+1½For, Enorme 3d8+1½For. Un Tiro Salvezza su Riflessi (CD 10+½DV+mod.For) dimezza."},{"nome":"Corazza naturale","tag":null,"corpo":"La creatura ottiene +1 aggiuntivo alla CA Naturale. Media e Grande RD 5/—, Enorme RD 10/—."},{"nome":"Adattamento al caldo","tag":"solo Rinoceronte standard","corpo":"Ignora i Danni Non Letali da ambienti caldi naturali (non magici) e ottiene RE 5 al fuoco. Ottiene +4 ai TS contro effetti del calore ambientale e incantesimi del fuoco che causano danni ambientali (non attacchi diretti)."},{"nome":"Adattamento al freddo","tag":"solo Rinoceronte Lanoso","corpo":"Ignora i Danni Non Letali da ambienti freddi naturali (non magici) e ottiene RE 5 al freddo. Ottiene +4 ai TS contro incantesimi ed effetti del freddo. Non può essere Rallentato o Intorpidito per cause ambientali naturali."}],"chiusura":"forma da un colpo solo: Carica Possente raddoppia dadi e Forza, e dal Grande Travolgere passa attraverso chiunque sia più piccolo. Corazza naturale copre la ritirata con RD 5/—, RD 10/— a Enorme.","canatExtra":1},{"nome":"Coccodrillo","cat":"Terrestri","specie":["Caimano Nano","Caimano","Coccodrillo","Coccodrillo Imperatore"],"intro":"I coccodrilli sono predatori in agguato sia in acqua che sulla terraferma. La loro Furtività in acqua è straordinaria e il morso, una volta agganciato, è quasi impossibile da spezzare. La Rotolata Letale permette di tramortire e affogare le prede in acqua.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"6 m, Nuotare 6 m"},{"sizes":["Piccola"],"label":"Piccola","val":"6 m, Nuotare 9 m"},{"sizes":["Media"],"label":"Media","val":"6 m, Nuotare 9 m"},{"sizes":["Grande"],"label":"Grande","val":"9 m, Nuotare 12 m, Scatto"},{"sizes":["Enorme"],"label":"Enorme","val":"9 m, Nuotare 12 m, Scatto"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"}],"bonus":"+8 Furtività in acqua, +8 Nuotare","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d3","str":1.5,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Morso (1d3+1½For)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":1.5,"crit":null,"extra":["Afferrare"]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d6+1½For più Afferrare)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":1.5,"crit":null,"extra":["Afferrare"]},{"n":1,"name":"Colpo di coda","sec":true,"dice":"1d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (2d6+1½For più Afferrare), Colpo di coda (att.sec. -5TxC, 1d6+½For)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"3d6","str":1.5,"crit":null,"extra":["Afferrare"]},{"n":1,"name":"Colpo di coda","sec":true,"dice":"1d8","str":0.5,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"1,5 m","raw":"Morso (3d6+1½For più Afferrare), Colpo di coda (att.sec. -5TxC, 1d8+½For)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"3d8","str":1.5,"crit":null,"extra":["Afferrare"]},{"n":1,"name":"Colpo di coda","sec":true,"dice":"2d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"4,5 m","portata":"3 m","raw":"Morso (3d8+1½For più Afferrare), Colpo di coda (att.sec. -5TxC, 2d6+½For)","lv18":false}},"note":[],"capacita":[{"nome":"Morsa Implacabile","tag":"dal Piccola","corpo":"Quando Afferra un bersaglio con il Morso, la presa delle sue fauci è quasi impossibile da spezzare: il bersaglio subisce -5 alle prove per liberarsi dalla Lotta e il coccodrillo infligge automaticamente il danno del Morso a ogni round in cui mantiene la presa, senza bisogno di una nuova prova né di un TxC."},{"nome":"Trattenere il fiato","tag":null,"corpo":"Può trattenere il fiato per round pari a 4× il punteggio di Costituzione."},{"nome":"Rotolata Letale","tag":"dal Media","corpo":"Quando in lotta con un nemico di pari taglia o inferiore, può tentare una prova di lotta per infliggere i danni del Morso e buttare il bersaglio prono. Se in acqua, la vittima prona rischia l'annegamento."},{"nome":"Scatto","tag":"dal Grande","corpo":"Una volta al minuto come azione gratuita, può effettuare uno scatto che aumenta la velocità terrestre di 15 m per 1 round."}],"chiusura":"aggancia e non mollare: Morsa Implacabile rende quasi impossibile spezzare la presa e Rotolata Letale converte la lotta in danno del Morso lasciando il bersaglio Prono. Con Trattenere il fiato puoi trascinarlo sott'acqua e lasciare che sia l'annegamento a chiudere.","canatExtra":0},{"nome":"Varano / Monitor","cat":"Terrestri","specie":["Varano del deserto","Varano di Komodo","Varano Gigante"],"intro":"I varani sono lucertole predatrici con un morso velenoso dovuto ai batteri nella saliva (o in alcuni casi a vere ghiandole del veleno). Sono eccellenti scalatori e nuotatori. Il veleno si fa più potente con l'aumentare della taglia, e nelle forme maggiori il morso strappa brandelli di carne lasciando la preda dissanguata e sfinita.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"9 m, Scalare 9 m, Nuotare 6 m"},{"sizes":["Piccola"],"label":"Piccola","val":"9 m, Scalare 9 m, Nuotare 6 m"},{"sizes":["Media"],"label":"Media","val":"9 m, Scalare 9 m, Nuotare 6 m"},{"sizes":["Grande"],"label":"Grande","val":"9 m, Scalare 6 m, Nuotare 6 m"},{"sizes":["Enorme"],"label":"Enorme","val":"12 m, Scalare 6 m, Nuotare 9 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"}],"bonus":"+4 Furtività, +4 Percezione, +8 Scalare, +8 Nuotare","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d2","str":0.5,"crit":null,"extra":["Veleno"]}]],"spazio":"0,75 m","portata":"0 m","raw":"Morso (1d2+½For più Veleno)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d4","str":1,"crit":null,"extra":["Veleno"]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d4+For più Veleno)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":1,"crit":null,"extra":["Veleno","Afferrare"]},{"n":1,"name":"Colpo di coda","sec":true,"dice":"1d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d6+For più Veleno più Afferrare), Colpo di coda (att.sec. -5TxC, 1d6+½For)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":1,"crit":null,"extra":["Veleno","Afferrare"]},{"n":1,"name":"Colpo di coda","sec":true,"dice":"1d8","str":0.5,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"1,5 m","raw":"Morso (2d6+For più Veleno più Afferrare), Colpo di coda (att.sec. -5TxC, 1d8+½For)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d8","str":1,"crit":null,"extra":["Veleno","Afferrare"]},{"n":1,"name":"Colpo di coda","sec":true,"dice":"2d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"4,5 m","portata":"3 m","raw":"Morso (2d8+For più Veleno più Afferrare), Colpo di coda (att.sec. -5TxC, 2d6+½For)","lv18":false}},"note":[],"capacita":[{"nome":"Veleno del Varano [VELENO]","tag":null,"corpo":"Frequenza 1 round (max 4): Minuscola/Piccola 1 danno a Cos; Media 1d2 a Cos; Grande 1d3 a Cos; Enorme 1d4 a Cos. Cura 1 TS (Piccola-Media) o 2 TS (Grande-Enorme). CD 10+½DV+mod.Cos."},{"nome":"Strappare","tag":"dal Grande","corpo":"Se ha Afferrato il bersaglio col Morso e supera una nuova prova di lotta, scuote violentemente la testa infliggendo danni pari al Morso (dadi + 1½For) e provocando [SANGUINAMENTO]: il bersaglio perde 1d4 PF (Grande) o 1d6 PF (Enorme) all'inizio di ogni suo turno finché non riceve cure magiche o una prova di Guarire (CD 15). Non cumulativo."},{"nome":"Preda Indebolita","tag":null,"corpo":"Una creatura che sta subendo contemporaneamente il Veleno del Varano e il Sanguinamento da Strappare è Affaticata finché almeno uno dei due effetti persiste (Esausta se già Affaticata)."}],"chiusura":"gioca sul lungo periodo: il Veleno del Varano erode la Costituzione round dopo round e dal Grande Strappare aggiunge il sanguinamento. Quando i due agiscono insieme, Preda Indebolita rende il bersaglio Affaticato: è lì che la forma ripaga.","canatExtra":0},{"nome":"Serpente Velenoso","cat":"Terrestri","specie":["Serpente velenoso piccolo","Vipera","Cobra","Serpente velenoso gigante"],"intro":"I serpenti velenosi usano il loro veleno per immobilizzare e uccidere le prede. La loro estrema flessibilità li rende ottimi scalatori e nuotatori. Alcuni percepiscono il calore corporeo delle prede (organo di Jacobson); le forme più grandi possono anche sputare il veleno a distanza.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"6 m, Nuotare 6 m, Scalare 6 m"},{"sizes":["Piccola"],"label":"Piccola","val":"9 m, Nuotare 9 m, Scalare 9 m"},{"sizes":["Media","Grande","Enorme"],"label":"Media–Enorme","val":"9 m, Nuotare 9 m, Scalare 9 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"},{"sizes":["Media","Grande","Enorme"],"label":"Media e superiore","val":"Percezione del calore 9 m (imprecisa)"}],"bonus":"+8 Acrobazia, +4 Furtività, +4 Percezione, +8 Scalare, +8 Nuotare","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d2","str":0.5,"crit":null,"extra":["Veleno"]}]],"spazio":"0,75 m","portata":"0 m","raw":"Morso (1d2+½For più Veleno)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d4","str":0.5,"crit":null,"extra":["Veleno"]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d4+½For più Veleno)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":0.5,"crit":null,"extra":["Veleno"]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d6+½For più Veleno)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d8","str":0.5,"crit":null,"extra":["Veleno"]}]],"spazio":"3 m","portata":"1,5 m","raw":"Morso (1d8+½For più Veleno)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":0.5,"crit":null,"extra":["Veleno"]}]],"spazio":"4,5 m","portata":"3 m","raw":"Morso (2d6+½For più Veleno)","lv18":false}},"note":[],"capacita":[{"nome":"Veleno [VELENO]","tag":null,"corpo":"Frequenza 1 round (max 6). Danno a Cos: Minuscola 1; Piccola 1d2; Media 1d3; Grande 1d4; Enorme 1d6. Cura 1 TS (Minuscola- Media) o 2 TS (Grande-Enorme). CD 10+½DV+mod.Cos. Dopo il secondo Tiro Salvezza fallito, il bersaglio è anche Barcollante finché il veleno persiste."},{"nome":"Sputo Velenoso","tag":"dal Media","corpo":"Come azione standard, sputa veleno fino a 4,5 m con un attacco di contatto a distanza. Se colpisce, il bersaglio è Accecato per 1d4 round (Tiro Salvezza su Riflessi CD 10+½DV+mod.Cos riduce a 1 solo round) e subisce il Veleno."}],"chiusura":"colpisci e allontanati: il Veleno ha frequenza 1 round fino a 6, quindi continua a lavorare anche se non colpisci più. Dal Media lo Sputo Velenoso è un attacco di contatto a distanza, prezioso contro chi ha CA alta ma nessuna difesa dai veleni.","canatExtra":0},{"nome":"Serpente Costrittore","cat":"Terrestri","specie":["Boa","Pitone","Anaconda","Serpente costrittore gigante"],"intro":"I serpenti costrittori uccidono le prede stringendole fino ad asfissia. Non hanno veleno, compensando con la forza dello Stritolamento, che soffoca chi vi resta intrappolato. Nelle taglie enormi possono inghiottire le prede.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"6 m, Nuotare 6 m, Scalare 6 m"},{"sizes":["Piccola","Media"],"label":"Piccola–Media","val":"9 m, Nuotare 9 m, Scalare 9 m"},{"sizes":["Grande"],"label":"Grande","val":"9 m, Nuotare 9 m, Scalare 9 m"},{"sizes":["Enorme"],"label":"Enorme","val":"9 m, Nuotare 9 m, Scalare 9 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"},{"sizes":["Media","Grande","Enorme"],"label":"Media e superiore","val":"Percezione del calore 9 m (imprecisa)"}],"bonus":"+8 Acrobazia, +4 Furtività, +4 Percezione, +8 Scalare, +8 Nuotare","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d4","str":1.5,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Morso (1d4+1½For)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":1.5,"crit":null,"extra":["Afferrare"]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d6+1½For più Afferrare)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d8","str":1.5,"crit":null,"extra":["Afferrare"]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d8+1½For più Afferrare)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":1.5,"crit":null,"extra":["Afferrare"]}]],"spazio":"3 m","portata":"1,5 m","raw":"Morso (2d6+1½For più Afferrare)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"3d8","str":1.5,"crit":null,"extra":["Afferrare"]}]],"spazio":"4,5 m","portata":"3 m","raw":"Morso (3d8+1½For più Afferrare)","lv18":false}},"note":[],"capacita":[{"nome":"Stritolamento Asfissiante","tag":"dal Piccola","corpo":"Infligge danni contundenti con ogni prova di Lottare riuscita per mantenere la presa: Piccola 1d6+2For; Media 1d8+2For; Grande 2d6+2For; Enorme 3d8+2For. Un bersaglio Afferrato non può respirare (trattiene il fiato per 2×Cos round, poi soffoca) e subisce -5 alle prove per liberarsi dalla Lotta."},{"nome":"Inghiottire","tag":"solo Enorme","corpo":"Se inizia il turno con un avversario di taglia Grande o inferiore Afferrato in bocca, può tentare una nuova prova di lotta (BMC) per inghiottirlo. La preda inghiottita è considerata In Lotta e Accecata, subisce 4d6+For danni contundenti per round e può agire solo con armi leggere o attacchi naturali. Per tagliarsi un varco deve colpire con un'arma tagliente o perforante l'interno della creatura, che ha CA 16 (10 + CA Naturale della forma Enorme), infliggendo PF pari a 1/10 dei PF massimi del druido (arrotondati per eccesso), poiché in Forma Selvatica è il druido a fornire i propri PF. Aperto il varco la preda esce; la forma non può inghiottire di nuovo finché la ferita non è rimarginata."}],"chiusura":"forma da bersaglio singolo: aggancia il nemico più pericoloso e stringi, perché Stritolamento Asfissiante infligge danni a ogni prova di Lottare riuscita. A Enorme, Inghiottire toglie di scena un avversario di taglia Grande o inferiore per diversi round.","canatExtra":0},{"nome":"Tartaruga Azzannatrice","cat":"Terrestri","specie":["Tartaruga azzannatrice comune","Tartaruga azzannatrice alligatora","Tartaruga azzannatrice gigante"],"intro":"La tartaruga azzannatrice è un rettile semi-acquatico dal temperamento aggressivo e dal morso formidabile. Lenta sulla terraferma, è sorprendentemente efficace in acqua. Il suo guscio resistente la protegge dai predatori, e può ritirarsi al suo interno per diventare quasi impenetrabile. Nelle taglie maggiori il morso può spezzare ossa e armi.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"6 m, Nuotare 9 m"},{"sizes":["Piccola"],"label":"Piccola","val":"6 m, Nuotare 9 m"},{"sizes":["Media"],"label":"Media","val":"6 m, Nuotare 9 m"},{"sizes":["Grande"],"label":"Grande","val":"9 m, Nuotare 12 m"},{"sizes":["Enorme"],"label":"Enorme","val":"9 m, Nuotare 12 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"}],"bonus":"+8 Nuotare, +4 Percezione","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d3","str":1.5,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Morso (1d3+1½For)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":1.5,"crit":null,"extra":["Afferrare"]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d6+1½For più Afferrare)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d8","str":1.5,"crit":"19-20","extra":["Afferrare"]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d8+1½For più Afferrare, 19-20)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":1.5,"crit":"19-20","extra":["Afferrare"]}]],"spazio":"3 m","portata":"1,5 m","raw":"Morso (2d6+1½For più Afferrare, 19-20)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"4d6","str":1.5,"crit":"19-20","extra":["Afferrare"]}]],"spazio":"4,5 m","portata":"3 m","raw":"Morso (4d6+1½For più Afferrare, 19-20)","lv18":false}},"note":[],"capacita":[{"nome":"Guscio Corazzato","tag":null,"corpo":"La tartaruga ottiene +2 aggiuntivo alla CA Naturale oltre ai valori della tabella taglie. Come azione standard può ritirarsi nel guscio: ottiene +6 CA aggiuntiva ma non può effettuare attacchi né muoversi. Uscire dal guscio richiede un'azione di movimento."},{"nome":"Morso Ferreo","tag":"dal Piccola","corpo":"Una volta afferrato il bersaglio con il morso, infligge automaticamente i danni del morso all'inizio di ogni round senza effettuare nuove prove. Il bersaglio subisce penalità -4 alle prove di lotta per liberarsi."},{"nome":"Trattenere il fiato","tag":null,"corpo":"Può trattenere il fiato per round pari a 4× il punteggio di Costituzione prima di rischiare l'annegamento."},{"nome":"Morso Decapitatore","tag":"solo Enorme","corpo":"Con un critico confermato, le fauci si chiudono con una pressione capace di troncare ossa e arti. Il bersaglio subisce il danno normale del morso, poi deve superare un TS Tempra (CD 10+½DV+mod.For). Se fallisce, subisce una mutilazione permanente determinata dalla locazione colpita (tira sul sistema di locazione): Arto (braccio/gamba/ala): l'arto viene amputato di netto; si applicano le normali conseguenze dell'amputazione. Testa/Collo: decapitazione — una creatura di taglia pari o inferiore alla tartaruga e non immune ai critici muore all'istante; una creatura più grande subisce invece 6d6 danni e 1d4 Cos permanente. Torso: morso lacerante, 4d6 danni aggiuntivi e Sanguinamento 2d6. Chi supera il TS subisce comunque 1d4 Cos temporaneo dalla morsa."}],"chiusura":"la forma più difensiva del volume: Guscio Corazzato aggiunge +2 alla CA Naturale e ti lascia ritirarti nel guscio quando la situazione peggiora. In acqua, Morso Ferreo infligge i danni del morso in automatico a ogni round di presa; a Enorme il Morso Decapitatore chiude i critici.","canatExtra":2},{"nome":"Primate","cat":"Terrestri","specie":["Scimmia","Babbuino","Gorilla","Scimpanzé","Orango","Scimmia urlatrice"],"intro":"I primati hanno mani prensili, eccellente mobilità verticale e intelligenza superiore agli altri animali. Nelle taglie grandi il gorilla diventa un guerriero formidabile con i Pugni potenti.","vel":[{"sizes":["Minuscola","Piccola"],"label":"Minuscola–Piccola","val":"9 m, Scalare 9 m"},{"sizes":["Media"],"label":"Media","val":"12 m, Scalare 12 m"},{"sizes":["Grande"],"label":"Grande","val":"12 m, Scalare 9 m"},{"sizes":["Enorme"],"label":"Enorme","val":"12 m, Scalare
