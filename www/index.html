,"nome":"Behemoth","cat":"Aspetti terrestri","animali":["Elefante / Mammuth","Rinoceronte","Ippopotamo"],"minore":"pelle spessa, grigia e screpolata, corporatura tozza e massiccia, passo che fa tremare il terreno.","passivo":"bonus di competenza +4 alla DMC contro le manovre di Spingere, Sbilanciare, Oltrepassare e Trascinare, e bonus di competenza +4 alle proprie manovre di Oltrepassare e Spingere.","potenziamento":"+1 alla CA naturale, che diventa +2 all'8° livello e +3 al 15°.","nota":""},{"id":6,"nome":"Rettile d'agguato","cat":"Aspetti terrestri","animali":["Coccodrillo","Varano / Monitor","Tartaruga Azzannatrice"],"minore":"scaglie cornee sul dorso e sulle braccia, mascella allungata, denti a uncino, occhi immobili.","passivo":"quando il morfico afferra un nemico con un attacco naturale, la vittima subisce -4 alle prove per liberarsi dalla lotta. Inoltre il morfico può trattenere il fiato per un numero di round pari a 4 × il proprio punteggio di Costituzione.","potenziamento":"+2 Costituzione, che diventa +4 all'8° livello e +6 al 15°.","nota":""},{"id":7,"nome":"Serpente","cat":"Aspetti terrestri","animali":["Serpente Velenoso","Serpente Costrittore"],"minore":"scaglie lisce e lucide, lingua bifida, pupille verticali, articolazioni ipermobili.","passivo":"bonus di competenza +4 alle prove di Artista della fuga e alle prove per divincolarsi dalla lotta; il morfico può inoltre passare attraverso aperture grandi la metà di quelle normalmente attraversabili senza rallentare. Ottiene infine bonus di competenza +4 ai Tiri Salvezza contro gli effetti di [VELENO].","potenziamento":"+2 Destrezza, che all'8° livello diventa +2 Destrezza e +2 Costituzione, e al 15° +4 Destrezza e +2 Costituzione.","nota":""},{"id":8,"nome":"Primate","cat":"Aspetti terrestri","animali":["Primate"],"minore":"braccia allungate e nodose, mani e piedi prensili, torace ampio, fronte bassa.","passivo":"bonus di competenza +4 alle prove di Scalare e di Acrobazia. Inoltre, una volta per round, quando il morfico colpisce un nemico con un attacco naturale di Artigli o di Pugni, può tentare gratuitamente contro quel bersaglio una manovra di Disarmare o di Rubare che non provoca attacchi di opportunità.","potenziamento":"+2 Destrezza, che all'8° livello diventa +2 Destrezza e +2 Forza, e al 15° +4 Destrezza e +2 Forza.","nota":""},{"id":9,"nome":"Mustelide","cat":"Aspetti terrestri","animali":["Mustelide","Ratto"],"minore":"corpo affusolato e allungato, vibrisse sensibili, pelliccia fitta, spalle che si dislocano a comando.","passivo":"il morfico può attraversare gli spazi occupati da creature di taglia superiore alla propria senza provocare attacchi di opportunità e può passare attraverso aperture grandi la metà di quelle normalmente attraversabili. Inoltre, mentre si trova a metà o meno dei propri Punti Ferita, non può essere reso Scosso, Spaventato né In Preda al Panico.","potenziamento":"velocità di Scalata pari a metà della propria velocità su terreno, che all'8° livello diventa pari alla propria velocità su terreno e al 15° pari alla propria velocità su terreno +3 m.","nota":""},{"id":10,"nome":"Difensore tossico","cat":"Aspetti terrestri","animali":["Puzzola","Istrice","Rospo"],"minore":"pelle ghiandolare e lucida, setole rigide lungo la schiena, odore acre e persistente.","passivo":"qualsiasi creatura che colpisca il morfico con un attacco naturale o senz'armi, o che tenti di afferrarlo, subisce automaticamente 1d6 danni (una sola volta per turno per attaccante); questo danno sale a 2d6 al 10° livello. Inoltre, una volta al giorno come azione standard, il morfico può emettere una secrezione nauseabonda in un cono di 4,5 m: le creature nell'area devono superare un Tiro Salvezza su Tempra con CD 10 + metà livello di morfico + bonus di Costituzione o essere Nauseate per 1 round.","potenziamento":"+2 Costituzione, che diventa +4 all'8° livello e +6 al 15°.","nota":""},{"id":11,"nome":"Bipede corridore","cat":"Aspetti terrestri","animali":["Uccello Terrestre","Canguro"],"minore":"gambe digitigrade dai tendini elastici, ginocchia rovesciate, bacino stretto, equilibrio da corridore.","passivo":"il morfico non provoca attacchi di opportunità quando salta sopra o attraverso lo spazio occupato da un nemico e ottiene bonus di competenza +4 alle prove di Acrobazia. Inoltre, se in un turno si muove di almeno 6 m prima di attaccare, il primo attacco naturale che effettua in quel turno infligge +2 ai tiri per i danni.","potenziamento":"bonus di potenziamento +3 m alla velocità su terreno, che diventa +6 m all'8° livello e +9 m al 15°.","nota":""},{"id":12,"nome":"Alato","cat":"Aspetto volante","animali":["Rapace / Uccello da Preda","Pipistrello"],"minore":"penne rade o membrane rudimentali lungo le braccia, ossa alleggerite, occhi grandi, orecchie mobili.","passivo":"bonus di competenza +4 alle prove di Percezione; il morfico dimezza inoltre le penalità dovute alla distanza a tali prove. Infine, quando cade, calcola i danni da caduta come se questa fosse più corta di 6 m e atterra sempre in piedi anziché Prono.","potenziamento":"bonus di potenziamento +2 alle prove di Iniziativa, che diventa +4 all'8° livello e +6 al 15°.","nota":"l'aspetto Alato non concede volo in forma minore. Il volo si ottiene solo con la forma maggiore, sotto la Regola del Volo a Bassa Quota del Libro delle forme selvatiche."},{"id":13,"nome":"Predatore marino","cat":"Aspetti acquatici","animali":["Cetaceo","Squalo"],"minore":"pelle liscia e cerulea, dita palmate, fessure branchiali abbozzate sul collo, denti a lama.","passivo":"il morfico percepisce il sangue delle creature ferite entro 18 m e non può essere colto di sorpresa da una creatura che si trovi a metà o meno dei propri Punti Ferita entro tale raggio; contro simili creature infligge inoltre +2 ai tiri per i danni in mischia. Può infine trattenere il fiato per un numero di round pari a 8 × il proprio punteggio di Costituzione.","potenziamento":"velocità di Nuotare pari a metà della propria velocità su terreno, che all'8° livello diventa pari alla propria velocità su terreno e al 15° pari alla propria velocità su terreno +3 m.","nota":""},{"id":14,"nome":"Cefalopode","cat":"Aspetti acquatici","animali":["Cefalopode","Cavalluccio Marino"],"minore":"pelle cangiante che muta colore da sé, arti privi di ossa, occhi laterali dalla pupilla orizzontale.","passivo":"come azione gratuita il morfico può alterare il proprio colore per confondersi con l'ambiente circostante, ottenendo bonus di competenza +8 alle prove di Furtività finché resta fermo, che si riduce a +4 se si muove. Inoltre, quando è In Lotta o Immobilizzato, una volta per round può tentare di liberarsi come azione veloce anziché come azione standard.","potenziamento":"+2 Destrezza, che diventa +4 all'8° livello e +6 al 15°.","nota":""},{"id":15,"nome":"Abitante dei fondali","cat":"Aspetti acquatici","animali":["Pastinaca","Razza Elettrica","Anguilla Elettrica"],"minore":"corpo appiattito, pelle priva di squame percorsa da linee sensoriali, occhi piccoli e ravvicinati.","passivo":"mentre è immerso in acqua o a contatto con il terreno, il morfico ottiene Percezione cieca 9 m. Inoltre, quando attacca una creatura che non lo ha ancora individuato, il primo attacco naturale infligge 1d6 danni aggiuntivi; questo danno sale a 2d6 al 12° livello.","potenziamento":"+2 Costituzione, che diventa +4 all'8° livello e +6 al 15°.","nota":""},{"id":16,"nome":"Teropode","cat":"Aspetti preistorici","animali":["Rapace Bipede","Spinosauro","Dilofosauro Sputatore"],"minore":"postura inclinata in avanti, sperone falcato su ciascun piede, cresta ossea sulla fronte, occhi da rapace.","passivo":"il morfico ottiene bonus di competenza +2 ai tiri per colpire quando effettua una carica. Inoltre, se colpisce lo stesso bersaglio con due o più attacchi naturali nello stesso round, affonda gli speroni e provoca effetto di [SANGUINAMENTO]: la vittima perde 1d6 Punti Ferita all'inizio di ogni suo turno finché non riceve cure magiche o una prova di Guarire riuscita (CD 15). Questo effetto non è cumulabile con sé stesso.","potenziamento":"+2 Forza, che all'8° livello diventa +2 Forza e +2 Destrezza, e al 15° +4 Forza e +2 Destrezza.","nota":""},{"id":17,"nome":"Titano corazzato","cat":"Aspetti preistorici","animali":["Ceratopside","Tiranosauride corazzato a coda","Sauropode"],"minore":"placche ossee lungo la schiena e le spalle, collo tozzo, pelle spessa come cuoio indurito.","passivo":"il morfico ottiene RD 2/—, che diventa RD 5/— al 12° livello. Inoltre non può essere fiancheggiato da creature di taglia inferiore alla propria.","potenziamento":"+1 alla CA naturale, che diventa +2 all'8° livello e +3 al 15°.","nota":""}];
const ASP_VEG = [{"id":101,"nome":"Annullamente","cat":"Aspetti vegetali","animali":["Annullamente"],"minore":"pelle grigio-fungina che si screpola come corteccia di betulla, occhi lattiginosi senza pupilla, un pulviscolo di spore che si stacca a ogni movimento.","passivo":"Visione crepuscolare; bonus razziale +4 ai Tiri Salvezza contro gli effetti di [INFLUENZA MENTALE]; finché ha i piedi a contatto con terreno naturale non può essere Sbilanciato.","potenziamento":"+2 Costituzione (1°) → +4 Cos (8°) → +6 Cos (15°).","nota":""},{"id":102,"nome":"Ficomide","cat":"Aspetti vegetali","animali":["Ficomide"],"minore":"escrescenze fungine giallastre lungo le braccia, pelle umida e traslucida, dita che lasciano impronte di muffa.","passivo":"Percezione tellurica 9 m, attiva solo a contatto con terreno naturale o roccia grezza; resistenza all'acido 10 (20 dal 10° livello).","potenziamento":"+2 Destrezza (1°) → +4 Des (8°) → +6 Des (15°).","nota":""},{"id":103,"nome":"Mandragora","cat":"Aspetti vegetali","animali":["Mandragora"],"minore":"carnagione terrosa e nodosa come una radice appena estratta, lineamenti contorti in una smorfia, voce che esce come uno stridio.","passivo":"Visione crepuscolare; ignora il terreno difficile di radici e sottobosco; bonus razziale +4 alle prove di Intimidire e di Furtività nel sottobosco (+6 all'8° livello, +8 al 15°).","potenziamento":"+3 m velocità sul terreno (1°) → +6 m (8°) → +9 m (15°).","nota":""},{"id":104,"nome":"Ortica dei Pantani","cat":"Aspetti vegetali","animali":["Ortica dei Pantani"],"minore":"pelle verde scuro coperta di peluria urticante, aculei sottili lungo gli avambracci, odore di acqua ferma.","passivo":"Visione crepuscolare; RD 2/tagliente o contundente (RD 5 dal 10° livello); ignora il terreno difficile di fango e acquitrino; bonus razziale +4 alle prove di Nuotare (+6 all'8° livello, +8 al 15°).","potenziamento":"velocità di Nuotare pari a metà della velocità sul terreno (1°) → pari alla velocità sul terreno (8°) → velocità sul terreno +3 m (15°).","nota":""},{"id":105,"nome":"Basidirond","cat":"Aspetti vegetali","animali":["Basidirond"],"minore":"cappello fungino livido che gli scende sulla nuca, pelle fredda al tatto, alito che condensa anche al caldo.","passivo":"Percezione tellurica 18 m; resistenza al freddo 10 (20 dal 10° livello).","potenziamento":"+2 Costituzione (1°) → +4 Cos (8°) → +6 Cos (15°).","nota":"Il Letargo Invernale resta alla forma maggiore, come tutte le debolezze."},{"id":106,"nome":"Erba Vorace","cat":"Aspetti vegetali","animali":["Erba Vorace"],"minore":"capelli come steli affilati che si muovono senza vento, tagli sottili sulla pelle che trasudano linfa rossa, sguardo fisso su chi sanguina.","passivo":"Visione crepuscolare; RD 2/tagliente (RD 5 dal 10° livello); quando infligge danni a una creatura affetta da effetti di [SANGUINAMENTO] recupera 2 punti ferita, una sola volta per round (4 punti ferita dal 10° livello).","potenziamento":"+2 Forza (1°) → +4 For (8°) → +6 For (15°).","nota":""},{"id":107,"nome":"Erbafrusta","cat":"Aspetti vegetali","animali":["Erbafrusta"],"minore":"braccia allungate e flessibili come tralci, pelle verdastra e coriacea, un tanfo dolciastro che precede il suo arrivo.","passivo":"Vista cieca 9 m; bonus razziale +4 ai Tiri Salvezza contro gli effetti di [VELENO] e di [MALATTIA]; le sue prese e le manovre di Lottare non provocano attacchi di opportunità.","potenziamento":"+1 CA naturale (1°) → +2 (8°) → +3 (15°).","nota":""},{"id":108,"nome":"Psicospora","cat":"Aspetti vegetali","animali":["Psicospora"],"minore":"corona di corpi fruttiferi lungo la schiena, occhi disposti a raggiera sulle tempie, muschio azzurrino nelle pieghe della pelle.","passivo":"Scurovisione 18 m e Visione a 360°: non può essere Colto alla sprovvista dagli attacchi ai fianchi e non concede il bonus di Attaccare ai Fianchi; resistenza al fuoco 10 (20 dal 10° livello).","potenziamento":"+2 Saggezza (1°) → +4 Sag (8°) → +6 Sag (15°).","nota":""},{"id":109,"nome":"Ascomoide","cat":"Aspetti vegetali","animali":["Ascomoide"],"minore":"corpo tozzo e globoso coperto di pori dilatati, pelle giallastra e tesa, sbuffi di spore a ogni respiro.","passivo":"Percezione tellurica 18 m; resistenza al fuoco 10 e all'elettricità 10 (20 ciascuna dal 10° livello); bonus razziale +4 alle prove di Furtività nel sottobosco (+6 all'8° livello, +8 al 15°); finché ha i piedi a contatto con terreno naturale non può essere Sbilanciato.","potenziamento":"+2 Forza (1°) → +4 For (8°) → +6 For (15°).","nota":""},{"id":110,"nome":"Cumulo Strisciante","cat":"Aspetti vegetali","animali":["Cumulo Strisciante"],"minore":"massa di viticci e detriti vegetali intrecciati sotto la pelle, capelli come radici bagnate, gocciolio continuo.","passivo":"Scurovisione 18 m; bonus razziale +4 alle prove di Percezione e di Furtività in ambienti boschivi o palustri (+6 all'8° livello, +8 al 15°); quando subisce danni da elettricità ne è comunque colpito, ma ottiene 1 punto ferita temporaneo per Dado Vita posseduto, che svanisce dopo 1 ora.","potenziamento":"+2 Costituzione (1°) → +4 Cos (8°) → +6 Cos (15°).","nota":""},{"id":111,"nome":"Fiore della Cripta","cat":"Aspetti vegetali","animali":["Fiore della Cripta"],"minore":"petali carnosi e violacei aperti sul collo, bocca troppo larga, odore dolciastro di decomposizione.","passivo":"Percezione tellurica 9 m e Scurovisione 18 m; resistenza all'acido 10 (20 dal 10° livello); quando una creatura conferma un colpo critico contro di lui con un'arma tagliente o perforante, la ferita zampilla e quella creatura subisce 2d6 danni da acido (4d6 dal 10° livello), ridotti a metà con un Tiro Salvezza su Riflessi riuscito (CD 10 + metà livello di morfico + bonus di Costituzione).","potenziamento":"+2 Forza (1°) → +4 For (8°) → +6 For (15°).","nota":""},{"id":112,"nome":"Liana Assassina","cat":"Aspetti vegetali","animali":["Liana Assassina"],"minore":"tralci spessi avvolti attorno agli arti, pelle marrone e fibrosa, immobilità assoluta quando sta fermo.","passivo":"Vista cieca 9 m e Scurovisione 18 m; resistenza al fuoco, al freddo e all'elettricità 10 (20 ciascuna dal 10° livello); quando resta immobile fra la vegetazione ottiene un bonus razziale +4 alle prove di Furtività anche in piena vista (+6 all'8° livello, +8 al 15°).","potenziamento":"+3 m velocità sul terreno (1°) → +6 m (8°) → +9 m (15°).","nota":"Il potenziamento compensa la forma più lenta del volume: 1,5 m a ogni taglia fino all'Enorme."},{"id":113,"nome":"Rovo Sanguinario","cat":"Aspetti vegetali","animali":["Rovo Sanguinario"],"minore":"spine ricurve lungo le braccia e le spalle, pelle scura punteggiata di bacche rosse, movimenti a scatti.","passivo":"Percezione tellurica 9 m; ignora il terreno difficile di rovi e sterpaglia; quando una creatura lo colpisce con un attacco senz'armi o naturale, oppure riesce in una manovra di Lottare contro di lui, subisce 1d6 danni perforanti dalle spine (2d6 dal 10° livello). Dal 10° livello la ferita provoca inoltre un effetto di [SANGUINAMENTO] 1d4.","potenziamento":"+2 Iniziativa (1°) → +4 (8°) → +6 (15°).","nota":""},{"id":114,"nome":"Alraune","cat":"Aspetti vegetali","animali":["Alraune"],"minore":"corolla di petali chiari attorno al volto, pelle chiara percorsa da venature verdi, profumo intenso che resta nell'aria.","passivo":"Visione crepuscolare; bonus razziale +4 alle prove di Diplomazia e ai Tiri Salvezza contro gli effetti di [EMOZIONE] (+6 all'8° livello, +8 al 15°); finché ha i piedi a contatto con terreno naturale non può essere Sbilanciata.","potenziamento":"+2 Carisma (1°) → +4 Car (8°) → +6 Car (15°).","nota":""},{"id":115,"nome":"Albero dell'Impiccato","cat":"Aspetti vegetali","animali":["Albero dell'Impiccato"],"minore":"corteccia nera e spaccata al posto della pelle, rami sottili che spuntano dalle spalle, cavità scura al centro del petto.","passivo":"Vista cieca 18 m; bonus razziale +4 alle prove di Lottare per mantenere una presa (+6 all'8° livello, +8 al 15°); quando afferra una creatura non riceve la condizione In Lotta.","potenziamento":"+2 Forza (1°) → +4 For (8°) → +6 For (15°).","nota":""},{"id":116,"nome":"Drosera Gigante","cat":"Aspetti vegetali","animali":["Drosera Gigante"],"minore":"peluria rossastra sul dorso delle mani terminante in goccioline vischiose, pelle lucida, tutto ciò che tocca resta appiccicato.","passivo":"Percezione tellurica 18 m; resistenza all'acido 10 (20 dal 10° livello); la prima creatura che lo colpisce con un'arma da mischia impugnata in ogni round deve superare un Tiro Salvezza su Riflessi (CD 10 + metà livello di morfico + bonus di Costituzione) o l'arma resta incollata alla sua pelle, e liberarla richiede un'azione standard e una prova di Forza con CD 20.","potenziamento":"+1 CA naturale (1°) → +2 (8°) → +3 (15°).","nota":""},{"id":117,"nome":"Fiore Lunare","cat":"Aspetti vegetali","animali":["Fiore Lunare"],"minore":"pelle pallida che emette un tenue chiarore azzurro nell'oscurità, boccioli chiusi lungo la schiena, tentacoli sottili al posto dei capelli.","passivo":"Scurovisione 18 m; resistenza al freddo e all'elettricità 10 (20 ciascuna dal 10° livello); bonus razziale +4 alle prove di Furtività in ambienti boschivi (+6 all'8° livello, +8 al 15°); una volta al giorno, come azione veloce, può emettere una pulsazione luminosa che costringe le creature entro 6 m a superare un Tiro Salvezza su Tempra (CD 10 + metà livello di morfico + bonus di Costituzione) o restare Abbagliate per 1d4 round.","potenziamento":"+2 Destrezza (1°) → +4 Des (8°) → +6 Des (15°).","nota":"La vulnerabilità al fuoco resta alla forma maggiore."},{"id":118,"nome":"Jinmenju","cat":"Aspetti vegetali","animali":["Jinmenju"],"minore":"piccoli volti abbozzati che affiorano e svaniscono sulla pelle delle braccia, occhi su tutti i lati del capo, un ronzio sommesso che lo accompagna sempre.","passivo":"Percezione cieca 9 m e Visione a 360°: non può essere Colto alla sprovvista dagli attacchi ai fianchi e non concede il bonus di Attaccare ai Fianchi; bonus razziale +4 ai Tiri Salvezza contro gli effetti di [VELENO] (+6 all'8° livello, +8 al 15°); le creature che iniziano il proprio turno adiacenti a lui subiscono una penalità −2 alle prove di Concentrazione.","potenziamento":"+2 Carisma (1°) → +4 Car (8°) → +6 Car (15°).","nota":""},{"id":119,"nome":"Kapre","cat":"Aspetti vegetali","animali":["Kapre"],"minore":"corporatura allungata e fibrosa, pelle scura come legno bagnato, fumo denso che gli esce dalla bocca a ogni parola.","passivo":"Scurovisione 18 m; bonus razziale +4 alle prove di Percezione, Furtività e Scalare (+6 all'8° livello, +8 al 15°); chi tenta di seguire le sue tracce subisce +5 alla CD della prova di Sopravvivenza (+10 dal 10° livello).","potenziamento":"velocità di Scalare pari a metà della velocità sul terreno (1°) → pari alla velocità sul terreno (8°) → velocità sul terreno +3 m (15°).","nota":""},{"id":120,"nome":"Loto Cadaverico","cat":"Aspetti vegetali","animali":["Loto Cadaverico"],"minore":"petali carnosi color carne appassita sulle spalle, occhi disposti tutt'intorno al capo, odore stagnante di palude.","passivo":"Percezione tellurica 9 m, Scurovisione 18 m e Visione a 360°: non può essere Colto alla sprovvista dagli attacchi ai fianchi e non concede il bonus di Attaccare ai Fianchi; resistenza all'acido e all'elettricità 10 (20 ciascuna dal 10° livello); finché resta immobile fra la vegetazione acquatica ottiene un bonus razziale +4 alle prove di Furtività anche in piena vista (+6 all'8° livello, +8 al 15°).","potenziamento":"+2 Costituzione (1°) → +4 Cos (8°) → +6 Cos (15°).","nota":""},{"id":121,"nome":"Pianta Carnivora","cat":"Aspetti vegetali","animali":["Pianta Carnivora"],"minore":"fauci vegetali che si aprono sulle spalle e sugli avambracci, pelle screziata di rosso e verde, saliva acida.","passivo":"Percezione tellurica 18 m; resistenza all'acido 10 (20 dal 10° livello); bonus razziale +4 alle prove di Furtività nel sottobosco (+6 all'8° livello, +8 al 15°); fiora tra le scapole, apparato boccale uncinato al posto dei denti anteriori, arti corti e prensili che non lasciano mai la presa.","passivo":"Percezione tellurica 6 m e Visione crepuscolare; bonus razziale +4 alle prove di Furtività in ambienti boschivi e nel fogliame e alle prove di Lottare per mantenere una presa (+6 all'8° livello, +8 al 15°); quando colpisce una creatura con un attacco naturale, quella creatura non si accorge della ferita per 1 round (1d4 round dal 10° livello) a meno che non superi una prova di Percezione con CD 15 + metà livello di morfico.","potenziamento":"velocità di Scalare pari a metà della velocità sul terreno (1°) → pari alla velocità sul terreno (8°) → velocità sul terreno +3 m (15°).","nota":""},{"id":226,"nome":"Pulce","cat":"Aspetti parassitici · vermi ed ematofagi","animali":["Pulce"],"minore":"corpo compresso lateralmente e durissimo al tatto, cosce posteriori caricate a molla che non si distendono mai del tutto, capo minuto con un rostro sottile.","passivo":"Fiuto 18 m, limitato al sangue e al calore corporeo; Percezione tellurica 6 m; bonus razziale +4 alle prove di Acrobazia per saltare (+6 all'8° livello, +8 al 15°); ogni suo salto è considerato effettuato con rincorsa, la distanza massima è moltiplicata per quattro, non provoca attacchi di opportunità e non richiede prove per atterrare in piedi; è immune ai danni da stritolamento e alla manovra di Spezzare.","potenziamento":"+2 Destrezza (1°) → +4 Des (8°) → +6 Des (15°).","nota":""},{"id":227,"nome":"Lombrico Gigante","cat":"Aspetti parassitici · vermi ed ematofagi","animali":["Lombrico Gigante"],"minore":"pelle nuda percorsa da anelli muscolari visibili, padiglioni auricolari e sopracciglia scomparsi, occhi lattiginosi che non mettono a fuoco nulla.","passivo":"Percezione tellurica 18 m, che sale a 36 m mentre è a contatto col suolo; bonus razziale +4 ai Tiri Salvezza contro gli effetti che richiedono la vista e contro gli effetti ambientali di freddo, pressione e mancanza d'aria (+6 all'8° livello, +8 al 15°); non può essere fiancheggiato da creature a contatto col suolo; può attraversare senza penalità di movimento spazi larghi metà della propria taglia; all'inizio di ogni proprio turno, se è a contatto con terra o pietra nuda, recupera 1 punto ferita (2 dal 10° livello), fino a un massimo giornaliero pari al proprio livello di morfico. L'effetto si interrompe per 1 round se subisce danni da fuoco o acido.","potenziamento":"+2 Costituzione (1°) → +4 Cos (8°) → +6 Cos (15°).","nota":"L'essere considerato Accecato oltre il raggio della Percezione tellurica resta alla forma maggiore."},{"id":228,"nome":"Granchio","cat":"Aspetti parassitici · parassiti acquatici","animali":["Granchio"],"minore":"carapace lucido che copre spalle e schiena, occhi peduncolati alle tempie, mani che si induriscono in chele smussate, andatura obliqua.","passivo":"Percezione tellurica 6 m e Visione crepuscolare; respira aria e acqua e non subisce penalità ai tiri per colpire né al movimento sott'acqua; bonus razziale +4 alle prove di Nuotare e di Furtività in acque basse, sabbia e scogli (+6 all'8° livello, +8 al 15°); muovendosi di lato presenta sempre il carapace e ottiene un bonus di schivare +2 alla CA contro gli attacchi provenienti dal fronte.","potenziamento":"velocità di Nuotare pari a metà della velocità sul terreno (1°) → pari alla velocità sul terreno (8°) → velocità sul terreno +3 m (15°).","nota":"La Vista a 360° resta alla forma maggiore."},{"id":229,"nome":"Aragosta Gigante","cat":"Aspetti parassitici · parassiti acquatici","animali":["Aragosta Gigante"],"minore":"piastre spesse e articolate lungo la schiena, lunghe antenne che spuntano dalla fronte, una coda muscolosa accennata alla base della spina dorsale.","passivo":"Percezione tellurica 6 m, che sott'acqua diventa Vista cieca 6 m; Visione crepuscolare; bonus razziale +4 alle prove di Nuotare e di Percezione sott'acqua (+6 all'8° livello, +8 al 15°); una volta per scontro, come azione di movimento, può scattare all'indietro di 6 m (12 m sott'acqua) anche se è Afferrato o Immobilizzato, liberandosi automaticamente e senza provocare attacchi di opportunità.","potenziamento":"+1 CA naturale (1°) → +2 (8°) → +3 (15°).","nota":"Il vincolo di respirare solo in acqua vale solo per la forma maggiore."},{"id":230,"nome":"Ditisco","cat":"Aspetti parassitici · parassiti acquatici","animali":["Ditisco"],"minore":"elitre lisce e bombate sulla schiena, zampe posteriori frangiate come remi, pelle che trattiene sott'acqua un velo d'aria argenteo.","passivo":"Percezione tellurica 6 m in acqua e Visione crepuscolare; può restare immerso per un numero di round pari a quattro volte il proprio punteggio di Costituzione e non subisce penalità ai tiri per colpire sott'acqua; bonus razziale +4 alle prove di Nuotare e di Lottare per mantenere una presa (+6 all'8° livello, +8 al 15°); quando carica sott'acqua ottiene +2 al tiro per colpire e +1d6 danni al colpo della carica.","potenziamento":"velocità di Nuotare pari a metà della velocità sul terreno (1°) → pari alla velocità sul terreno (8°) → velocità sul terreno +3 m (15°).","nota":"La Vista a 360° resta alla forma maggiore."},{"id":231,"nome":"Squilla / Canocchia","cat":"Aspetti parassitici · parassiti acquatici","animali":["Squilla / Canocchia"],"minore":"occhi peduncolati che si muovono indipendentemente e cambiano colore osservando, avambracci che si ripiegano in appendici caricate a molla, corpo segmentato dai riflessi iridescenti.","passivo":"Scurovisione 18 m, Percezione tellurica 9 m in acqua e Vista a 360°: non può essere Colta alla sprovvista dagli attacchi ai fianchi e non concede il bonus di Attaccare ai Fianchi; bonus razziale +4 alle prove di Percezione e di Nuotare (+6 all'8° livello, +8 al 15°); bonus razziale +4 ai Tiri Salvezza contro le illusioni visive (+6 all'8° livello, +8 al 15°) e non subisce la condizione Offuscato causata da fonti di luce; dal 10° livello individua automaticamente le creature Invisibili entro 9 m, ma solo in acqua o in luce diretta.","potenziamento":"+2 Iniziativa (1°) → +4 (8°) → +6 (15°).","nota":""},{"id":232,"nome":"Isopode Abissale","cat":"Aspetti parassitici · parassiti acquatici","animali":["Isopode Abissale"],"minore":"piastre segmentate sovrapposte dalla nuca al bacino, occhi grandi e opachi che non tollerano la luce, pelle pallida e fredda al tatto.","passivo":"Scurovisione 36 m, Fiuto 30 m limitato a carogne e sangue, Percezione tellurica 12 m in acqua; resistenza al freddo 10 (20 dal 10° livello); bonus razziale +4 alle prove di Nuotare e ai Tiri Salvezza contro pressione, freddo e privazione (+6 all'8° livello, +8 al 15°); è immune ai danni da pressione e da stritolamento; come azione di movimento può serrarsi a palla, ottenendo un bonus di schivare +4 alla CA e l'immunità alle manovre di combattimento e agli attacchi furtivi, ma finché resta serrato non può attaccare né muoversi. Aprirsi è un'azione di movimento.","potenziamento":"+2 Costituzione (1°) → +4 Cos (8°) → +6 Cos (15°).","nota":"La penalità alla luce diretta del sole vale solo per la forma maggiore."}];

o). Quando colpisce con un attacco naturale o un colpo senz'armi, la roccia fusa aderisce: il bersaglio subisce 1d6 danni da fuoco all'inizio del proprio turno successivo (2d6 dal 12° livello). Una volta per round per bersaglio.","potenziamento":"+2 Forza (1°) → +2 For, +2 Des (8°) → +4 For, +2 Des (15°).","nota":""},{"id":309,"nome":"Sabbia","cat":"Aspetti elementali","animali":["Sabbia"],"minore":"pelle granulosa che si sfalda e si ricompone di continuo, occhi opachi privi di pupille, sottile scia di polvere.","passivo":"bonus di competenza +8 alle prove di Furtività in ambiente arido, desertico o polveroso; immune a Offuscato e Accecato causati da sabbia, polvere, particelle o fumo; non lascia tracce su sabbia e terreno arido.","potenziamento":"+2 Destrezza (1°) → +2 Des, +2 Cos (8°) → +2 For, +2 Des, +2 Cos (15°).","nota":""},{"id":310,"nome":"Vapore","cat":"Aspetti elementali","animali":["Vapore"],"minore":"contorni sfumati in una nube calda, sagoma che perde definizione ai bordi, condensa su ogni superficie vicina.","passivo":"resistenza al fuoco 10 (20 dal 10° livello); occultamento permanente (20% di fallimento). Questo occultamento non si somma ad altre fonti: si applica solo il valore migliore.","potenziamento":"+2 Costituzione (1°) → +2 Des, +2 Cos (8°) → +2 Des, +4 Cos (15°).","nota":""},{"id":311,"nome":"Acido","cat":"Aspetti elementali","animali":["Acido"],"minore":"pelle lucida che sfrigola al contatto, gocce corrosive che intaccano il terreno, vapori acri.","passivo":"resistenza all'acido 10 (20 dal 10° livello); il corpo non offre appigli — bonus di competenza +8 alla DMC contro Lottare e alle prove per divincolarsi. I suoi attacchi naturali e colpi senz'armi ignorano la Durezza degli oggetti e infliggono loro danni pieni.","potenziamento":"+2 Costituzione (1°) → +4 Cos (8°) → +6 Cos (15°).","nota":""},{"id":312,"nome":"Etere","cat":"Aspetti elementali","animali":["Etere"],"minore":"corpo semitrasparente e iridescente che sembra non toccare del tutt a velocità sul terreno (1°) → pari alla velocità sul terreno (8°) → velocità sul terreno +3 m (15°).","nota":"Signori delle Terre Remote"},{"id":519,"nome":"Gigante delle Giungle","cat":"Giganti enormi (9° e 10°)","animali":["Gigante delle Giungle"],"taglia":"Enorme","minore":"pelle scura striata di pigmenti vegetali, corporatura asciutta e nervosa, sguardo fisso da tiratore.","passivo":"immune agli effetti di [VELENO]; l'incremento di gittata degli archi è raddoppiato e ottiene bonus razziale +2 ai danni con l'arco (+4 all'8° livello, +6 al 15°).","potenziamento":"+2 Destrezza (1°) → +4 Des (8°) → +6 Des (15°).","nota":""},{"id":520,"nome":"Gigante degli Oceani","cat":"Giganti enormi (9° e 10°)","animali":["Gigante degli Oceani"],"taglia":"Enorme","minore":"pelle azzurro-verde madreperlacea, capelli come alghe pesanti, pieghe branchiali sul collo.","passivo":"resistenza al freddo e all'elettricità 10 (20 dal 10° livello); respira sott'acqua e ignora correnti e terreno difficile acquatico.","potenziamento":"velocità di Nuotare pari a metà della velocità sul terreno (1°) → pari alla velocità sul terreno (8°) → velocità sul terreno +3 m (15°).","nota":""},{"id":521,"nome":"Gigante della Piaga","cat":"Giganti enormi (9° e 10°)","animali":["Gigante della Piaga"],"taglia":"Enorme","minore":"pelle butterata da pustole e cicatrici, occhi giallastri, alito fetido.","passivo":"immune agli effetti di [MALATTIA] e di [VELENO]; può scagliare un cadavere Piccolo o Medio come una roccia, con danno di una taglia inferiore.","potenziamento":"+2 Costituzione (1°) → +4 Cos (8°) → +6 Cos (15°).","nota":""},{"id":522,"nome":"Gigante della Taiga","cat":"Giganti enormi (9° e 10°)","animali":["Gigante della Taiga"],"taglia":"Enorme","minore":"pelle chiara segnata da tatuaggi ancestrali, occhi lattiginosi che guardano oltre, presenza di figure indistinte ai margini della vista.","passivo":"immune alle illusioni; percepisce le creature Incorporee ed eteree entro 18 m.","potenziamento":"+1 CA di deviazione, valida anche contro gli attacchi di contatto (1°) → +2 (8°) → +3 (15°).","nota":"Terzo e ultimo aspetto della collana con CA di deviazione, dopo Etere (Nexus) e Nuvole (Sangue di Tiamath): Spiriti Protettori è già un bonus di deviazione nel manuale, quindi il potenziamento ne è la versione ridotta e non ne duplica il tipo."},{"id":523,"nome":"Gigante dell'Eclissi","cat":"Giganti mastodontici (14° e 15°)","animali":["Gigante dell'Eclissi"],"taglia":"Mastodontica","minore":"pelle nera come pietra vulcanica, occhi che non riflettono luce, alone di penombra che lo segue anche a mezzogiorno.","passivo":"Scurovisione 18 m; immune agli effetti di [MORTE]; come azione di movimento può spegnere ogni fonte di luce non magica entro 9 m e abbassare di un gradino la luce magica.","potenziamento":"+2 Iniziativa (1°) → +4 (8°) → +6 (15°).","nota":""},{"id":524,"nome":"Gigante della Montagna","cat":"Giganti mastodontici (14° e 15°)","animali":["Gigante della Montagna"],"taglia":"Mastodontica","minore":"pelle come parete di granito, lineamenti appena abbozzati, mole che sembra non finire mai.","passivo":"Vedere al Buio; immune al freddo, agli effetti di [PAURA] e di [VELENO] e agli effetti di influenza mentale.","potenziamento":"+2 Forza (1°) → +4 For (8°) → +6 For (15°).","nota":""},{"id":525,"nome":"Gigante delle Rune","cat":"Giganti mastodontici (14° e 15°)","animali":["Gigante delle Rune"],"taglia":"Mastodontica","minore":"pelle attraversata da rune incise che pulsano di luce fioca, capelli come filamenti di rame, voce che porta una seconda voce sotto.","passivo":"Scurovisione 18 m; immune al freddo, al fuoco e all'elettricità.","potenziamento":"+1 CA naturale (1°) → +2 (8°) → +3 (15°).","nota":"Le tre immunità sono deliberatamente pesanti: sono voci che si ottengono al 14°-15° livello, dove immunità a paura e influenza mentale è un'aspettativa normale. I passivi restano asciutti perché è la forma maggiore a portare Impalare, Inghiottire, Pioggia di Scintille e i tre Dominî."}];

const EVOLUZIONI = [{"id":1,"nome":"Fiuto","cat":"Sensi","liv":1,"ripetibile":false,"base":"Il morfico ottiene Fiuto 9 m.","up":"Dal 9° livello: individua la posizione esatta (non solo la presenza) delle creature entro il raggio e ottiene +4 alle prove di Sopravvivenza per seguire tracce olfattive."},{"id":2,"nome":"Scurovisione","cat":"Sensi","liv":1,"ripetibile":false,"base":"Il morfico ottiene Scurovisione 18 m (se già posseduta, il raggio aumenta di 9 m).","up":"Dal 13° livello: il raggio sale a 36 m."},{"id":3,"nome":"Percezione cieca","cat":"Sensi","liv":8,"ripetibile":false,"base":"Il morfico ottiene Percezione cieca 9 m.","up":"Dal 15° livello: diventa Vista cieca 9 m."},{"id":4,"nome":"Percezione tellurica","cat":"Sensi","liv":6,"ripetibile":false,"base":"Quando è a contatto col terreno, il morfico ottiene Percezione tellurica 9 m.","up":"Dal 12° livello: 18 m."},{"id":5,"nome":"Vigilanza","cat":"Sensi","liv":1,"ripetibile":false,"base":"Il morfico ottiene +3 alle prove di Percezione e +3 alle prove di Iniziativa.","up":"Dal 10° livello: ottiene la condizione sempre pronto (se la possiede già, ottiene invece +2 alle prove contrapposte per non essere colto di sorpresa)."},{"id":6,"nome":"Rapidità","cat":"Movimento","liv":1,"ripetibile":false,"base":"Quando non indossa un'armatura pesante, il morfico ottiene un bonus di potenziamento di +1,5 m alla velocità.","up":"Dal 8° livello: +3 m; dal 14° livello: +6 m."},{"id":7,"nome":"Scalatore","cat":"Movimento","liv":1,"ripetibile":false,"base":"Il morfico ottiene una velocità di Scalata pari a metà della propria velocità su terreno e non perde il bonus di Destrezza alla CA mentre si arrampica.","up":"Dal 10° livello: la velocità di Scalata diventa pari a quella su terreno e il morfico può muoversi anche a testa in giù."},{"id":8,"nome":"Nuotatore","cat":"Movimento","liv":1,"ripetibile":false,"base":"Il morfico ottiene una velocità di Nuotare pari alla propria velocità su terreno e +8 alle prove di Nuotare.","up":"Dal 10° livello: respira sott'acqua."},{"id":9,"nome":"Balzo prodigioso","cat":"Movimento","liv":1,"ripetibile":false,"base":"Ogni salto del morfico è considerato come effettuato con rincorsa e non ha limite d'altezza. Inoltre ottiene +4 alle prove di Acrobazia effettuate per saltare.","up":""},{"id":10,"nome":"Andatura selvatica","cat":"Movimento","liv":1,"ripetibile":false,"base":"Il morfico ignora le penalità al movimento dovute a qualsiasi terreno difficile naturale (non solo boschivo) e non lascia tracce, nemmeno se queste vengono rilevate magicamente.","up":"Dal 12° livello: attraversa superfici instabili (acqua bassa, fango, neve) senza sprofondare né rallentare."},{"id":11,"nome":"Balzare","cat":"Movimento","liv":8,"ripetibile":false,"base":"Il morfico ottiene la capacità speciale Balzare e non subisce penalità alla CA quando effettua una carica.","up":"Dal 16° livello: dopo una carica riuscita può effettuare gratuitamente una manovra di Sbilanciare o di Spingere."},{"id":12,"nome":"Pelle coriacea","cat":"Corpo e difesa","liv":1,"ripetibile":false,"base":"Il morfico ottiene +1 alla CA naturale.","up":"Il bonus sale a +2 all'8° livello, +3 al 14° e +4 al 20°."},{"id":13,"nome":"Furia","cat":"Corpo e difesa","liv":1,"ripetibile":false,"base":"Quando si trova a metà o meno dei propri Punti Ferita, il morfico ottiene un bonus di schivare di +1 alla CA e +2 ai Tiri Salvezza su Riflessi.","up":"Dal 12° livello: ottiene anche +2 ai tiri per i danni in mischia e +3 m alla velocità."},{"id":14,"nome":"Resistenza elementale","cat":"Corpo e difesa","liv":1,"ripetibile":true,"base":"Il morfico ottiene RE 5 contro un tipo di energia a scelta tra acido, elettricità, freddo, fuoco e sonoro.","up":"La resistenza sale a RE 10 dal 10° livello e a RE 15 dal 16°. Ogni volta che questa evoluzione viene selezionata nuovamente, si applica a un tipo di energia diverso."},{"id":15,"nome":"Anatomia diffusa","cat":"Corpo e difesa","liv":12,"ripetibile":false,"base":"Il morfico ha il 25% di probabilità di ignorare colpi critici e danni da precisione.","up":"Dal 16° livello: 50%."},{"id":16,"nome":"Resilienza","cat":"Corpo e difesa","liv":1,"ripetibile":false,"base":"Il morfico ottiene il talento Resistenza fisica e i suoi Punti Fatica massimi aumentano di un valore pari al suo livello di morfico.","up":""},{"id":17,"nome":"Costituzione robusta","cat":"Corpo e difesa","liv":1,"ripetibile":false,"base":"Il morfico ottiene il talento Robustezza e, quando Rifiata, ritira ogni dado di recupero che ottiene 1 o 2 (deve tenere il nuovo risultato).","up":""},{"id":18,"nome":"Pelle mutevole","cat":"Corpo e difesa","liv":1,"ripetibile":false,"base":"Il morfico ottiene +4 alle prove per divincolarsi da Afferrare e da corde o catene ed è immune alla condizione Intralciato causata da reti o terreni non magici.","up":"Dal 12° livello: può usare Fuga come azione di movimento."},{"id":19,"nome":"Guarigione rapida","cat":"Corpo e difesa","liv":14,"ripetibile":false,"base":"Come azione gratuita nel proprio turno, il morfico può attivare o disattivare questa evoluzione. Mentre è attiva, all'inizio di ogni suo turno recupera 2 Punti Fatica (o Punti Ferita se i Punti Fatica sono al massimo), fino a un massimo giornaliero pari a 3 × il suo livello di morfico. Questa capacità non ha effetto nel round successivo a quello in cui il morfico ha subito danni da fuoco o acido.","up":"Dal 18° livello: recupera 5 Punti Fatica invece di 2 e il massimo giornaliero sale a 5 × il suo livello di morfico."},{"id":20,"nome":"Morso possente","cat":"Predazione e armi naturali","liv":1,"ripetibile":false,"base":"Il morfico ottiene un attacco di Morso (danno da attacco maggiore) utilizzabile assieme agli Artigli come attacco secondario.","up":"Dal 10° livello: il Morso diventa un attacco primario e ottiene la capacità Afferrare."},{"id":21,"nome":"Coda flagellante","cat":"Predazione e armi naturali","liv":1,"ripetibile":false,"base":"Il morfico ottiene un attacco secondario di Colpo di Coda (danno contundente da attacco minore) e +2 alla DMC contro le manovre di Sbilanciare.","up":"Dal 12° livello: quando colpisce con il Colpo di Coda può tentare gratuitamente una manovra di Sbilanciare."},{"id":22,"nome":"Corna","cat":"Predazione e armi naturali","liv":1,"ripetibile":false,"base":"Il morfico ottiene un attacco di Corna (danno perforante) utilizzabile come attacco secondario.","up":"Dal 10° livello: le Corna diventano un attacco primario e, quando il morfico effettua una carica con esse, i dadi di danno sono raddoppiati."},{"id":23,"nome":"Zoccoli","cat":"Predazione e armi naturali","liv":1,"ripetibile":false,"base":"Il morfico ottiene 2 attacchi di Zoccoli (danno contundente) utilizzabili come attacchi secondari.","up":"Dal 12° livello: se entrambi gli Zoccoli colpiscono lo stesso bersaglio nello stesso round, il morfico può tentare gratuitamente contro di esso una manovra di Sbilanciare che non provoca attacchi di opportunità."},{"id":24,"nome":"Aculei","cat":"Predazione e armi naturali","liv":1,"ripetibile":false,"base":"Il morfico ottiene un attacco di Aculei (danno perforante) utilizzabile come attacco secondario. Inoltre, qualsiasi creatura che lo colpisca con un attacco naturale o senz'armi, o che tenti di afferrarlo, subisce automaticamente i danni degli Aculei (una sola volta per turno per attaccante).","up":"Dal 14° livello: come azione veloce il morfico può scagliare i propri aculei come attacco a distanza con gittata 6 m. Nota: questo danno automatico non si cumula con quello dell'aspetto Difensore tossico; si applica solo il maggiore dei due."},{"id":25,"nome":"Lingua","cat":"Predazione e armi naturali","liv":6,"ripetibile":false,"base":"Il morfico ottiene un attacco di Lingua con portata di 4,5 m. Questo attacco non infligge danni ma è dotato della capacità Afferrare. Quando afferra con la Lingua un bersaglio di taglia pari o inferiore alla propria, come azione veloce il morfico può trascinarlo di 3 m verso di sé.","up":"Dal 12° livello: la portata sale a 6 m e il bersaglio afferrato può essere trascinato fino a una casella adiacente al morfico."},{"id":26,"nome":"Tentacoli","cat":"Predazione e armi naturali","liv":10,"ripetibile":false,"base":"Il morfico ottiene 2 attacchi di Tentacoli (danno contundente) utilizzabili come attacchi secondari, dotati della capacità Afferrare e con portata aumentata di 1,5 m.","up":"Dal 14° livello: mentre mantiene una presa con i Tentacoli, all'inizio di ogni suo turno il morfico infligge automaticamente alla vittima i danni dei Tentacoli senza bisogno di una nuova prova."},{"id":27,"nome":"Zanne velenose","cat":"Predazione e armi naturali","liv":10,"ripetibile":false,"base":"Questa evoluzione richiede di possedere un attacco di Morso, concesso dall'evoluzione Morso possente o dalla forma maggiore assunta. Gli attacchi di Morso del morfico infliggono effetto di [VELENO]: la vittima deve superare un Tiro Salvezza su Tempra o è Nauseata per 1 round.","up":"Dal 16° livello: infligge anche 1d3 danni a Costituzione."},{"id":28,"nome":"Membra elastiche","cat":"Predazione e armi naturali","liv":10,"ripetibile":false,"base":"La portata degli attacchi naturali e delle armi morfiche del morfico aumenta di 1,5 m. Questo aumento non si cumula con quello concesso dall'evoluzione Tentacoli.","up":""},{"id":29,"nome":"Brama di sangue","cat":"Predazione e armi naturali","liv":1,"ripetibile":false,"base":"Il morfico infligge +2 ai tiri per i danni in mischia contro i nemici che ha già ferito nel corso dello stesso combattimento.","up":"Dal 12° livello: il bonus sale a +4 e, quando riduce un nemico a 0 o meno Punti Ferita, il morfico recupera un numero di Punti Ferita pari ai Dadi Vita di quel nemico."},{"id":30,"nome":"Agguatista","cat":"Predazione e armi naturali","liv":1,"ripetibile":false,"base":"Il morfico ottiene +2 ai tiri per i danni contro i nemici impreparati, colti alla sprovvista o che sta fiancheggiando.","up":"Dal 10° livello: il bonus sale a +4 e il morfico ignora 5 punti di RD contro tali bersagli."},{"id":31,"nome":"Grande fisicità","cat":"Predazione e armi naturali","liv":1,"ripetibile":false,"base":"Il morfico ottiene un bonus di competenza di +2 alla BMC e +2 alla DMC.","up":"Il bonus aumenta di +1 ogni sei livelli (fino a un massimo di +5 al 20° livello)."},{"id":32,"nome":"Presa costrittiva","cat":"Predazione e armi naturali","liv":1,"ripetibile":false,"base":"Il morfico ottiene +4 alle manovre di Afferrare e infligge i danni dell'attacco naturale con cui mantiene la presa all'inizio di ogni suo turno, senza bisogno di una nuova prova.","up":"Dal 14° livello: può Inghiottire creature di taglia inferiore alla propria."},{"id":33,"nome":"Carica travolgente","cat":"Predazione e armi naturali","liv":1,"ripetibile":false,"base":"Il morfico ottiene +4 alle manovre di Oltrepassare e di Spingere. Inoltre, quando Oltrepassa un nemico può effettuare gratuitamente un attacco di arma morfica contro di esso.","up":""},{"id":34,"nome":"Ruggito bestiale","cat":"Predazione e armi naturali","liv":1,"ripetibile":false,"base":"Come azione standard, il morfico può effettuare una prova di Intimidire contro tutti i nemici entro 9 m per renderli Scossi.","up":"Dal 12° livello: i nemici già Scossi diventano invece Spaventati."},{"id":35,"nome":"Abilità focalizzate","cat":"Utility e istinto","liv":1,"ripetibile":false,"base":"Il morfico ottiene il talento Abilità focalizzata applicato a 2 abilità di classe.","up":"Dal 10° livello: 3 volte al giorno può tirare con Vantaggio una prova in un'abilità in cui possiede Abilità focalizzata."},{"id":36,"nome":"Mimetismo","cat":"Utility e istinto","liv":1,"ripetibile":false,"base":"Il morfico ottiene +4 alle prove di Furtività e può usare Furtività in terreno naturale anche mentre è osservato.","up":"Dal 10° livello: può usare Nascondersi in piena vista in ambienti naturali."},{"id":37,"nome":"Empatia potenziata","cat":"Utility e istinto","liv":1,"ripetibile":false,"base":"Empatia selvatica del morfico funziona sugli animali di qualsiasi punteggio di Intelligenza e sulle bestie magiche senza penalità.","up":"Dal 12° livello: il morfico può usarla come azione di movimento."},{"id":38,"nome":"Slancio","cat":"Utility e istinto","liv":1,"ripetibile":false,"base":"Il morfico ottiene il talento Stoccata e, quando attacca usando Stoccata, la portata aumenta di ulteriori 1,5 m.","up":""},{"id":39,"nome":"Elusività","cat":"Utility e istinto","liv":1,"ripetibile":false,"base":"Il morfico ottiene il talento Mobilità (senza doverne soddisfare i requisiti) e non provoca attacchi di opportunità quando si rialza dalla condizione Prono.","up":""},{"id":40,"nome":"Mutaforma rapido","cat":"Utility e istinto","liv":7,"ripetibile":false,"base":"Il morfico può usare mutaforma (o le versioni alternative dei vari archetipi) come azione veloce.","up":"Dal 13° livello: può usarla come azione immediata o come azione gratuita. I cinque archetipi che seguono legano il morfico a una categoria di forme diversa da quella animale. Ciascuno sostituisce Aspetto del Morfico con un proprio set di aspetti, descritti nel manuale di forme dedicato."}];

      txt:`Forma selvatica${e!==L?` (livello effettivo ${e}°)`:""}: ${usi} · ${dur} · ${"azione standard"}`};
  }

function isFlyer(f){return f.cat==="Volanti"}
function access(pg,f,size){
  const row=f.attacchi[size]; if(!row) return null;
  const L=shapeL(pg);
  if(pg.classe==="druido"){
    if(f.vol==="draconiche") return null;
    if(f.vol==="giganti"){if(pg.archetipo!=="montagne"||size!==f.native)return null;const need={Grande:12,Enorme:16}[size];if(!need)return null;return {ok:L>=need,req:need+"°"}}
    if(pg.archetipo==="cantore"&&f.vol!=="vegetali") return null;
    if(pg.archetipo==="elementalista"&&f.vol==="vegetali") return null;
    if(pg.archetipo==="montagne"&&f.vol==="parassiti") return null;
    const e=effDruid(pg);
    let need=pg.archetipo==="cantore"?CANTORE_MIN[size]:(pg.archetipo==="elementalista"&&f.vol==="elementali")?ELEMENTALISTA_MIN[size]:DRUID_MIN[f.vol][size];
    if(need==null) return null;
    if(row.lv18) need=Math.max(need,18);
    return {ok:e>=need,req:need+"°",eff:e!==L};
  }
  if(f.vol==="giganti"){if(size!==f.native&&!(f.promo&&size==="Mastodontica"))return null;const need={Grande:4,Enorme:9,Mastodontica:14}[size];return {ok:L>=need,req:need+"°"}}
  if(f.vol==="draconiche"){const need=size==="Enorme"?20:size==="Grande"?10:4;return {ok:L>=need,req:need+"°"}}
  if(size==="Enorme") return (pg.archetipo==="arboreo"||pg.archetipo==="crisalide"||pg.archetipo==="nexus")?{ok:L>=20,req:"20°"}:null;
  if(f.vol==="elementali"){const need=size==="Grande"?10:4;return {ok:L>=need,req:need+"°"}}
  if(size==="Minuscola"&&f.vol==="vegetali") return null;
  let need=4; if(row.lv18) need=18;
  return {ok:L>=need,req:need+"°"};
}

const aspList=pg=>pg.classe!=="morfico"?ASPETTI:pg.archetipo==="arboreo"?ASP_VEG:pg.archetipo==="crisalide"?ASP_PAR:pg.archetipo==="nexus"?ASP_ELE:pg.archetipo==="tiamath"?ASP_DRA:pg.archetipo==="jotun"?ASP_GIG:ASPETTI;

/* caratteristiche effettive (potenziamento degli aspetti contro quello degli oggetti) */
let CUR_ASP=[], CUR_ENL=false;
function effCar(pg,k){
  const base=+pg.car[k]||10;
  if(pg.classe!=="morfico")return base;
  const asp=potSum(CUR_ASP,pg.livello)[k]||0;
  const item=+((pg.itemPot||{})[k])||0;
  return base-item+Math.max(item,asp)+(CUR_ENL?(k==="For"?2:k==="Des"?-2:0):0);
}

const CONDS=["Azzoppato","Colto alla sprovvista","Offuscato","Sempre pronto","Affaticato","Abbagliato","Accecato","Accovacciato","Affascinato","Assordato","Barcollante","Confuso","Esausto","Frastornato","Immobilizzato","Impreparato","In Lotta","Inabile","Incorporeo","Indifeso","Infermo","Intralciato","Invisibile","Morente","Morto","Nauseato","Paralizzato","Scosso","Spaventato","In Preda al Panico","Pietrificato","Privo di Sensi","Prono","Rotto","Sanguinante","Scheggiato","Stabilizzato","Stordito"];
const NOCOLOR=new Set(["morte","morti","rotta","scossa","confuse","sanguinanti","morta"]);
function variants(w){if(/^In /.test(w))return[w];const p=w.split(" "),f=p[0],rest=p.slice(1).join(" ");let v=[f];
  if(/o$/.test(f))v=["o","a","i","e"].map(s=>f.slice(0,-1)+s);else if(/e$/.test(f))v=[f,f.slice(0,-1)+"i"];
  return v.map(x=>rest?x+" "+rest:x)}
const CONDRE=new RegExp("\\b("+CONDS.flatMap(variants).sort((a,b)=>b.length-a.length).map(s=>s.replace(/ /g,"\\s+")).join("|")+")\\b","gi");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rich(t){return esc(t).replace(CONDRE,m=>NOCOLOR.has(m.toLowerCase())&&m===m.toLowerCase()?m:`<span class="cond">${m}</span>`)
  .replace(/\[([A-ZÀ-Ý ]{3,})\]/g,'<span class="efx">[$1]</span>')}

function lvlTxt(s,pg,dM,so){const L=pg.livello;dM=dM||{};
  if(so){s=s.replace(/¼ dei dadi del soffio/g,m=>`${m} (${Math.max(1,Math.floor(so.n/4))}${so.dado})`).replace(/CD del soffio/g,m=>`${m} (${so.cd})`).replace(/durata standard/g,m=>`${m} (${Math.floor(L/4)+2} round)`)}const FULL={Costituzione:"Cos",Forza:"For",Destrezza:"Des",Saggezza:"Sag",Carisma:"Car",Intelligenza:"Int"};
  s=s.replace(/2d6, \+1d6 ogni 4 livelli/g,m=>`${m} (ora ${2+Math.max(0,Math.floor((L-8)/4))}d6)`);
  s=s.replace(/6d6\+6, \+1d6\+1 ogni 2 livelli/g,m=>{const n=6+Math.max(0,Math.floor((L-12)/2));return `${m} (ora ${n}d6+${n})`});
  const AB={Cos:"Cos",For:"For",Des:"Des",Sag:"Sag",Car:"Car",Int:"Int"};
  s=s.replace(/CD 10\+½DV\+mod\.(Cos|For|Des|Sag|Car|Int)/g,(m,k)=>`${m} (${10+Math.floor(totL(pg)/2)+mod(effCar(pg,AB[k]))+(dM[k]||0)})`);
  s=s.replace(/CD 10 \+ metà livello di morfico \+ bonus di (Costituzione|Forza|Destrezza|Saggezza|Carisma|Intelligenza)/g,(m,k)=>`${m} (${10+Math.floor(L/2)+mod(effCar(pg,FULL[k]))+(dM[FULL[k]]||0)})`);
  s=s.replace(/CD 15 \+ metà livello di morfico/g,m=>`${m} (${15+Math.floor(L/2)})`);
  return s}
function strDmg(m,mult){if(!mult)return 0;if(m<0)return m;return Math.floor(m*mult)}
function buildAttacks(pg,alt,T,opts){
  const L=pg.livello, cls=pg.classe, notes=[];
  let list=alt.map(a=>({...a,extra:[...(a.extra||[])],tags:[],canon:canon(a.name)}));
  if(cls==="morfico"){
    const md=morphDice(L);
    const arb=pg.archetipo==="arboreo", nex=pg.archetipo==="nexus";
    const claws=list.filter(a=>a.dice&&!a.noroll&&(arb?/schiant/i.test(a.name):a.canon==="Artigli"));
    if(nex||pg.archetipo==="jotun"){}
    else if(pg.archetipo==="tiamath"&&!opts.human){list.forEach(a=>{if(a.dice&&!a.noroll){if(avg(md)>avg(a.dice))a.dice=md;a.tags.push("armi morfiche")}})}
    else if(claws.length){claws.forEach(a=>{if(avg(md)>avg(a.dice)){a.dice=md;a.tags.push("armi morfiche")}})}
    else if(!opts.human){
      let slots=2;
      const cands=list.filter(a=>a.dice&&!a.noroll&&avg(a.dice)<avg(md)).sort((x,y)=>(avg(md)-avg(y.dice))-(avg(md)-avg(x.dice)));
      for(const a of cands){if(!slots)break;const k=Math.min(a.n,slots);
        if(k<a.n){const rest={...a,extra:[...a.extra],tags:[...a.tags],n:a.n-k};list.splice(list.indexOf(a)+1,0,rest);a.n=k}
        a.dice=md;a.tags.push("armi morfiche");slots-=k}
    }
    if(L>=15) list.forEach(a=>{if(a.tags.includes("armi morfiche"))a.crit=(a.crit&&a.crit.startsWith("19")?"19-20/":"")+"×3"});
    // evoluzioni
    let evoN=0;
    evoActive(pg).forEach(e=>{const d=EVO_ATK[e.id];if(!d)return;
      const prim=d.primFrom&&L>=d.primFrom&&!(pg.archetipo==="crisalide"&&!opts.human);
      const ev={n:d.n,name:d.name,canon:d.canon,sec:!prim,dice:d.nodmg?null:evoDice(d.cls,L),str:d.nodmg?0:(prim?1:0.5),crit:null,extra:[...(d.extra||[])],tags:["evoluzione"]};
      if(d.extraFrom)for(const lv in d.extraFrom)if(L>=+lv)ev.extra.push(...d.extraFrom[lv]);
      if(d.nodmg){ev.extra=["Afferrare",`portata ${L>=12?"6":"4,5"} m`,"nessun danno"]}
      evoN+=d.n;
      const f=list.find(a=>a.canon===d.canon);
      if(f){
        const primNow=!f.sec||!ev.sec;
        if(avg(ev.dice)>avg(f.dice)){f.dice=ev.dice}
        f.n=Math.max(f.n,ev.n);
        if(f.sec&&!ev.sec){f.sec=false;f.str=1}
        f.sec=!primNow?true:false;
        ev.extra.forEach(x=>{if(!f.extra.includes(x))f.extra.push(x)});
        f.tags.push("+ "+e.nome);
      } else list.push(ev);
    });
    const lim=babAttacks(totBAB(pg))+1;
    if(evoN>lim) notes.push(`Le evoluzioni concedono ${evoN} attacchi naturali: il limite al ${L}° livello è ${lim} (attacchi del BAB + 1). Scegli quali usare.`);
    if(evoActive(pg).some(e=>e.id===27)&&pg.archetipo==="nexus") notes.push("Zanne velenose non funziona per il nexus: un corpo elementale non ha ghiandole velenifere.");
    else if(evoActive(pg).some(e=>e.id===27)){
      if(list.some(a=>a.canon==="Morso")) list.filter(a=>a.canon==="Morso").forEach(a=>{a.extra.push("Veleno");a.tags.push("Zanne velenose")});
      else notes.push("Zanne velenose richiede un attacco di Morso: questa forma non ne ha e non hai Morso possente.");
    }
    if(evoActive(pg).some(e=>e.id===28)&&!opts.human) list.forEach(a=>{if(a.canon!=="Tentacoli"&&a.dice)a.extra.push("portata +1,5 m")});
  }
  if(cls==="druido"&&pg.archetipo==="elementalista"&&opts.vol==="elementali"){const n=1+(L>=12)+(L>=16)+(L>=20);
    list.forEach(a=>{if(a.dice)a.extra.push(`${n}d6 [${(pg.affinita||"fuoco").toUpperCase()}]`);a.tags.push("Forma primeva")})}
  const dmgCount=list.filter(a=>a.dice&&!a.noroll).reduce((s,a)=>s+a.n,0);
  const single=dmgCount===1;
  const B=totBAB(pg), sm=mod(effCar(pg,"For")), am=opts.acc?mod(effCar(pg,"Des")):sm, ex=+pg.bonus.txc||0, exd=+pg.bonus.danni||0;
  const out=list.map(a=>{
    const tx=B+am+(T?T.txc:0)+ex-(a.sec?5:0)+(opts.human?(opts.szM||0):0);
    let dmg=null, detail=[];
    if(a.dice){
      const sp=strDmg(sm,a.str);
      const sz=T&&a.str?(single?T.dsin:T.dmul):0;
      const tot=sp+sz+exd;
      dmg=a.dice+(tot?sg(tot).replace("−","-"):"");
      detail=[`${a.str===1.5?"1½":a.str===0.5?"½":a.str?"":"0×"}For ${sg(sp)}`];
      if(T&&a.str)detail.push(`${single?"Dan. Sin.":"Dan. Mul."} ${sg(sz)}`);
      if(exd)detail.push(`altri ${sg(exd)}`);
    }
    return {...a,tx,dmg,detail};
  });
  return {out,notes,single};
}
function atkHtml(a){
  const extras=[...(a.extra||[])];
  let inner=a.dmg?a.dmg:"";
  if(extras.length)inner+=(inner?" più ":"")+extras.join(", ");
  if(a.crit)inner+=", "+a.crit;
  if(a.tipo&&a.dmg)inner=inner.replace(a.dmg,a.dmg+" "+a.tipo);
  if(a.gittata)inner+=(inner?", ":"")+"gittata "+a.gittata;
  if(a.noroll)return `<div class="aline"><b>${esc(a.name)}</b> <span class="muted">(con presa riuscita, senza tiro)</span> (${rich(inner)})${a.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`;
  return `<div class="aline"><b>${a.n>1?a.n+" ":""}${esc(a.name)}</b> ${a.iter?a.iter.map(sg).join("/"):sg(a.tx)}${a.touch?" <span class=\"muted\">(contatto)</span>":""}${a.sec?" <span class=\"muted\">(sec.)</span>":""} (${rich(inner)})${a.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`;
}

function parseSpeed(val){
  const parts=[];let d=0,cur="";for(const c of val){if(c==="(")d++;if(c===")")d--;if(c===","&&d===0){parts.push(cur);cur=""}else cur+=c}parts.push(cur);
  return parts.map(p=>{const m=/^(?:([A-Za-zàèéìòù][\wàèéìòù ]*?)\s)?(\d+(?:,\d+)?) m(.*)$/.exec(p.trim());
    return m?{name:m[1]||"",v:parseFloat(m[2].replace(",",".")),rest:m[3]||""}:{raw:p.trim()}})}
function speedStr(parts){return parts.map(p=>p.raw!==undefined?p.raw:`${p.name?p.name+" ":""}${mNum(p.v)} m${p.rest}`).join(", ")}
function sizeVal(list,size){const e=(list||[]).find(x=>x.sizes&&x.sizes.includes(size));return e?e.val:null}

/* ------------------------------------------------------------ calcolo scheda */
function computeSheet(pg,ref){
  pg=withBuffs(pg);const TL=totL(pg);

  const size=human?pg.taglia:ref.taglia;
  const T=human?null:modTab(f.vol,pg.taglia,size,f);

  let aspAct=[];

    const chosen=pg.morfico.aspetti||[];

    if(f){const a=aspList(pg).find(x=>chosen.includes(x.id)&&x.animali.includes(f.nome));if(a&&!aspAct.includes(a.id))aspAct.push(a.id)}
  }
  CUR_ASP=aspAct;
  const enl=human&&cls==="morfico"&&pg.archetipo==="jotun"&&!!pg.jEnl&&aspAct.length>0&&pg.taglia!=="Grande";
  CUR_ENL=enl;
  const hSz=human?(enl?SIZES[SIZES.indexOf(pg.taglia)+1]:pg.taglia):null, szM=human?({Piccola:1,Media:0,Grande:-1}[hSz]||0):0;

  const dM={For:T?T.dmul:0,Des:T?T.cades:0,Cos:T?T.pf||0:0};
  const B=totBAB(pg), S0=saves(cls,L), S={tem:S0.tem,rif:S0.rif,vol:S0.vol};(pg.multi||[]).forEach(m=>{S.tem+=+m.tem||0;S.rif+=+m.rif||0;S.vol+=+m.vol||0});
  const armor=+pg.arm.bonus||0, selv=!!pg.arm.selvatica;

  const armorOn=(human||gigF)?armor:(selv?armor:0);
  const maxD=pg.arm.maxDes===""||pg.arm.maxDes==null?null:+pg.arm.maxDes;
  let desAC=Des; if(armorOn&&maxD!=null)desAC=Math.min(desAC,maxD);
  const shield=+pg.ca.scudo||0, shieldOn=(human||gigF)?shield:(pg.arm.scudoSelv?shield:0);
  const hCA=heroCA(TL), hTS=heroTS(TL);
  const ist=istinto(pg,armor>0||shield>0);
  const pelle=has(12)?1+(L>=8)+(L>=14)+(L>=20):0;
  const itemNat=+pg.ca.nat||0;
  const natEnh=Math.max(itemNat,P.canat);
  const formNat=T?T.canat+(f.canatExtra||0):0;
  const smallH=human&&pg.taglia==="Piccola";
  const cades=T?T.cades:0, catag=T?T.catag:szM;
  const deflItem=+pg.ca.dev||0, defl=Math.max(deflItem,P.dev||0,T&&T.dev||0), dodge=+pg.ca.sch||0, oth=+pg.ca.altro||0;
  const CA=10+armorOn+shieldOn+desAC+cades+formNat+natEnh+pelle+catag+defl+dodge+ist+oth+hCA;
  const touch=10+desAC+cades+catag+defl+dodge+ist+oth+hCA;
  const flat=CA-Math.max(0,desAC+cades)-dodge;
  const caCalc=[`10`,armorOn?`armatura ${sg(armorOn)}${!human&&selv?" (selvatica)":""}`:(armor&&!human?"armatura fusa nel corpo (non selvatica)":null),
    shieldOn?`scudo ${sg(shieldOn)}${!human?" (selvatico)":""}`:(shield&&!human?"scudo fuso nel corpo (non selvatico)":null),`Des ${sg(desAC)}`,
    cades?`Des di taglia ${sg(cades)}`:null,formNat?`naturale della forma ${sg(formNat)}${f&&f.canatExtra?" (tabella "+sg(T.canat)+", capacità "+sg(f.canatExtra)+")":""}`:null,
    natEnh?`potenziamento naturale ${sg(natEnh)}${P.canat>itemNat?" (aspetto)":" (oggetto)"}`:null,pelle?`Pelle coriacea ${sg(pelle)}`:null,

  const gf=has(31)?Math.min(5,2+Math.floor(L/6)):0;
  const BMC=B+For+(T?T.bmc:-szM)+gf;
  const DMC=10+B+For+Des+(T?T.dmc:-szM)+defl+dodge+ist+oth+gf+hCA;
  const bb=pg.bonus;
  const TS={tem:S.tem+Cos+(T?T.tem:0)+(+bb.tsTem||0)+hTS,rif:S.rif+Des+(T?T.rifl:0)+(+bb.tsRif||0)+hTS,vol:S.vol+Sag+(+bb.tsVol||0)+hTS};
  const iniz=Des+dM.Des+(+pg.bonus.iniz||0)+P.iniz+(has(5)?3:0);
  const pfExtra=(mod(E("Cos"))-mod(+pg.car.Cos||10))*TL+(T?T.pf*TL:0);
  const pfNote=[(mod(E("Cos"))-mod(+pg.car.Cos||10))?`${sg((mod(E("Cos"))-mod(+pg.car.Cos||10))*L)} Cos degli aspetti`:null,T&&T.pf?`${sg(T.pf*L)} taglia`:null].filter(Boolean).join(", ");

  if(has(36))skills.push("Mimetismo: Furtività +4");
  if(has(5))skills.push("Vigilanza: Percezione +3");
  if(has(8))skills.push("Nuotatore: Nuotare +8");

function capOn(tag,size,L){

  if(m&&SIZES.includes(m[2])){const i=SIZES.indexOf(m[2]),j=SIZES.indexOf(size);on=m[1]==="dal"?j>=i:j===i}
  else if(m&&m[1]==="solo"){note="solo per "+t[0].slice(5)}
  if(t[1]){const lv=/(\d+)°\+/.exec(t[1]);if(lv){if(L<+lv[1])on=false}else note="solo per "+t[1]}
  return {on,note};
}

  </div>`:""}
  <div class="box">
