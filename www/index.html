function setv(path,val){const p=pg();const k=path.split(".");let o=p;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=val;save()}
function bindPG(){
  const p=pg();
  const on=(id,ev,fn)=>{const e=$(id);if(e)e.addEventListener(ev,fn)};
  on("f-nome","input",e=>{setv("nome",e.target.value);renderTop()});
  const setLiv=v=>{v=Math.max(1,Math.min(20,v|0||1));setv("livello",v);renderAll()};
  on("f-liv","change",e=>setLiv(+e.target.value));
  on("liv-m","click",()=>setLiv(p.livello-1));on("liv-p","click",()=>setLiv(p.livello+1));
  on("f-arch","change",e=>{setv("archetipo",e.target.value);
    if(p.classe==="morfico"){const ids=aspList(p).map(a=>a.id);p.morfico.aspetti=p.morfico.aspetti.filter(x=>ids.includes(x));p.morfico.minori=p.morfico.minori.filter(x=>ids.includes(x));
      if(p.vista&&p.vista.kind==="animale")p.vista=null;save()}
    renderAll()});
  on("f-tg","change",e=>{setv("taglia",e.target.value);renderAll()});
  on("f-aff","change",e=>{setv("affinita",e.target.value);renderSoft()});
  CARS.forEach(k=>on("c-"+k,"input",e=>{setv("car."+k,+e.target.value||0);$("m-"+k).textContent=sg(mod(+e.target.value||0));renderSoft()}));
  ["For","Des","Cos"].forEach(k=>on("ip-"+k,"input",e=>{setv("itemPot."+k,+e.target.value||0);renderSoft()}));
  const map={"a-bon":"arm.bonus","ca-dev":"ca.dev","ca-sch":"ca.sch","ca-nat":"ca.nat","ca-alt":"ca.altro","f-pf":"pf","f-pft":"pfTemp","b-tem":"bonus.tsTem","b-rif":"bonus.tsRif","b-vol":"bonus.tsVol","ca-scu":"ca.scudo","b-txc":"bonus.txc","b-dan":"bonus.danni","b-ini":"bonus.iniz","f-vel":"vel"};
  for(const id in map)on(id,"input",e=>{setv(map[id],e.target.value===""?"":+e.target.value);renderSoft()});
  on("a-max","input",e=>{setv("arm.maxDes",e.target.value===""?"":+e.target.value);renderSoft()});
  on("a-selv","change",e=>{setv("arm.selvatica",e.target.checked);renderSoft()});
  on("f-foc","change",e=>{setv("fFoc",e.target.checked);renderAll()});
  on("m-add","click",()=>{(p.multi=p.multi||[]).push({nome:"",livello:1,bab:0,tem:0,rif:0,vol:0});save();renderAll()});
  on("b-add","click",()=>{(p.buff=p.buff||[]).push({nome:"",on:false});save();renderAll()});
  $("p-pg").querySelectorAll("[data-m]").forEach(el=>el.addEventListener("change",()=>{const m=p.multi[+el.dataset.m],k=el.dataset.k;m[k]=k==="nome"?el.value:(el.value===""?"":+el.value);save();renderAll()}));
  $("p-pg").querySelectorAll("[data-b]").forEach(el=>el.addEventListener("change",()=>{const b=p.buff[+el.dataset.b],k=el.dataset.k;b[k]=k==="nome"?el.value:(el.value===""?"":+el.value);save();renderSoft()}));
  $("p-pg").querySelectorAll("[data-bon]").forEach(el=>el.addEventListener("change",()=>{p.buff[+el.dataset.bon].on=el.checked;save();renderSoft()}));
  $("p-pg").querySelectorAll("[data-mdel]").forEach(el=>el.addEventListener("click",()=>{p.multi.splice(+el.dataset.mdel,1);save();renderAll()}));
  $("p-pg").querySelectorAll("[data-bdel]").forEach(el=>el.addEventListener("click",()=>{p.buff.splice(+el.dataset.bdel,1);save();renderAll()}));
  if(!p.arma)p.arma={};
  [["w-nome","nome"],["w-dado","dado"],["w-crit","crit"],["w-nome2","nome2"],["w-dado2","dado2"],["w-crit2","crit2"]].forEach(([id,k])=>on(id,"input",e=>{p.arma[k]=e.target.value;save();renderSoft()}));
  [["w-bon","bonus"],["w-bon2","bonus2"]].forEach(([id,k])=>on(id,"input",e=>{p.arma[k]=+e.target.value||0;save();renderSoft()}));
  on("w-mani","change",e=>{p.arma.mani=+e.target.value;save();renderSoft()});
  on("w-twf","change",e=>{p.arma.twf=+e.target.value;save();renderSoft()});
  on("w-due","change",e=>{p.arma.due=e.target.checked;save();renderAll()});
  on("w-leg","change",e=>{p.arma.leggera2=e.target.checked;save();renderSoft()});
  on("s-selv","change",e=>{setv("arm.scudoSelv",e.target.checked);renderSoft()});
  on("btn-exp","click",()=>{const t=JSON.stringify(p);$("io").hidden=false;$("io-t").value=t;$("io-msg").textContent="";
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>$("io-msg").textContent="Codice copiato.").catch(()=>{$("io-t").select();$("io-msg").textContent="Seleziona e copia il testo."});else $("io-t").select()});
  on("btn-imp","click",()=>{$("io").hidden=false;$("io-t").value="";$("io-t").focus();$("io-msg").textContent="Incolla il codice e premi Importa."});
  on("io-ok","click",()=>{try{const o=JSON.parse($("io-t").value);if(!o||!o.classe||!o.car)throw 0;
      const n=migrate(Object.assign(blankPG(o.classe),o));n.id="pg"+Date.now().toString(36);STATE.chars.push(n);STATE.cur=n.id;save();renderAll();}
    catch(e){$("io-msg").textContent="Il codice non è valido: copialo di nuovo per intero."}});
  on("btn-del","click",()=>{$("delc").hidden=false});
  on("del-no","click",()=>{$("delc").hidden=true});
  on("del-yes","click",()=>{STATE.chars=STATE.chars.filter(c=>c.id!==p.id);if(!STATE.chars.length)STATE.chars=[blankPG(p.classe)];STATE.cur=STATE.chars[0].id;save();renderAll()});
}
function renderSoft(){renderTop();renderForme();renderScheda()}

function renderMorf(){
  const p=pg(); if(p.classe!=="morfico"){$("p-morf").innerHTML="";return}
  const L=p.livello, ch=p.morfico.aspetti, tia=p.archetipo==="tiamath", maxA=p.archetipo==="jotun"?(1+(L>=5)+(L>=9)+(L>=10)+(L>=14)+(L>=15)+(L>=20)):(p.archetipo==="nexus"||tia)?Math.min(4,nAspetti(L)):nAspetti(L), maxM=p.archetipo==="jotun"?1:(p.archetipo==="nexus"||tia)?Math.min(3,nMinori(L)):nMinori(L), maxE=Math.max(0,nEvoBase(L)-(p.archetipo==="nexus"?1:tia?(L>=3?2:1):0));
  const nCh=ch.filter(id=>id!==420).length;
  const jot=p.archetipo==="jotun";
  const jAllow={Grande:(L>=1)+(L>=5),Enorme:(L>=9)+(L>=10),Mastodontica:(L>=14)+(L>=15)};
  const jCnt=g=>ch.filter(id=>{const a=aspById(id);return a&&a.taglia===g}).length;
  const jOver=()=>Object.keys(jAllow).reduce((s,g)=>s+Math.max(0,jCnt(g)-jAllow[g]),0);
  const jCan=a=>jCnt(a.taglia)<jAllow[a.taglia]||(L>=20&&jOver()===0);
  const AL=aspList(p);
  const cats=[...new Set(AL.map(a=>a.cat))];
  const aspHtml=cats.map(c=>`<div class="subh">${esc(c)}</div>`+AL.filter(a=>a.cat===c).map(a=>{
    const on=ch.includes(a.id), dis=!on&&(jot?!jCan(a):a.id===420?L<20:(tia?nCh:ch.length)>=maxA);
    return `<label class="acard${on?" on":""}${dis?" dis":""}"><input type="checkbox" data-asp="${a.id}"${on?" checked":""}${dis?" disabled":""}>
      <span><span class="an">${esc(a.nome)}</span>${a.animali.length===1&&a.animali[0]===a.nome?"":` <span class="ad">· ${esc(a.animali.join(", "))}</span>`}<br>
      <span class="ad"><b>Potenziamento:</b> ${potTxt(a.id,L)}</span><br><span class="ad"><b>Passivo:</b> ${rich(lvlTxt(a.passivo,p))}</span></span></label>`}).join("")).join("");
  const mins=p.morfico.minori.filter(id=>ch.includes(id));
  const minHtml=ch.length?ch.map(id=>{const a=aspById(id);const on=mins.includes(id);const dis=!on&&mins.length>=maxM;
    return `<button type="button" class="chip${on?" sel":""}${dis?" locked":""}" data-min="${id}"${dis?" disabled":""} aria-pressed="${on}">${esc(a.nome)}</button>`}).join(""):`<span class="hint">Scegli prima gli aspetti.</span>`;
  const P=potSum(mins,L);
  const chosen=p.morfico.evoluzioni;
  const ecats=[...new Set(EVOLUZIONI.map(e=>e.cat))];
  const full=chosen.length>=maxE;
  const evoHtml=ecats.map(c=>`<div class="subh">${esc(c)}</div>`+EVOLUZIONI.filter(e=>e.cat===c).map(e=>{
    const sel=chosen.filter(x=>x.id===e.id), on=sel.length>0, low=L<e.liv, dis=(!on&&(full||low));
    const ul=upLevel(e), upOn=ul&&L>=ul;
    let extra="";
    if(e.ripetibile&&on){extra=`<div class="row" style="margin-top:6px">${sel.map((x,i)=>`<select data-en="${i}" aria-label="Tipo di energia">${["acido","elettricità","freddo","fuoco","sonoro"].map(v=>`<option${x.energia===v?" selected":""}>${v}</option>`).join("")}</select>`).join("")}
      <button type="button" class="btn" data-evoadd="${e.id}"${full?" disabled":""}>+ un'altra</button>${sel.length>1?`<button type="button" class="btn" data-evorm="${e.id}">− una</button>`:""}</div>`}
    return `<label class="acard${on?" on":""}${dis?" dis":""}"><input type="checkbox" data-evo="${e.id}"${on?" checked":""}${dis?" disabled":""}>
      <span><span class="an">${esc(e.nome)}</span>${e.liv>1?` <span class="pill">dal ${e.liv}°</span>`:""}${e.ripetibile?` <span class="pill">ripetibile</span>`:""}<br>
      <span class="ad">${rich(e.base)}</span>${e.up?`<br><span class="ad">${upOn?"<b>Attivo:</b> ":""}${rich(e.up)}</span>`:""}${extra}</span></label>`}).join("")).join("");
  $("p-morf").innerHTML=`
  <div class="box"><h2>Aspetti <span class="cnt">${tia?nCh:ch.length} di ${maxA}${tia&&ch.includes(420)?" + Sovrano":""}</span></h2>
    <p class="hint">${p.archetipo==="jotun"?"Ogni aspetto di gigante è anche la forma maggiore che puoi assumere con forma di gigante, alla taglia della sua stirpe. Al 1° e 5° scegli fra i Giganti Grandi, al 9° e 10° fra gli Enormi, al 14° e 15° fra i Mastodontici; al 20° un aspetto di qualsiasi taglia. Una sola forma minore alla volta: ti ingrandisce di una taglia come Ingrandire Persone.":tia?"Ogni aspetto draconico è anche la forma maggiore che puoi assumere con forma draconica (Piccola e Media dal 4°, Grande dal 10°, Enorme solo al 20°). Massimo 4 aspetti e 3 forme minori; il Drago Sovrano si aggiunge solo al 20° (Vero drago). Le evoluzioni del 1° e del 3° livello sono sostituite da Resistenza di Tiamath e Soffio.":p.archetipo==="nexus"?"Ogni aspetto elementale è anche la forma maggiore che puoi assumere con forma elementale. Il nexus ha al massimo 4 aspetti e 3 forme minori.":p.archetipo==="crisalide"?"Ogni aspetto parassitico è anche la forma maggiore che puoi assumere con forma parassitica.":p.archetipo==="arboreo"?"Ogni aspetto vegetale è anche la forma maggiore che puoi assumere con forma vegetale.":"Gli animali degli aspetti scelti sono le forme maggiori che puoi assumere con mutaforma."}</p><div class="asp" style="margin-top:8px">${aspHtml}</div></div>
  <div class="box"><h2>Forme minori attive <span class="cnt">${mins.length} di ${maxM>20?"tutte":maxM}</span></h2>
    <p class="hint">Restano attive anche in forma maggiore. L'aspetto della forma assunta si aggiunge da solo.</p>
    <div class="chips" style="margin-top:8px">${minHtml}</div>
    ${mins.length?`<p class="hint" style="margin-top:8px">Potenziamento totale: ${["For","Des","Cos"].filter(k=>P[k]).map(k=>sg(P[k])+" "+k).concat(P.vel?[`+${P.vel} m velocità`]:[],P.canat?[`${sg(P.canat)} CA naturale`]:[],P.iniz?[`${sg(P.iniz)} Iniziativa`]:[]).join(", ")||"nessun bonus numerico"}${P.capped.length?` · tetto applicato: ${P.capped.join("; ")}`:""}</p>`:""}
  </div>
  <div class="box"><h2>Evoluzioni naturali <span class="cnt">${chosen.length} di ${maxE}</span></h2>
    <p class="hint">Attive mentre usi armi morfiche, un aspetto o mutaforma. Gli attacchi da evoluzione non superano di più di uno gli attacchi del BAB.</p>
    <div class="asp" style="margin-top:8px">${evoHtml}</div></div>`;
  $("p-morf").querySelectorAll("[data-asp]").forEach(el=>el.addEventListener("change",e=>{const id=+el.dataset.asp;let a=p.morfico.aspetti;
    a=e.target.checked?[...a,id]:a.filter(x=>x!==id);p.morfico.aspetti=a;p.morfico.minori=p.morfico.minori.filter(x=>a.includes(x));save();renderMorf();renderSoft()}));
  $("p-morf").querySelectorAll("[data-min]").forEach(el=>el.addEventListener("click",()=>{const id=+el.dataset.min;let m=p.morfico.minori.filter(x=>ch.includes(x));
    m=m.includes(id)?m.filter(x=>x!==id):[...m,id];p.morfico.minori=m;save();renderMorf();renderSoft()}));
  $("p-morf").querySelectorAll("[data-evo]").forEach(el=>el.addEventListener("change",e=>{const id=+el.dataset.evo;
    if(e.target.checked){const ev=evoById(id);p.morfico.evoluzioni.push(ev.ripetibile?{id,energia:"fuoco"}:{id})}else p.morfico.evoluzioni=p.morfico.evoluzioni.filter(x=>x.id!==id);
    save();renderMorf();renderSoft()}));
  $("p-morf").querySelectorAll("[data-evoadd]").forEach(el=>el.addEventListener("click",e=>{e.preventDefault();p.morfico.evoluzioni.push({id:+el.dataset.evoadd,energia:"acido"});save();renderMorf();renderSoft()}));
  $("p-morf").querySelectorAll("[data-evorm]").forEach(el=>el.addEventListener("click",e=>{e.preventDefault();const id=+el.dataset.evorm;const i=p.morfico.evoluzioni.map(x=>x.id).lastIndexOf(id);p.morfico.evoluzioni.splice(i,1);save();renderMorf();renderSoft()}));
  $("p-morf").querySelectorAll("[data-en]").forEach(el=>el.addEventListener("change",()=>{const i=+el.dataset.en;const list=p.morfico.evoluzioni.filter(x=>x.id===14);list[i].energia=el.value;save();renderScheda()}));
}

let SEARCH="";
function formsFor(p){
  if(p.classe==="druido")return FORME.filter(f=>SIZES.some(s=>access(p,f,s)));
  const names=new Set(aspList(p).filter(a=>p.morfico.aspetti.includes(a.id)).flatMap(a=>a.animali));
  return FORME.filter(f=>names.has(f.nome)&&f.vol===morfVol(p));
}
function renderForme(){
  const p=pg(), si=shapeInfo(p), v=p.vista||{};
  let html=`<div class="box"><p class="hint" style="margin:0"><b>${p.classe==="druido"?"Druido":"Morfico"} ${p.livello}°</b> · ${esc(si.txt)}</p></div>
  <div class="search"><input type="text" id="srch" placeholder="Cerca una forma o una specie (es. lupo, tigre)" value="${esc(SEARCH)}" aria-label="Cerca forma"></div>`;
  if(p.classe==="druido"&&p.archetipo==="cantore") html+=`<div class="warnbox">Il cantore degli alberi si trasforma solo in creature vegetali, ma prima del normale: Piccola e Media dal 4°, Grande dall'8°, Enorme dal 12°.</div>`;
  if(p.classe==="druido"&&p.archetipo==="montagne") html+=`<div class="warnbox">Il druido delle montagne non può trasformarsi in parassiti, ma dal 12° assume i giganti Grandi e dal 16° gli Enormi.</div>`;
  if(p.classe==="druido"&&p.archetipo==="elementalista") html+=`<div class="warnbox">Il druido elementalista non può trasformarsi in creature vegetali, ma assume gli elementali prima (Piccola e Media dall'8°, Grande dal 10°, Enorme dal 12°) e aggiunge danni della sua affinità.${p.livello>=13?" Dal 13° la forma di elementale non consuma usi.":""}</div>`;
  if(p.classe==="morfico"){
    const sel=v.kind==="naturale";
    html+=`<div class="frow nat"><div class="fn">Forma naturale</div><div class="sp">Armi morfiche, forme minori ed evoluzioni senza trasformarsi</div><div class="chips"><button type="button" class="chip${sel?" sel":""}" data-nat="1">Apri la scheda</button></div></div>`;
    if(!p.morfico.aspetti.length) html+=`<div class="warnbox">Scegli almeno un aspetto nella scheda «Aspetti ed evoluzioni»: le forme maggiori sono gli animali dei tuoi aspetti.</div>`;
  }
  const list=formsFor(p).filter(f=>!SEARCH||(f.nome+" "+f.specie.join(" ")).toLowerCase().includes(SEARCH.toLowerCase()));
  let groups;
  if(p.classe==="morfico"){
    if(p.archetipo==="arboreo"){const cs=[...new Set(VEGETALI.map(f=>f.cat))];groups=cs.map(c=>["Vegetali · "+c.toLowerCase(),list.filter(f=>f.cat===c)])}
    else if(p.archetipo==="nexus"){const cs=[...new Set(ELEMENTALI.map(f=>f.cat))];groups=cs.map(c=>[c,list.filter(f=>f.cat===c)])}
    else if(p.archetipo==="jotun"){const cs=[...new Set(GIGANTI.map(f=>f.cat))];groups=cs.map(c=>[c,list.filter(f=>f.cat===c)])}
    else if(p.archetipo==="tiamath"){const cs=[...new Set(DRACONICHE.map(f=>f.cat))];groups=cs.map(c=>[c,list.filter(f=>f.cat===c)])}
    else if(p.archetipo==="crisalide"){const cs=[...new Set(PARASSITI.map(f=>f.cat))];groups=cs.map(c=>["Parassiti · "+c.toLowerCase(),list.filter(f=>f.cat===c)])}
    else groups=ASPETTI.filter(a=>p.morfico.aspetti.includes(a.id)).map(a=>[a.nome,list.filter(f=>a.animali.includes(f.nome))])}
  else{groups=["Terrestri","Volanti","Acquatici","Dinosauri"].map(c=>[{Terrestri:"Animali terrestri",Volanti:"Animali volanti",Acquatici:"Animali acquatici",Dinosauri:"Dinosauri e rettili preistorici"}[c],list.filter(f=>f.vol==="animali"&&f.cat===c)])
    .concat([...new Set(VEGETALI.map(f=>f.cat))].map(c=>["Vegetali · "+c.toLowerCase(),list.filter(f=>f.vol==="vegetali"&&f.cat===c)]))
    .concat([...new Set(PARASSITI.map(f=>f.cat))].map(c=>["Parassiti · "+c.toLowerCase(),list.filter(f=>f.vol==="parassiti"&&f.cat===c)]))
    .concat([...new Set(ELEMENTALI.map(f=>f.cat))].map(c=>[c,list.filter(f=>f.vol==="elementali"&&f.cat===c)]))
    .concat([...new Set(GIGANTI.map(f=>f.cat))].map(c=>[c,list.filter(f=>f.vol==="giganti"&&f.cat===c)]))}
  groups.forEach(([g,fs])=>{if(!fs.length)return;
    html+=`<div class="cathead">${esc(g)}</div><div class="flist">`+fs.map(f=>{
      const chips=SIZES.map(s=>{const a=access(p,f,s);if(!a)return"";const sel=v.kind==="animale"&&v.nome===f.nome&&v.taglia===s;
        return a.ok?`<button type="button" class="chip${sel?" sel":""}" data-f="${esc(f.nome)}" data-s="${s}">${s}</button>`:`<span class="chip locked">${s} · ${a.req}</span>`}).join("");
      return `<div class="frow"><div class="fn">${esc(f.nome)}</div><div class="sp">${esc(f.specie.join(" · "))}</div><div class="chips">${chips}</div></div>`}).join("")+`</div>`});
  if(!list.length&&SEARCH)html+=`<p class="hint">Nessuna forma trovata per «${esc(SEARCH)}».</p>`;
  $("p-forme").innerHTML=html;
  const s=$("srch");s.addEventListener("input",e=>{SEARCH=e.target.value;const pos=e.target.selectionStart;renderForme();const n=$("srch");n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}} );
  $("p-forme").querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{p.vista={kind:"animale",nome:b.dataset.f,taglia:b.dataset.s};save();STATE.tab="scheda";renderTabs();renderForme();renderScheda();window.scrollTo({top:0})}));
  const nb=$("p-forme").querySelector("[data-nat]");if(nb)nb.addEventListener("click",()=>{p.vista={kind:"naturale"};save();STATE.tab="scheda";renderTabs();renderForme();renderScheda();window.scrollTo({top:0})});
}

function renderScheda(){
  const p=pg(), v=p.vista, el=$("p-scheda");
  let ok=v&&(v.kind==="naturale"?p.classe==="morfico":(()=>{const f=FORME.find(x=>x.nome===v.nome);if(!f)return false;const a=access(p,f,v.taglia);return a&&a.ok&&formsFor(p).includes(f)})());
  if(!ok){el.innerHTML=`<div class="box"><h2>Nessuna forma scelta</h2><p class="hint">Apri «Forme» e tocca una taglia per vedere la scheda completa.${v&&v.kind==="animale"?` La forma ${esc(v.nome)} ${esc(v.taglia)} non è disponibile con il livello o le scelte attuali.`:""}</p><div class="row" style="margin-top:8px"><button class="btn primary" type="button" id="go-forme">Vai alle forme</button></div></div>`;
    $("go-forme").addEventListener("click",()=>{STATE.tab="forme";save();renderTabs()});return}
  const R=computeSheet(p,v), f=R.f, L=p.livello, si=shapeInfo(p);
  const pfBase=+p.pf||0;
  const sizeChips=f?`<div class="sizebar">${SIZES.map(s=>{const a=access(p,f,s);if(!a)return"";return a.ok?`<button type="button" class="chip${s===R.size?" sel":""}" data-sz="${s}">${s}</button>`:`<span class="chip locked">${s} · ${a.req}</span>`}).join("")}</div>`:"";
  const aspTxt=R.aspAct.map(aspById);
  el.innerHTML=`
  <div class="sheethead">${!f&&p.classe==="morfico"&&p.archetipo==="jotun"?`<label class="check" style="margin:0 0 8px"><input type="checkbox" id="j-enl"${p.jEnl?" checked":""}${p.taglia==="Grande"?" disabled":""}> Forma minore manifestata: ingrandito di una taglia (${esc(p.taglia)} → ${esc(SIZES[SIZES.indexOf(p.taglia)+1]||"")})</label>${p.jEnl&&!R.aspAct.length?`<p class="hint" style="margin:0 0 8px">Scegli una forma minore in «Aspetti ed evoluzioni» per applicare l'ingrandimento.</p>`:""}`:""}
    <h2>${f?esc(f.nome):"Forma naturale"}${f?` <span class="muted" style="font-size:1rem;font-family:var(--sans);font-weight:500">· ${R.size}</span>`:""}</h2>
    ${f?`<div class="sp">${esc(f.specie.join(" · "))}</div>`:`<div class="sp">${esc(p.nome)} · armi morfiche e forme minori</div>`}
    ${sizeChips}
    ${f?`<p class="intro">${rich(f.intro)}</p>`:""}
  </div>
  ${(p.buff||[]).length?`<div class="chips buffs" style="margin:0 0 10px">${p.buff.map((b,i)=>`<button type="button" class="chip${b.on?" sel":""}" data-buff="${i}" aria-pressed="${!!b.on}">${b.on?"✓ ":""}${esc(b.nome||"Bonus")}</button>`).join("")}</div>`:""}
  <div class="stats">
    <div class="stat"><div class="k">CA</div><div class="v">${R.CA}</div><div class="s">contatto ${R.touch} · ${(f&&f.nome==="Etere")||R.aspAct.includes(312)?"Sempre pronto: mai colto alla sprovvista":"sprovvista "+R.flat}</div></div>
    <div class="stat"><div class="k">Punti Ferita · Fatica</div><div class="v">${pfBase?`${Math.ceil((pfBase+R.pfExtra)/2)} · ${Math.floor((pfBase+R.pfExtra)/2)}`:"—"}</div><div class="s">${pfBase?`totale ${pfBase+R.pfExtra}${R.pfExtra?" ("+esc(R.pfNote)+")":" (invariati)"}`:"inseriscili in Personaggio"}${R.pfTemp?` · <b>temporanei +${R.pfTemp}</b>`:""}</div></div>
    <div class="stat"><div class="k">Iniziativa</div><div class="v">${sg(R.iniz)}</div><div class="s">BAB ${sg(R.B)}${R.dM.Des?` · Des forma ${sg(R.dM.Des)}`:""}</div></div>
    <div class="stat"><div class="k">BMC · DMC</div><div class="v">${sg(R.BMC)} · ${R.DMC}</div><div class="s">manovre</div></div>
  </div>
  ${heroTS(R.TL)||heroCA(R.TL)?`<p class="hint" style="margin:-6px 0 0">Inclusi i bonus eroici (livello del personaggio ${R.TL}°): TS ${sg(heroTS(R.TL))}${heroCA(R.TL)?`, CA e DMC ${sg(heroCA(R.TL))}`:""}.</p>`:""}
  <div class="stats three">
    <div class="stat"><div class="k">Tempra</div><div class="v">${sg(R.TS.tem)}</div></div>
    <div class="stat"><div class="k">Riflessi</div><div class="v">${sg(R.TS.rif)}</div></div>
    <div class="stat"><div class="k">Volontà</div><div class="v">${sg(R.TS.vol)}</div></div>
  </div>
  <div class="box"><h2>Attacchi</h2><div class="atk">
    ${R.routines.map((r,i)=>(R.routines.length>1?`<div class="opt">Opzione ${String.fromCharCode(65+i)}</div>`:"")+r.map(atkHtml).join("")).join("")}
    ${R.dist.length?`<div class="opt">A distanza</div>`+R.dist.map(atkHtml).join(""):""}
    ${R.soffio?`<div class="opt">Soffio</div><div class="aline"><b>Soffio</b> ${esc(R.soffio.forma.toLowerCase())} di ${esc(R.soffio.area)}: ${R.soffio.n}${R.soffio.dado} di ${esc(R.soffio.energia)}, Riflessi CD ${R.soffio.cd} dimezza <span class="muted">(azione standard · ${esc(R.soffio.usi)}${R.soffio.fonte?` · aspetto ${esc(R.soffio.fonte)}`:""})</span></div>`:""}
    ${R.atkNotes.map(n=>`<div class="warnbox">${esc(n)}</div>`).join("")}
    ${R.energ?`<p class="hint"><b>${esc(R.energ)}</b></p>`:""}
    ${R.magia?`<p class="hint">${esc(R.magia)}.</p>`:""}
    ${R.furia&&R.furia.length?`<p class="hint"><b>Furia del Morfico</b> (attacco completo con un solo tipo di arma naturale, gli altri diventano secondari): ${esc(R.furia.join(" · "))}</p>`:""}
    ${R.dist.length?`<p class="hint">Gli attacchi a distanza usano Des e il TxC a distanza della tabella; quelli a contatto non sommano la Forza al danno.</p>`:""}
    ${R.T?`<p class="hint">Attacchi secondari −5 al TxC. ${R.routines.some(r=>r.filter(a=>a.dice&&!a.noroll).reduce((s,a)=>s+a.n,0)===1)?"Con un solo attacco si usa il Danno singolo della tabella.":"Con più attacchi si usa il Danno multiplo della tabella."} TxC a distanza ${sg(R.B+R.Des+R.T.txcd+(+p.bonus.txc||0))} (Des).</p>`:""}
  </div></div>
  <div class="box"><h2>Movimento e sensi</h2><dl class="kv">
    <dt>Velocità</dt><dd>${esc(R.speed)}</dd>
    ${R.spazio?`<dt>Spazio</dt><dd>${esc(R.spazio)}</dd><dt>Portata</dt><dd>${esc(R.portata)}</dd>`:""}
    <dt>Sensi</dt><dd>${R.sensi.length?esc(R.sensi.join("; ")):"quelli del personaggio"}</dd>
    <dt>Abilità</dt><dd>${R.skills.length?R.skills.map(esc).join("<br>"):"nessun modificatore"}</dd>
  </dl>${f&&((f.tratti&&f.tratti.length)||R.difese)?`<p class="hint" style="margin-top:8px"><b>Difese e tratti:</b> ${rich([R.difese].concat(f.tratti||[]).filter(Boolean).join("; "))}</p>`:""}${R.tiaRes?`<p class="hint" style="margin-top:6px">${esc(R.tiaRes)}</p>`:""}${f&&f.vol==="giganti"?`<p class="hint" style="margin-top:6px">Tratti dei giganti: 2 Schianti primari o arma impugnata (mai entrambi nello stesso round); le capacità si attivano con Schianto, arma o roccia lanciata. Nessuna forma di gigante vola. Nuotare e Scalare danno +8 alle prove.${R.size==="Mastodontica"?" A taglia Mastodontica è attivo il Dominio.":""}</p>`:""}${f&&f.vol==="draconiche"?`<p class="hint" style="margin-top:6px">Tratti draconici: volo a bassa quota, massimo 3 m dal suolo e nessun carico oltre il leggero fino al 17° livello, poi volo standard${f.nome==="Drago d'Argento"?" (Drago d'Argento: dal 14° con Ascesa Argentea)":""}. Multiattacco mai concesso: gli attacchi secondari hanno −5 fisso. Nuotare e Scalare della forma danno +8 alle prove. Durata standard delle capacità: ${Math.floor(p.livello/4)+2} round.${p.archetipo==="tiamath"?" Tutti gli attacchi naturali della forma hanno i benefici delle armi morfiche con il dado maggiore.":""}</p>`:""}${f&&f.vol==="vegetali"?`<p class="hint" style="margin-top:6px">Tratti dei Vegetali: immune a <span class="cond">Paralizzato</span>, <span class="cond">Stordito</span>, <b>[VELENO]</b> e <b>[SONNO]</b>. Restano possibili [INFLUENZA MENTALE], colpi critici e Attacchi Furtivi.</p>`:""}${p.classe==="morfico"&&p.archetipo==="arboreo"?`<p class="hint" style="margin-top:6px"><b>Corpo vegetale:</b> ${L>=14?75:L>=8?50:25}% di ignorare critici e danni da precisione; +4 ai TS contro [VELENO], [PARALISI], [TORPORE] e [SONNO]${f?" (immunità piena in forma maggiore)":""}; immune a [RISUCCHIO DI SANGUE]; 50% a inizio turno di terminare [SANGUINAMENTO].</p>`:""}${p.classe==="morfico"&&p.archetipo==="crisalide"&&L>=4?`<p class="hint" style="margin-top:6px"><b>Corpo chitinoso:</b> RD ${Math.floor(L/2)}/contundente (si somma a una RD dello stesso tipo della forma, fino a ${Math.floor(L/2)+5}); immune a [SANGUINAMENTO] e [RISUCCHIO DI SANGUE]; +4 ai TS contro [MALATTIA]${f?" (immunità piena in forma maggiore)":""}.</p>`:""}${f&&f.vol==="elementali"?`<p class="hint" style="margin-top:6px">Tratti elementali: immune al proprio elemento${SIZES.indexOf(R.size)>=3?"; immune a <b>[SANGUINAMENTO]</b>, colpi critici e Attacchi Furtivi":""}${R.size==="Enorme"?"; RD 5/—":""}. Restano possibili <span class="cond">Paralizzato</span>, <span class="cond">Stordito</span>, <b>[VELENO]</b> e <b>[SONNO]</b>.${f.accurata?" <b>Arma Accurata:</b> il TxC usa la Destrezza, il danno resta sulla Forza.":""}${/Volare/.test(R.speed)?" Volo: massimo 3 m dal suolo fino al 17° livello, poi volo standard; nessun limite di taglia.":""}</p>`:""}${f&&f.vol==="parassiti"?`<p class="hint" style="margin-top:6px">Mente del druido: mantieni coscienza, Int, Sag e Car e non ottieni l'immunità agli effetti mentali dei parassiti.${R.size==="Minuscola"&&/Volare/.test(R.speed)?" Volo dei parassiti: solo a taglia Minuscola, massimo 3 m dal suolo fino al 17° livello, poi senza limite d'altezza.":""}</p>`:""}${f&&f.cat==="Volanti"?`<p class="hint" style="margin-top:8px">Volo a bassa quota: massimo 3 m dal suolo e solo carico leggero fino al 17° livello; dal 18° volo standard.</p>`:""}</div>
  ${f?`<div class="box"><h2>Capacità straordinarie</h2>${R.caps.map(c=>`<div class="cap${c.on.on?"":" off"}"><span class="cn">${rich(c.nome)}</span>${c.tag?`<span class="ct">[${esc(c.tag)}]</span>`:""}${!c.on.on?` <span class="pill">non a questa taglia</span>`:""}${c.on.note?` <span class="pill">${esc(c.on.note)}</span>`:""}<p>${rich(lvlTxt(c.corpo,p,R.dM,R.soffio||(R.f&&R.f.vol==="draconiche"?{n:Math.min(16,Math.max(R.f.soffio.taglie[R.size].dadi,p.livello-4)),dado:R.f.soffio.dado,cd:10+Math.floor(p.livello/2)+R.Cos+R.dM.Cos}:null)))}</p></div>`).join("")}
    ${f.note&&f.note.length?`<p class="hint">${esc(f.note.join(" "))}</p>`:""}</div>`:""}
  ${p.classe==="morfico"?`<div class="box"><h2>Aspetti attivi</h2>${aspTxt.length?aspTxt.map(a=>`<div class="cap"><span class="cn">${esc(a.nome)}</span>${f&&a.animali.includes(f.nome)?` <span class="pill">forma maggiore</span>`:` <span class="pill">forma minore</span>`}<p><b>Potenziamento:</b> ${potTxt(a.id,L)}. <b>Passivo:</b> ${rich(lvlTxt(a.passivo,p,R.dM))}</p></div>`).join(""):`<p class="hint">Nessun aspetto attivo.</p>`}
    ${R.P.capped.length?`<p class="hint">Tetto dei bonus di potenziamento al ${L}° livello: ${esc(R.P.capped.join("; "))}.</p>`:""}</div>
    <div class="box"><h2>Evoluzioni</h2>${R.evos.length?R.evos.map(e=>{const ul=upLevel(e);return `<div class="cap"><span class="cn">${esc(e.nome)}</span>${e.energia?` <span class="pill">${esc(e.energia)}</span>`:""}<p>${rich(e.base)}${e.up&&ul&&L>=ul?` <b>${rich(e.up)}</b>`:""}</p></div>`}).join(""):`<p class="hint">Nessuna evoluzione scelta.</p>`}</div>`:""}
  ${f&&f.chiusura?`<p class="closing"><b>Note d'uso:</b> ${rich(f.chiusura)}</p>`:""}
  <div class="box"><h2>Trasformazione</h2><ul class="list">
    <li>${esc(si.txt)}</li>
    ${f?`<li>Mantieni le tue caratteristiche; la taglia ${R.size} dà: ${(f.vol==="elementali"?"i modificatori della tabella della forma":f.vol==="draconiche"?DELTA_DRA[R.size]:f.vol==="giganti"?DELTA_GIG[R.size]:esc((f.vol==="vegetali"?DELTA_VEG:f.vol==="parassiti"?DELTA_PAR:DELTA_TXT)[R.size]))} (già calcolato nella tabella).</li>
    <li>${f&&f.vol==="giganti"?"L'equipaggiamento si ridimensiona con te e resta pienamente utilizzabile: armatura e scudo contano sempre, anche senza qualità selvatica.":`L'equipaggiamento si fonde nel corpo; continuano a funzionare solo gli oggetti con bonus costanti${p.arm.selvatica?" e l'armatura selvatica":""}.`}</li>
    <li>${p.classe==="druido"&&p.archetipo==="cantore"&&f.vol==="vegetali"?"In forma vegetale conservi la voce: puoi parlare e lanciare incantesimi con componenti verbali e somatiche.":p.classe==="morfico"&&p.archetipo==="arboreo"?"Puoi parlare (Lingua verdeggiante), ma non lanciare incantesimi con componenti verbali o somatiche.":p.classe==="morfico"&&p.archetipo==="crisalide"?"Non puoi parlare né lanciare incantesimi con componenti verbali o somatiche, ma comunichi con i parassiti (Lingua feromonica).":f&&f.vol==="elementali"?"Non puoi parlare né lanciare incantesimi con componenti verbali o somatiche; comunichi con gli elementali del tuo elemento.":f&&f.vol==="giganti"?"Parli normalmente e lanci incantesimi con componenti verbali e somatiche; comprendi e parli il Gigante.":f&&f.vol==="draconiche"?"Non puoi parlare né lanciare incantesimi con componenti verbali o somatiche; comunichi con altri draghi e con le creature dello stesso tipo.":"Non puoi parlare né lanciare incantesimi con componenti verbali o somatiche."}</li>
    <li>Perdi sensi, velocità, attacchi naturali, portata e tratti razziali della forma originale; ottieni quelli della forma.</li>
    ${p.classe==="druido"?"<li>Gli effetti che modificano la taglia non hanno effetto su di te.</li>":""}`:`<li>Le forme minori non sono effetti di [METAMORFOSI]: conservi equipaggiamento, parola e mani.</li>`}
  </ul>
  <details class="more"><summary>Dettaglio dei calcoli</summary><div class="calc" style="margin-top:6px">
    <div><b>CA ${R.CA}</b> = ${esc(R.caCalc.join(" + "))}</div>
    ${R.T?`<div><b>Tabella di taglia</b> (${R.size} da ${p.taglia}): TxC ${sg(R.T.txc)}, TxC dist ${sg(R.T.txcd)}, Dan. Mul. ${sg(R.T.dmul)}, Dan. Sin. ${sg(R.T.dsin)}, CA nat ${sg(R.T.canat)}, CA taglia ${sg(R.T.catag)}, CA Des ${sg(R.T.cades)}, TS Temp ${sg(R.T.tem)}, TS Rifl ${sg(R.T.rifl)}, BMC ${sg(R.T.bmc)}, DMC ${sg(R.T.dmc)}${R.T.pf?`, PF/liv ${sg(R.T.pf)}`:""}</div>`:""}
    <div><b>TxC</b> = BAB ${sg(R.B)} + For ${sg(R.For)}${R.T?" + taglia "+sg(R.T.txc):""}${+p.bonus.txc?" + altri "+sg(+p.bonus.txc):""}</div>
    ${R.routines.flat().concat(R.dist).filter(a=>a.dmg).map(a=>`<div><b>${esc(a.name)}</b>: ${esc(a.dice)} ${esc(a.detail.join(", "))}</div>`).join("")}
    ${R.T&&(R.dM.For||R.dM.Des||R.dM.Cos)?`<div><b>Modificatori di caratteristica della forma</b>: For ${sg(R.dM.For)}, Des ${sg(R.dM.Des)}, Cos ${sg(R.dM.Cos)} (già inclusi nella tabella; applicati anche a Iniziativa e CD)</div>`:""}
    ${p.classe==="morfico"?`<div><b>Caratteristiche in uso</b>: For ${effCar(p,"For")}, Des ${effCar(p,"Des")}, Cos ${effCar(p,"Cos")}</div>`:""}
  </div></details></div>`;
  el.querySelectorAll("[data-buff]").forEach(b=>b.addEventListener("click",()=>{const x=p.buff[+b.dataset.buff];x.on=!x.on;save();renderScheda()}));
  const je=$("j-enl");if(je)je.addEventListener("change",e=>{p.jEnl=e.target.checked;save();renderScheda()});
  el.querySelectorAll("[data-sz]").forEach(b=>b.addEventListener("click",()=>{p.vista={kind:"animale",nome:f.nome,taglia:b.dataset.sz};save();renderScheda();renderForme()}));
}

/* ------------------------------------------------------------ avvio */
load();
if(!STATE.tab)STATE.tab="scheda";
$("pgsel").addEventListener("change",e=>{STATE.cur=e.target.value;save();renderAll()});
$("cls-druido").addEventListener("click",()=>switchClass("druido"));
$("cls-morfico").addEventListener("click",()=>switchClass("morfico"));
function switchClass(c){const p=pg();if(p.classe===c)return;const other=STATE.chars.find(x=>x.classe===c);
  if(other){STATE.cur=other.id}else{const n=blankPG(c);STATE.chars.push(n);STATE.cur=n.id}save();renderAll()}
$("btn-new").addEventListener("click",()=>{const n=blankPG(pg().classe);STATE.chars.push(n);STATE.cur=n.id;STATE.tab="pg";save();renderAll()});
$("btn-dup").addEventListener("click",()=>{const o=JSON.parse(JSON.stringify(pg()));o.id="pg"+Date.now().toString(36);o.nome=o.nome+" (copia)";STATE.chars.push(o);STATE.cur=o.id;save();renderAll()});
["pg","morf","forme","scheda"].forEach(t=>$("tab-"+t).addEventListener("click",()=>{STATE.tab=t;save();renderTabs();window.scrollTo({top:0})}));
renderAll();
</script>
