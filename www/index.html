getti","tag":"dal Media","corpo":"Come azione standard può lanciare qualsiasi oggetto di taglia piccola o inferiore fino a 12 m (danno da oggetto +1½For), senza penalità ai TxC. Dal Grande, può scagliare oggetti o rocce fino a taglia Media, infliggendo danni da arma improvvisata +1½For."},{"nome":"Petto di Gorilla","tag":"dal Grande","corpo":"Una volta al giorno come azione gratuita, si tamburella il petto con un rombo. I nemici entro 9 m con DV ≤ ai suoi devono superare un TS su Volontà (CD 10+½DV+mod.Car) o essere Scossi per 2d4 round. Gli alleati entro 9 m ottengono bonus morale +2 ai TxC e +2 ai TS contro la paura per 2d4 round."}],"chiusura":"l'unica forma terrestre con mani vere: Mani Prensili concedono Afferrare e il tentativo di Disarmare, e dal Media lanci oggetti a 12 m mentre le altre forme restano in mischia. Dal Grande, Petto di Gorilla è un'ottima apertura contro nemici con pochi DV.","canatExtra":0},{"nome":"Mustelide","cat":"Terrestri","specie":["Donnola","Furetto","Visone","Lontra","Tasso","Ghiottone","Wolverine"],"intro":"I mustelidi sono carnivori agili e tenaci, con un morso potente rispetto alla taglia. Le forme piccole come la donnola sono eccellenti in spazi ristretti; il ghiottone (wolverine) è il più feroce della famiglia, capace di tenere testa ad animali molto più grandi. La lontra è un'ottima nuotatrice.","vel":[{"sizes":["Minuscola"],"label":"Minuscola (donnola/furetto)","val":"9 m, Scalare 6 m"},{"sizes":["Piccola"],"label":"Piccola (visone)","val":"12 m, Nuotare 6 m (lontra: 12 m)"},{"sizes":["Media"],"label":"Media (lontra grande/tasso)","val":"9 m, Nuotare 12 m (lontra), Scalare 6 m (tasso)"},{"sizes":["Grande"],"label":"Grande (ghiottone)","val":"12 m, Scalare 9 m"},{"sizes":["Enorme"],"label":"Enorme (ghiottone antico)","val":"12 m, Scalare 6 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"}],"bonus":"+4 Furtività, +4 Percezione, +8 Scalare (donnola/tasso/ghiottone), +8 Nuotare (lontra)","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d2","str":1.5,"crit":null,"extra":["Attacca e Mantieni"]}]],"spazio":"0,75 m","portata":"0 m","raw":"Morso (1d2+1½For più Attacca e Mantieni)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d4","str":1.5,"crit":null,"extra":["Attacca e Mantieni"]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d4+1½For più Attacca e Mantieni)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":1.5,"crit":null,"extra":["Attacca e Mantieni"]},{"n":2,"name":"Artigli","sec":true,"dice":"1d3","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d6+1½For più Attacca e Mantieni), 2 Artigli (att.sec. -5TxC, 1d3+½For)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d8","str":1.5,"crit":null,"extra":["Attacca e Mantieni"]},{"n":2,"name":"Artigli","sec":true,"dice":"1d4","str":0.5,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"1,5 m","raw":"Morso (1d8+1½For più Attacca e Mantieni), 2 Artigli (att.sec. -5TxC, 1d4+½For)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":1.5,"crit":null,"extra":["Attacca e Mantieni"]},{"n":2,"name":"Artigli","sec":true,"dice":"1d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"4,5 m","portata":"3 m","raw":"Morso (2d6+1½For più Attacca e Mantieni), 2 Artigli (att.sec. -5TxC, 1d6+½For)","lv18":false}},"note":[],"capacita":[{"nome":"Attacca e Mantieni","tag":null,"corpo":"Quando il mustelide colpisce con il morso, può agganciare la mandibola al bersaglio come azione gratuita senza effettuare una prova di lotta. Il morso infligge automaticamente i danni ogni round finché il mustelide non si stacca volontariamente (azione gratuita) o viene rimosso con una prova di lotta riuscita."},{"nome":"Ferocia","tag":null,"corpo":"Se a ≤ metà PF, ottiene bonus razziale +2 ai TxC in mischia e ai danni e +1 schivare alla CA."},{"nome":"Scavare","tag":"dal Media — Tasso","corpo":"Il tasso ottiene velocità di Scavare 3 m e può creare tane nel terreno morbido."},{"nome":"Rabbia del Ghiottone","tag":"dal Grande","corpo":"Una volta al giorno come azione gratuita: +4 Forza e Costituzione, +2 ai TS Volontà, -2 CA per 1 minuto. Non può usare abilità che richiedono concentrazione durante la rabbia."}],"chiusura":"alle taglie minori entri dove nessun altro arriva; in mischia aggancia con Attacca e Mantieni e lascia lavorare Ferocia. Il Tasso ottiene Scavare dal Media, il Ghiottone dal Grande una Rabbia da +4 Forza e Costituzione al prezzo di -2 CA.","canatExtra":0},{"nome":"Puzzola","cat":"Terrestri","specie":["Puzzola","Moffetta"],"intro":"La puzzola è un mustelide dal temperamento tranquillo che affida la propria sopravvivenza a una difesa chimica formidabile: una secrezione nauseabonda che spruzza con precisione contro chi la minaccia. Poco incline al combattimento diretto, tiene a distanza qualunque predatore.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"6 m"},{"sizes":["Piccola"],"label":"Piccola","val":"9 m"},{"sizes":["Media"],"label":"Media","val":"9 m"},{"sizes":["Grande"],"label":"Grande","val":"12 m"},{"sizes":["Enorme"],"label":"Enorme","val":"12 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"}],"bonus":"+4 Furtività, +4 Percezione","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d2","str":0.5,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Morso (1d2+½For)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d3","str":0.5,"crit":null,"extra":[]},{"n":2,"name":"Artigli","sec":true,"dice":"1d2","str":0,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d3+½For), 2 Artigli (att.sec. -5TxC, 1d2)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d4","str":0.5,"crit":null,"extra":[]},{"n":2,"name":"Artigli","sec":true,"dice":"1d3","str":0,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d4+½For), 2 Artigli (att.sec. -5TxC, 1d3)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":0.5,"crit":null,"extra":[]},{"n":2,"name":"Artigli","sec":true,"dice":"1d4","str":0,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"1,5 m","raw":"Morso (1d6+½For), 2 Artigli (att.sec. -5TxC, 1d4)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d8","str":0.5,"crit":null,"extra":[]},{"n":2,"name":"Artigli","sec":true,"dice":"1d6","str":0,"crit":null,"extra":[]}]],"spazio":"4,5 m","portata":"3 m","raw":"Morso (1d8+½For), 2 Artigli (att.sec. -5TxC, 1d6)","lv18":false}},"note":[],"capacita":[{"nome":"Nebbia Urticante","tag":null,"corpo":"Una volta ogni 1d4 round come azione standard: cono di 1,5 m (Minuscola/Piccola), 3 m (Media), 4,5 m (Grande) o 6 m (Enorme). Le creature colpite sono Nauseate per 1d4 round (TS Tempra CD 10+½DV+mod.Cos annulla). Entro 15 m: TS Tempra CD 8 o Nauseate per 1 round."},{"nome":"Spruzzo Mirato","tag":"dal Piccola","corpo":"Come azione standard, getto mirato con attacco di contatto a distanza fino a 4,5 m (Piccola–Media) o 9 m (Grande–Enorme). Se colpisce, il bersaglio è Accecato per 1d4 round e Nauseato per 1 round (TS Riflessi CD 10+½DV+mod.Des dimezza a solo Nauseato)."},{"nome":"Fetore Persistente","tag":null,"corpo":"Chi viene spruzzato porta il fetore addosso per 1d4+4 ore: subisce -4 alle prove sociali e non può usare la Furtività per nascondersi a predatori dotati di Fiuto."}],"chiusura":"è controllo, non danno: la Nebbia Urticante lascia Nauseate tutte le creature nel cono ogni 1d4 round e lo Spruzzo Mirato le rende Accecate a distanza. Il Fetore Persistente dura ore: valutalo prima di usarlo su chi dovrete poi interrogare.","canatExtra":0},{"nome":"Istrice","cat":"Terrestri","specie":["Porcospino","Istrice crestato","Istrice africano","Istrice gigante"],"intro":"L'istrice è un roditore ricoperto di aculei rigidi che usa come difesa passiva e attiva. Qualsiasi creatura che tenti di afferrarlo o colpirlo in mischia rischia di ricevere aculei conficcati nella carne. Gli aculei più grandi possono essere lanciati come proiettili a corto raggio. Nelle taglie maggiori gli aculei diventano vere lance naturali.","vel":[{"sizes":["Minuscola","Piccola"],"label":"Minuscola–Piccola (porcospino)","val":"9 m"},{"sizes":["Media"],"label":"Media (istrice)","val":"9 m"},{"sizes":["Grande","Enorme"],"label":"Grande–Enorme (istrice gigante)","val":"9 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"}],"bonus":"+4 Furtività, +4 Percezione","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Aculei","sec":false,"dice":"1d2","str":1,"crit":null,"extra":["contatto"]}]],"spazio":"0,75 m","portata":"0 m","raw":"Aculei (1d2+For, contatto)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Aculei","sec":false,"dice":"1d3","str":1,"crit":null,"extra":["contatto"]},{"n":1,"name":"Morso","sec":true,"dice":"1d3","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Aculei (1d3+For, contatto), Morso (att.sec. -5TxC, 1d3+½For)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Aculei","sec":false,"dice":"1d4","str":1,"crit":null,"extra":["contatto"]},{"n":1,"name":"Morso","sec":true,"dice":"1d4","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Aculei (1d4+For, contatto), Morso (att.sec. -5TxC, 1d4+½For)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Aculei","sec":false,"dice":"1d6","str":1,"crit":null,"extra":["contatto"]},{"n":1,"name":"Morso","sec":true,"dice":"1d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"1,5 m","raw":"Aculei (1d6+For, contatto), Morso (att.sec. -5TxC, 1d6+½For)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Aculei","sec":false,"dice":"2d6","str":1,"crit":null,"extra":["contatto"]},{"n":1,"name":"Morso","sec":true,"dice":"1d8","str":0.5,"crit":null,"extra":[]}]],"spazio":"4,5 m","portata":"3 m","raw":"Aculei (2d6+For, contatto), Morso (att.sec. -5TxC, 1d8+½For)","lv18":false}},"note":[],"capacita":[{"nome":"Aculei difensivi","tag":null,"corpo":"Ogni creatura che colpisce l'istrice in mischia con un'arma non allungata o che tenta di Afferrarlo subisce automaticamente danni da Aculei (Minuscola: 1; Piccola: 1d3; Media: 1d4; Grande: 1d6; Enorme: 2d6) senza possibilità di TS. Gli aculei rimangono conficcati e impongono -1 alle prove fisiche finché non vengono rimossi (azione intera, CD Medicina 12)."},{"nome":"Lancio di aculei","tag":"dal Piccola","corpo":"Come azione standard, può lanciare aculei come attacchi a distanza (gittata 6 m). Danni uguali a quelli degli Aculei difensivi. Fino a 3 lanci per round. Dopo 2d6 lanci la scorta si esaurisce e si rigenera in 24 ore."},{"nome":"Schiena di Aculei","tag":"dal Media","corpo":"Come azione gratuita una volta per round, l'istrice può drizzare gli aculei. Finché sono drizzati, chiunque lo colpisca in mischia subisce automaticamente danni da aculei. Un attaccante con Attacco Naturale deve superare TS Riflessi (CD 10+½DV+mod.Des) o avere l'arto Immobilizzato per 1 round."},{"nome":"Carica di Aculei","tag":"solo Enorme","corpo":"Quando compie una Carica, infligge il doppio dei danni con gli Aculei e obbliga il bersaglio a superare un TS Tempra (CD 10+½DV+mod.For) o essere Rallentato per 1 round."}],"chiusura":"chi ti colpisce in mischia o prova ad Afferrarti si ferisce da solo sugli Aculei difensivi, e dal Media la Schiena di Aculei alza ancora il prezzo. Dal Piccola puoi anche lanciarli a 6 m quando conviene restare a distanza.","canatExtra":0},{"nome":"Uccello Terrestre","cat":"Terrestri","specie":["Pollo","Dodo","Pinguino","Struzzo","Emù","Roncaccia","Uccello del Terrore"],"intro":"Gli uccelli terrestri non possono volare (o volano solo brevemente). Le forme piccole sono perlopiù inutili in combattimento, ma le forme grandi come lo struzzo o l'uccello del terrore sono predatori veloci e letali, capaci di scattare in carica e sventrare con il becco.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"6 m"},{"sizes":["Piccola"],"label":"Piccola","val":"9 m"},{"sizes":["Media"],"label":"Media","val":"12 m"},{"sizes":["Grande"],"label":"Grande","val":"15 m"},{"sizes":["Enorme"],"label":"Enorme","val":"18 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Visione crepuscolare"}],"bonus":"+4 Percezione","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Becco","sec":false,"dice":"1d2","str":1,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Becco (1d2+For)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Becco","sec":false,"dice":"1d4","str":1,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Becco (1d4+For)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Becco","sec":false,"dice":"1d6","str":1,"crit":null,"extra":[]},{"n":2,"name":"Calci","sec":true,"dice":"1d4","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Becco (1d6+For), 2 Calci (att.sec. -5TxC, 1d4+½For)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Becco","sec":false,"dice":"1d8","str":1.5,"crit":"19-20","extra":[]},{"n":2,"name":"Calci","sec":true,"dice":"1d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"3 m","raw":"Becco (1d8+1½For, 19-20), 2 Calci (att.sec. -5TxC, 1d6+½For)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Becco","sec":false,"dice":"2d6","str":1.5,"crit":"19-20","extra":[]},{"n":2,"name":"Calci","sec":true,"dice":"1d8","str":0.5,"crit":null,"extra":[]}]],"spazio":"4,5 m","portata":"4,5 m","raw":"Becco (2d6+1½For, 19-20), 2 Calci (att.sec. -5TxC, 1d8+½For)","lv18":false}},"note":[],"capacita":[{"nome":"Balzo Predatorio","tag":"dal Grande","corpo":"Quando compie una Carica, può effettuare un attacco completo (Becco + 2 Calci) al termine del movimento, invece del solo attacco di carica."},{"nome":"Becco Letale","tag":"dal Grande","corpo":"Il becco minaccia un critico con 19-20. Su un colpo critico col Becco, il bersaglio deve superare un TS su Tempra (CD 10+½DV+mod.For) o subire [SANGUINAMENTO]: perde 1d6 PF (Grande) o 1d8 PF (Enorme) all'inizio di ogni suo turno finché non riceve cure magiche o una prova di Guarire (CD 15)."},{"nome":"Carica Improvvisa","tag":"dal Grande","corpo":"Quando in Carica l'attacco con il becco va a segno (anche come parte del Balzo Predatorio), può tentare Sbilanciare come azione gratuita senza provocare AoO. Se fallisce, non può essere sbilanciato a sua volta."},{"nome":"Morso Devastante","tag":"solo Enorme","corpo":"Il becco enorme sfonda armature: ignora 2 punti di riduzione del danno su ogni attacco con il becco."}],"chiusura":"alle taglie minori è una forma puramente narrativa: la scheda vive dal Grande in su, dove Balzo Predatorio dà un attacco completo in Carica e Carica Improvvisa apre a Sbilanciare. A Enorme il Morso Devastante ignora 2 punti di riduzione del danno.","canatExtra":0},{"nome":"Elefante / Mammuth","cat":"Terrestri","specie":["Elefante africano","Elefante indiano","Mammuth lanoso"],"intro":"L'elefante è il più grande animale terrestre. Le sue zanne possono essere devastanti in carica, e la proboscide è un'arma versatile capace di afferrare gli avversari e sbatterli al suolo. Il Travolgere è irresistibile. Forme di taglia inferiore rappresentano elefantini o elefanti di dimensioni ridotte.","vel":[{"sizes":["Minuscola","Piccola","Media"],"label":"Minuscola–Media","val":"9 m"},{"sizes":["Grande"],"label":"Grande","val":"12 m"},{"sizes":["Enorme"],"label":"Enorme","val":"12 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"}],"bonus":"+4 Percezione","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Proboscide","sec":false,"dice":"1d3","str":1.5,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Proboscide (1d3+1½For)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Zanne","sec":false,"dice":"1d6","str":1.5,"crit":null,"extra":[]},{"n":1,"name":"Proboscide","sec":true,"dice":"1d4","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Zanne (1d6+1½For), Proboscide (att.sec. -5TxC, 1d4+½For)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Zanne","sec":false,"dice":"1d8","str":1.5,"crit":null,"extra":[]},{"n":1,"name":"Proboscide","sec":true,"dice":"1d6","str":0.5,"crit":null,"extra":["Afferrare"]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Zanne (1d8+1½For), Proboscide (att.sec. -5TxC, 1d6+½For più Afferrare)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Zanne","sec":false,"dice":"2d6","str":1.5,"crit":null,"extra":[]},{"n":1,"name":"Proboscide","sec":true,"dice":"1d8","str":0.5,"crit":null,"extra":["Afferrare"]}]],"spazio":"3 m","portata":"1,5 m","raw":"Zanne (2d6+1½For), Proboscide (att.sec. -5TxC, 1d8+½For più Afferrare)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Zanne","sec":false,"dice":"2d8","str":1.5,"crit":null,"extra":[]},{"n":1,"name":"Proboscide","sec":true,"dice":"2d6","str":0.5,"crit":null,"extra":["Afferrare"]}]],"spazio":"4,5 m","portata":"3 m","raw":"Zanne (2d8+1½For), Proboscide (att.sec. -5TxC, 2d6+½For più Afferrare)","lv18":false}},"note":[],"capacita":[{"nome":"Proboscide","tag":"dal Media","corpo":"L'attacco di Proboscide ha Afferrare. Mentre mantiene la presa su un bersaglio di taglia inferiore, come azione può: Sbattere a terra (infligge danni della Proboscide +1½For contundenti e il bersaglio è Prono, senza TS); oppure Scagliare (lo lancia fino a 4,5 m, subendo danni da caduta — Grande 1d6, Enorme 2d6 — ed è Prono)."},{"nome":"Travolgere","tag":"dal Grande","corpo":"Come azione di round completo, Oltrepassa creature di almeno una taglia inferiore. Danni: Grande 3d6+1½For, Enorme 4d8+1½For. Un Tiro Salvezza su Riflessi (CD 10+½DV+mod.For) dimezza."},{"nome":"Soffio d'aria","tag":"solo Enorme","corpo":"Una volta al round come azione gratuita, l'elefante può emettere un soffio dalla proboscide in un cono da 3 m. Le creature nel cono devono superare un TS Riflessi (CD 10+½DV+mod.For) o essere Spinte di 1,5 m."}],"chiusura":"usa portata e massa: la Proboscide Afferra e dal Grande Travolgere apre corridoi tra i nemici minori. A Enorme il Soffio d'aria è un'azione gratuita ogni round, utile per tenere pulito lo spazio intorno a te.","canatExtra":0},{"nome":"Giraffa","cat":"Terrestri","specie":["Giraffa reticolata","Giraffa masai","Giraffa settentrionale","Giraffa del sud"],"intro":"La giraffa è il più alto animale terrestre, con il suo collo straordinariamente lungo che le conferisce una portata di attacco unica tra i quadrupedi. I calci delle zampe anteriori e posteriori sono le sue armi principali. Nonostante l'aspetto docile, può difendersi efficacemente da leoni e leopardi. Il collo lungo garantisce portata estesa anche per la testata.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"9 m"},{"sizes":["Piccola"],"label":"Piccola","val":"12 m"},{"sizes":["Media"],"label":"Media","val":"15 m"},{"sizes":["Grande"],"label":"Grande","val":"15 m"},{"sizes":["Enorme"],"label":"Enorme","val":"18 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"}],"bonus":"+4 Percezione, +4 Sopravvivenza (ambienti di savana)","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Calcio","sec":false,"dice":"1d3","str":1.5,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Calcio (1d3+1½For)","lv18":false},"Piccola":{"alts":[[{"n":2,"name":"Calci","sec":false,"dice":"1d4","str":1,"crit":null,"extra":[]},{"n":1,"name":"Testata","sec":true,"dice":"1d3","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"2 Calci (1d4+For), Testata (att.sec. -5TxC, 1d3+½For)","lv18":false},"Media":{"alts":[[{"n":2,"name":"Calci","sec":false,"dice":"1d6","str":1,"crit":null,"extra":[]},{"n":1,"name":"Testata","sec":true,"dice":"1d4","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"2 Calci (1d6+For), Testata (att.sec. -5TxC, 1d4+½For)","lv18":false},"Grande":{"alts":[[{"n":2,"name":"Calci","sec":false,"dice":"2d6","str":1,"crit":null,"extra":["Sbilanciare"]},{"n":1,"name":"Testata","sec":true,"dice":"1d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"3 m","raw":"2 Calci (2d6+For più Sbilanciare), Testata (att.sec. -5TxC, 1d6+½For)","lv18":false},"Enorme":{"alts":[[{"n":2,"name":"Calci","sec":false,"dice":"2d8","str":1,"crit":null,"extra":["Sbilanciare"]},{"n":1,"name":"Testata","sec":true,"dice":"2d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"4,5 m","portata":"4,5 m","raw":"2 Calci (2d8+For più Sbilanciare), Testata (att.sec. -5TxC, 2d6+½For)","lv18":false}},"note":[],"capacita":[{"nome":"Collo Lungo","tag":null,"corpo":"La portata della testata è raddoppiata rispetto alla norma (indicato nella tabella). La creatura ignora la penalità di attacco a portata estesa con la testata."},{"nome":"Calci Poderosi","tag":"dal Grande","corpo":"Se entrambi i calci colpiscono lo stesso bersaglio nello stesso round, può tentare Sbilanciare come azione gratuita senza provocare AoO."},{"nome":"Vista Panoramica","tag":null,"corpo":"L'altezza eccezionale conferisce +4 aggiuntivo (cumulativo con il bonus razziale) alle prove di Percezione per avvistare a distanza. La creatura non può essere fiancheggiata da creature di taglia inferiore a Grande."},{"nome":"Calcio Difensivo","tag":"dal Grande","corpo":"Quando una creatura tenta di avvicinarsi al fianco o al dietro della giraffa, questa può effettuare un attacco di opportunità con un calcio anche se non è il proprio turno."}],"chiusura":"in esplorazione vale per Vista Panoramica: +4 aggiuntivo a Percezione e una linea di vista che nessun'altra forma terrestre ti dà. In combattimento sfrutta la portata doppia del Collo Lungo e, dal Grande, il Calcio Difensivo contro chi prova ad aggirarti.","canatExtra":0},{"nome":"Cammello","cat":"Terrestri","specie":["Dromedario","Cammello battriano","Cammello selvatico","Cammello gigante"],"intro":"Il cammello è l'animale per eccellenza del deserto: resistente alla sete, alla fame e al calore estremo. Le sue gobbe immagazzinano riserve di grasso. Il suo sputo è celebre quanto sgradevole. Nelle taglie maggiori diventa un animale da soma formidabile con calci devastanti.","vel":[{"sizes":["Minuscola","Piccola"],"label":"Minuscola–Piccola","val":"12 m"},{"sizes":["Media"],"label":"Media","val":"12 m"},{"sizes":["Grande"],"label":"Grande","val":"15 m"},{"sizes":["Enorme"],"label":"Enorme","val":"18 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"}],"bonus":"+4 Percezione, +4 Sopravvivenza (deserti e ambienti aridi)","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d2","str":1,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Morso (1d2+For)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d3","str":1,"crit":null,"extra":[]},{"n":1,"name":"Calcio","sec":true,"dice":"1d3","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d3+For), Calcio (att.sec. -5TxC, 1d3+½For)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d4","str":1,"crit":null,"extra":["Sputo"]},{"n":2,"name":"Calci","sec":true,"dice":"1d4","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d4+For più Sputo), 2 Calci (att.sec. -5TxC, 1d4+½For)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":1,"crit":null,"extra":["Sputo"]},{"n":2,"name":"Calci","sec":true,"dice":"1d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"1,5 m","raw":"Morso (1d6+For più Sputo), 2 Calci (att.sec. -5TxC, 1d6+½For)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":1,"crit":null,"extra":["Sputo"]},{"n":2,"name":"Calci","sec":true,"dice":"1d8","str":0.5,"crit":null,"extra":[]}]],"spazio":"4,5 m","portata":"3 m","raw":"Morso (2d6+For più Sputo), 2 Calci (att.sec. -5TxC, 1d8+½For)","lv18":false}},"note":[],"capacita":[{"nome":"Sputo","tag":"dal Piccola","corpo":"Come azione standard (ricarica 1d4 round): attacco a distanza (attacco di contatto, gittata 6 m). La creatura colpita deve superare TS Tempra (CD 10+½DV+mod.Cos) o essere Nauseata per 1d3 round. Se fallisce di 5 o più, è anche Accecata per 1 round dal liquido negli occhi. Utilizzabile dal livello Media."},{"nome":"Adattamento al caldo","tag":null,"corpo":"Ignora i Danni Non Letali da ambienti caldi naturali (non magici). Ottiene +4 ai TS contro effetti del calore ambientale."},{"nome":"Resistenza alla sete","tag":null,"corpo":"La creatura non soffre penalità da disidratazione per un numero di giorni pari a 3× il punteggio di Costituzione. Quando si trova in ambienti acquatici, recupera questa riserva in un'ora."},{"nome":"Marcia nel deserto","tag":null,"corpo":"Sul terreno sabbioso o in climi aridi, la velocità del cammello non viene ridotta dal terreno difficile naturale. Può percorrere il doppio della distanza normale durante una marcia forzata prima di affaticarsi."}],"chiusura":"Resistenza alla sete e Marcia nel deserto tolgono di mezzo la logistica dei viaggi aridi, e Adattamento al caldo annulla i Danni Non Letali da ambiente. Lo Sputo resta un'apertura utile, ma non è il motivo per cui scegli questa forma.","canatExtra":0},{"nome":"Canguro","cat":"Terrestri","specie":["Canguro rosso","Canguro grigio","Wallaroo","Wallaby","Canguro gigante preistorico"],"intro":"Il canguro è un marsupiale saltatore con zampe posteriori potentissime. La sua tecnica di combattimento unica combina salti fulminei con calci devastanti e un boxing con le zampe anteriori. Nelle taglie maggiori diventa un avversario formidabile anche per i predatori più grandi. La femmina può ospitare un cucciolo nel marsupio.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"9 m, Saltare 3 m"},{"sizes":["Piccola"],"label":"Piccola","val":"12 m, Saltare 4,5 m"},{"sizes":["Media"],"label":"Media","val":"12 m, Saltare 6 m"},{"sizes":["Grande"],"label":"Grande","val":"15 m, Saltare 7,5 m"},{"sizes":["Enorme"],"label":"Enorme","val":"15 m, Saltare 9 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Visione crepuscolare"}],"bonus":"+8 Acrobazia (saltare), +4 Percezione","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Calcio","sec":false,"dice":"1d3","str":1.5,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Calcio (1d3+1½For)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Calcio","sec":false,"dice":"1d4","str":1.5,"crit":null,"extra":[]},{"n":2,"name":"Pugni","sec":true,"dice":"1d2","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Calcio (1d4+1½For), 2 Pugni (att.sec. -5TxC, 1d2+½For)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Calcio","sec":false,"dice":"1d6","str":1.5,"crit":null,"extra":[]},{"n":2,"name":"Pugni","sec":true,"dice":"1d4","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Calcio (1d6+1½For), 2 Pugni (att.sec. -5TxC, 1d4+½For)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Calcio","sec":false,"dice":"2d6","str":1.5,"crit":null,"extra":["Sbilanciare"]},{"n":2,"name":"Pugni","sec":true,"dice":"1d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"1,5 m","raw":"Calcio (2d6+1½For più Sbilanciare), 2 Pugni (att.sec. -5TxC, 1d6+½For)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Calcio","sec":false,"dice":"2d8","str":1.5,"crit":null,"extra":["Sbilanciare"]},{"n":2,"name":"Pugni","sec":true,"dice":"1d8","str":0.5,"crit":null,"extra":[]}]],"spazio":"4,5 m","portata":"3 m","raw":"Calcio (2d8+1½For più Sbilanciare), 2 Pugni (att.sec. -5TxC, 1d8+½For)","lv18":false}},"note":[],"capacita":[{"nome":"Calcio Devastante","tag":"dal Piccola","corpo":"Quando effettua una Carica terminando con un Calcio, i danni sono raddoppiati (dadi) e la Forza conta doppia: Piccola 2d4+2×For; Media 2d6+2×For; Grande 4d6+2×For; Enorme 4d8+2×For."},{"nome":"Saltatore Prodigioso","tag":"dal Piccola","corpo":"Il canguro salta senza dover effettuare prove di Acrobazia: copre automaticamente la sua intera distanza di Saltare, in orizzontale o in verticale. Non provoca attacchi di opportunità quando salta sopra i nemici. Può effettuare un Calcio come attacco a distanza saltando sopra o attraverso il bersaglio (gittata 6 m, senza incrementi). Il bonus razziale di Acrobazia resta valido per i salti eccezionali oltre la distanza di Saltare."},{"nome":"Pugile","tag":"dal Grande","corpo":"Per ogni round consecutivo in cui colpisce con entrambi i Pugni sullo stesso bersaglio, ottiene +1 ai TxC con i Pugni (massimo +4). Il bonus si azzera se manca un attacco o bersaglia qualcun altro."},{"nome":"Marsupio","tag":"ruolistico","corpo":"Solo femmina: può trasportare una creatura di taglia Minuscola nel marsupio senza penalità alla velocità. La creatura nel marsupio ha copertura totale ma non può agire."}],"chiusura":"Saltatore Prodigioso ti muove senza prove di Acrobazia e Calcio Devastante raddoppia dadi e Forza in Carica. Se invece resti sullo stesso bersaglio, Pugile accumula +1 al TxC per ogni round consecutivo con entrambi i Pugni a segno.","canatExtra":0},{"nome":"Rospo","cat":"Terrestri","specie":["Rospo comune","Rospo gigante","Rospo bufagino","Rospo corridore","Dendrobate (rana dardo)"],"intro":"Il rospo è un anfibio apparentemente innocuo che cela un'arma terrificante: il veleno cutaneo. Nella taglia Minuscola, il dendrobate o rospo freccia produce uno dei veleni più potenti del regno animale. Lento nei movimenti, il rospo compensa con difese chimiche straordinarie che rendono pericoloso anche avvicinarsi troppo. Il veleno agisce sia per iniezione che per contatto.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"6 m, Nuotare 6 m, Saltare 1,5 m"},{"sizes":["Piccola"],"label":"Piccola","val":"9 m, Nuotare 9 m, Saltare 3 m"},{"sizes":["Media"],"label":"Media","val":"9 m, Nuotare 9 m, Saltare 4,5 m"},{"sizes":["Grande"],"label":"Grande","val":"12 m, Nuotare 12 m, Saltare 6 m"},{"sizes":["Enorme"],"label":"Enorme","val":"12 m, Nuotare 12 m, Saltare 9 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Visione crepuscolare"}],"bonus":"+4 Furtività, +8 Percezione (udito)","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d2","str":0.5,"crit":null,"extra":["Veleno"]}]],"spazio":"0,75 m","portata":"0 m","raw":"Morso (1d2+½For più Veleno)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d4","str":0.5,"crit":null,"extra":["Veleno"]},{"n":1,"name":"Lingua","sec":true,"dice":null,"str":null,"crit":null,"extra":["Afferrare","gittata 1,5 m"]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d4+½For più Veleno), Lingua (att.sec. -5TxC, Afferrare, gittata 1,5 m)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":0.5,"crit":null,"extra":["Veleno"]},{"n":1,"name":"Lingua","sec":true,"dice":null,"str":null,"crit":null,"extra":["Afferrare","gittata 3 m"]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d6+½For più Veleno), Lingua (att.sec. -5TxC, Afferrare, gittata 3 m)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d8","str":0.5,"crit":null,"extra":["Veleno"]},{"n":1,"name":"Lingua","sec":true,"dice":null,"str":null,"crit":null,"extra":["Afferrare","gittata 3 m"]}]],"spazio":"3 m","portata":"1,5 m","raw":"Morso (1d8+½For più Veleno), Lingua (att.sec. -5TxC, Afferrare, gittata 3 m)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":0.5,"crit":null,"extra":["Veleno"]},{"n":1,"name":"Lingua","sec":true,"dice":null,"str":null,"crit":null,"extra":["Afferrare","gittata 4,5 m"]}]],"spazio":"4,5 m","portata":"3 m","raw":"Morso (2d6+½For più Veleno), Lingua (att.sec. -5TxC, Afferrare, gittata 4,5 m)","lv18":false}},"note":[],"capacita":[{"nome":"Salto Naturale","tag":null,"corpo":"Il rospo salta senza dover effettuare prove di Acrobazia, coprendo automaticamente la sua distanza di Saltare."},{"nome":"Veleno del Rospo [VELENO]","tag":null,"corpo":"Frequenza 1 round (max 6). Danno a Cos e Forza: Minuscola 1d3 Cos + 1d3 For; Piccola 1d4 Cos + 1d4 For; Media 1d6 Cos + 1d4 For; Grande 1d6 Cos + 1d6 For; Enorme 1d8 Cos + 1d8 For. Cura 2 TS consecutivi. CD 10+½DV+mod.Cos."},{"nome":"Pelle Tossica","tag":null,"corpo":"Qualsiasi creatura che tenti di Afferrare il rospo o lo colpisca a mani nude/attacco naturale deve superare TS Tempra (stessa CD del veleno) o essere Nauseata per 1d4 round e subire 1d4 punti di Cos da contatto (una sola volta per turno per attaccante)."},{"nome":"Salto Difensivo","tag":null,"corpo":"Come azione immediata quando bersagliato da un attacco in mischia, può saltare di 1,5 m in qualsiasi direzione libera senza provocare AoO. L'attaccante subisce penalità -4 al TxC se il TS Riflessi (CD 15) del rospo ha successo."},{"nome":"Canto d'allarme","tag":null,"corpo":"Una volta al giorno, il rospo può emettere un gracidio assordante in un raggio di 9 m. Le creature entro l'area che falliscono un TS Tempra (CD 10+½DV+mod.Cos) subiscono -2 a TxC, CA e prove per 1 round."},{"nome":"Secrezione Acida","tag":"dal Grande","corpo":"Le ghiandole cutanee producono una secrezione corrosiva. Qualsiasi oggetto non metallico a contatto per 1 round deve superare un TS Tempra (CD 12) o subire penalità funzionale permanente. Inoltre, qualsiasi creatura che colpisce il rospo in mischia con un attacco naturale, o che è In Lotta con lui, subisce automaticamente danni da acido (senza TS): 1d6 (Grande), 2d6 (Enorme), una sola volta per turno per attaccante."},{"nome":"Nube Tossica","tag":"dal Grande","corpo":"Come azione standard, 1 volta/minuto: il rospo rilascia una nuvola di vapori velenosi in una sfera di 3 m (Grande) o 4,5 m (Enorme). Le creature nell'area devono superare il TS del Veleno o essere esposte al veleno come da morso. Dura 1 round."}],"chiusura":"il veleno resta il motivo per cui la scegli, anche a taglia Minuscola: colpisce Costituzione e Forza insieme, e Pelle Tossica punisce chi ti afferra o ti colpisce a mani nude. Dal Grande, Nube Tossica aggiunge un'arma d'area.","canatExtra":0},{"nome":"Ratto","cat":"Terrestri","specie":["Ratto nero","Ratto norvegese","Ratto muschiato","Ratto gigante","Ratto delle fogne"],"intro":"Il ratto è un roditore opportunista e straordinariamente adattabile. Il suo morso trasmette malattie, e la sua capacità di passare attraverso aperture minuscole lo rende un esploratore unico. Nelle forme più grandi i denti incisivi diventano vere armi capaci di rodere persino il metallo. La loro intelligenza acuta permette al druido di sfruttarne le capacità di ricognizione in ambienti urbani e sotterranei, e di coordinare qualunque alleato nelle vicinanze.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"9 m, Scalare 6 m, Nuotare 6 m"},{"sizes":["Piccola"],"label":"Piccola","val":"12 m, Scalare 9 m, Nuotare 6 m"},{"sizes":["Media"],"label":"Media","val":"12 m, Scalare 6 m, Nuotare 9 m"},{"sizes":["Grande"],"label":"Grande","val":"15 m, Scalare 6 m, Nuotare 9 m"},{"sizes":["Enorme"],"label":"Enorme","val":"15 m, Scalare 6 m, Nuotare 9 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Vista Cieca 3 m (vibrisse)"},{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"}],"bonus":"+4 Furtività (+8 in ambienti urbani/sotterranei), +8 Acrobazia, +4 Percezione","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d2","str":1,"crit":null,"extra":["Malattia"]}]],"spazio":"0,75 m","portata":"0 m","raw":"Morso (1d2+For più Malattia)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d4","str":1,"crit":null,"extra":["Malattia"]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d4+For più Malattia)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":1,"crit":null,"extra":["Malattia"]},{"n":2,"name":"Artigli","sec":true,"dice":"1d3","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d6+For più Malattia), 2 Artigli (att.sec. -5TxC, 1d3+½For)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d8","str":1,"crit":null,"extra":["Malattia"]},{"n":2,"name":"Artigli","sec":true,"dice":"1d4","str":0.5,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"1,5 m","raw":"Morso (1d8+For più Malattia), 2 Artigli (att.sec. -5TxC, 1d4+½For)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":1,"crit":null,"extra":["Malattia"]},{"n":2,"name":"Artigli","sec":true,"dice":"1d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"4,5 m","portata":"3 m","raw":"Morso (2d6+For più Malattia), 2 Artigli (att.sec. -5TxC, 1d6+½For)","lv18":false}},"note":[],"capacita":[{"nome":"Morso infetto","tag":null,"corpo":"Frequenza: 1 giorno (max 3). Danno a Cos: Minuscola/Piccola 1d3; Media/Grande 1d4; Enorme 1d6. Cura 2 TS consecutivi. CD 10+½DV+mod.Cos. La malattia è la “Febbre del Ratto”: il bersaglio è anche Affaticato finché il danno di Cos persiste."},{"nome":"Scivolare","tag":null,"corpo":"Può muoversi attraverso gli spazi di creature di taglia superiore senza provocare AoO. Può passare attraverso aperture di 5 cm di diametro (Minuscola), 10 cm (Piccola) o 15 cm (Media) senza prove."},{"nome":"Furtività Urbana (fino a Piccola)","tag":null,"corpo":"In ambienti urbani, nei sotterranei o nelle fogne, il ratto ottiene un ulteriore +4 alla Furtività (già incluso nel bonus razziale come +8 totale) e non può essere rilevato dagli Istinti Animali di tipo non-roditore entro 1,5 m."},{"nome":"Squittio d'Allarme","tag":"dal Piccola","corpo":"Quando percepisce un pericolo, come azione gratuita emette un verso acuto udibile fino a 90 m: gli alleati entro 18 m che lo odono ottengono +2 all'Iniziativa e non possono essere colti di sorpresa durante il primo round dello scontro."},{"nome":"Denti Corrosivi","tag":"dal Media","corpo":"I denti incisivi del ratto gigante sono abbastanza potenti da rodere materiali duri. Come azione di round completo su un oggetto non sorvegliato, può ridurre la sua integrità strutturale di 2 punti. Può rodere corde, legno, metallo morbido in 1d4 round. In combattimento: ignora 2 punti di Riduzione del Danno."},{"nome":"Branco Frenetico","tag":"solo Enorme","corpo":"Quando vi sono 3 o più alleati entro 9 m, il ratto (alfa del branco) ottiene bonus morale +2 ai TxC e ai danni e non può essere Spaventato né In Preda al Panico."}],"chiusura":"a Minuscola è la ricognizione urbana per eccellenza: Furtività Urbana e Scivolare ti fanno passare dove nessuno ti cerca. Dal Media i Denti Corrosivi aprono sbarre e serrature; a Enorme, Branco Frenetico premia chi combatte circondato da alleati. ANIMALI VOLANTI Le forme volanti — Rapace e Pipistrello — sono le uniche del volume soggette alla Regola del Volo a Bassa Quota: altezza massima 3 m dal suolo e taglia massima Piccola fino al 17° livello. Dal 18° livello si ottiene il Volo Standard, con taglia fino a Media e nessun limite di altezza.","canatExtra":0},{"nome":"Rapace / Uccello da Preda","cat":"Volanti","specie":["Falco","Gufo","Aquila","Condor","Avvoltoio"],"intro":"I rapaci sono cacciatori aerei con vista eccezionale e artigli affilati. La regola del Volo a Bassa Quota si applica a tutte le forme volanti fino al 17° livello. Taglia massima consentita: Piccola (Media solo dal 18° livello con Volo Standard). Il Gufo aggiunge la Scurovisione; i rapaci diurni hanno Vista eccezionale.","vel":[{"sizes":["Minuscola"],"label":"Minuscola (Falchetto)","val":"1,5 m, Volare 18 m (buona)"},{"sizes":["Piccola"],"label":"Piccola (Falco/Gufo)","val":"1,5 m, Volare 24 m (media)"},{"sizes":["Media"],"label":"Media (Aquila/Condor — solo 18°+)","val":"3 m, Volare 30 m (buona)"}],"sensi":[{"sizes":null,"label":"Gufo","val":"Scurovisione 18 m, Visione crepuscolare"},{"sizes":null,"label":"Avvoltoio","val":"Fiuto, Visione crepuscolare"},{"sizes":null,"label":"Falco/Aquila/Condor","val":"Vista eccezionale (x8 rispetto ai normali)"}],"bonus":"+8 Percezione (vista), +4 Furtività, +4 Acrobazia (manovre in volo)","attacchi":{"Minuscola":{"alts":[[{"n":2,"name":"Artigli","sec":false,"dice":"1d2","str":1,"crit":null,"extra":[]},{"n":1,"name":"Morso","sec":true,"dice":"1d2","str":0.5,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"2 Artigli (1d2+For), Morso (att.sec. -5TxC, 1d2+½For)","lv18":false},"Piccola":{"alts":[[{"n":2,"name":"Artigli","sec":false,"dice":"1d4","str":1,"crit":null,"extra":["Afferrare"]},{"n":1,"name":"Morso","sec":true,"dice":"1d4","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"0 m","raw":"2 Artigli (1d4+For più Afferrare), Morso (att.sec. -5TxC, 1d4+½For)","lv18":false},"Media":{"alts":[[{"n":2,"name":"Artigli","sec":false,"dice":"1d6","str":1,"crit":null,"extra":["Afferrare"]},{"n":1,"name":"Morso","sec":true,"dice":"1d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"2 Artigli (1d6+For più Afferrare), Morso (att.sec. -5TxC, 1d6+½For)","lv18":true}},"note":["* Forma Media disponibile solo dal 18° livello."],"capacita":[{"nome":"Regola Volo a Bassa Quota","tag":null,"corpo":"Fino al 17° livello, la creatura può volare a un'altezza massima di 3 m dal suolo. Non può trasportare passeggeri né pesi superiori al carico leggero. Dal 18° livello: Volo Standard (nessun limite di altezza, carico normale)."},{"nome":"Artigli da Caccia","tag":"dal Piccola","corpo":"Se vola e scende in picchiata su un bersaglio (almeno 6 m di discesa in linea retta prima dell'attacco), infligge il doppio dei danni con gli artigli."},{"nome":"Vista d'Aquila","tag":"solo Media — 18°+","corpo":"La creatura non soffre penalità ai TxC a distanza per la distanza, e aggiunge +2 ai TxC a distanza."}],"chiusura":"vive sulla picchiata: con almeno 6 m di discesa in linea retta gli Artigli da Caccia raddoppiano il danno, quindi guadagna quota prima di ogni ingaggio. Fino al 17° livello resti Piccola e a 3 m dal suolo: sfrutta il +8 Percezione (vista) per fare l'osservatore, non la linea d'attacco.","canatExtra":0},{"nome":"Pipistrello","cat":"Volanti","specie":["Pipistrello","Volpe volante","Pipistrello gigante","Pipistrello colossale"],"intro":"Il pipistrello usa l'ecolocazione per muoversi nel buio assoluto. Eccellente per scouting notturno e spazi chiusi. La forma Media (pipistrello colossale o volpe volante gigante) è accessibile solo dal 18° livello come il rapace.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"1,5 m, Volare 12 m (buona)"},{"sizes":["Piccola"],"label":"Piccola","val":"1,5 m, Volare 18 m (media)"},{"sizes":["Media"],"label":"Media (solo 18°+)","val":"3 m, Volare 24 m (media)"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Ecolocazione (Vista Cieca 18 m), Visione crepuscolare"}],"bonus":"+8 Percezione (udito), +4 Furtività","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d2","str":0,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Morso (1d2)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d4","str":1,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"0 m","raw":"Morso (1d4+For)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":1,"crit":null,"extra":[]},{"n":2,"name":"Artigli","sec":true,"dice":"1d4","str":0.5,"crit":null,"extra":["Afferrare"]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d6+For), 2 Artigli (att.sec. -5TxC, 1d4+½For più Afferrare)","lv18":true}},"note":["* Forma Media disponibile solo dal 18° livello."],"capacita":[{"nome":"Regola Volo a Bassa Quota","tag":null,"corpo":"Come per tutti i volanti: altezza massima 3 m fino al 17° livello. Dal 18° livello: Volo Standard."},{"nome":"Vista Cieca da Ecolocazione","tag":null,"corpo":"Utilizza l'udito per “vedere” come Vista Cieca 18 m. Non influenzata da oscurità, invisibilità o occultamento. Inefficace in zone di Silenzio o se la creatura è Assordata."},{"nome":"Strillo sonico","tag":"dal Piccola","corpo":"Una volta al round come azione gratuita, può emettere un grido acuto. Ogni creatura entro 6 m con DV ≤ propri DV deve superare TS Tempra (CD 10+½DV+mod.Cos) o subire -2 a TxC, CA e prove per 1 round."},{"nome":"Strillo Devastante","tag":"solo Media — 18°+","corpo":"Come azione standard, 1 volta/minuto: emette uno strillo sonico di potenza superiore in un cono da 6 m. Le creature nel cono subiscono 2d6 danni sonici e devono superare TS Tempra (CD 10+½DV+mod.Cos) o essere Stordite per 1 round."}],"chiusura":"la Vista Cieca da Ecolocazione a 18 m ignora oscurità, invisibilità e occultamento: è la forma da mandare avanti dove la vista non serve. Dal Piccola lo Strillo sonico lavora ogni round come azione gratuita sui nemici con pochi DV, ma ricorda che l'ecolocazione si spegne nelle zone di Silenzio. ANIMALI ACQUATICI Gli animali acquatici — Cetacei, Squali, Cefalopodi, Razze, Anguille, Cavallucci — vivono sott'acqua e ottengono, grazie alla velocità di Nuotare, +8 automatico alle prove di Nuotare. Le forme non mammifere (pesci, cefalopodi) respirano solo in acqua: se estratte, iniziano ad annegare immediatamente e muoiono per soffocamento. Le forme anfibie/mammifere (Cetacei) possono restare fuori dall'acqua per un numero di round pari a Cos×4 prima di rischiare l'annegamento.","canatExtra":0},{"nome":"Cetaceo","cat":"Acquatici","specie":["Delfino","Tursiope","Orca","Balena grigia","Capodoglio","Balena"],"intro":"I cetacei sono mammiferi marini con ecolocazione, trattenimento del fiato straordinario e velocità eccezionale in acqua. Le forme più grandi acquisiscono Vista Cieca di maggior raggio e la capacità di Capovolgere imbarcazioni.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"Nuotare 9 m; può inoltre muoversi, a velocità ridotta, sulla terraferma per brevi tratti"},{"sizes":["Piccola"],"label":"Piccola","val":"Nuotare 12 m; può inoltre muoversi, a velocità ridotta, sulla terraferma per brevi tratti"},{"sizes":["Media"],"label":"Media","val":"Nuotare 15 m"},{"sizes":["Grande"],"label":"Grande","val":"Nuotare 18 m"},{"sizes":["Enorme"],"label":"Enorme","val":"Nuotare 21 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media"],"label":"Minuscola–Media","val":"Ecolocazione (Percezione cieca 30 m), Visione crepuscolare"},{"sizes":["Grande"],"label":"Grande","val":"Ecolocazione (Percezione cieca 45 m), Visione crepuscolare"},{"sizes":["Enorme"],"label":"Enorme","val":"Vista Cieca 36 m, Visione crepuscolare"}],"bonus":"+4 Percezione, +8 Nuotare","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d3","str":1,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0,75 m","raw":"Morso (1d3+For)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d4","str":1.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d4+1½For)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":1.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d6+1½For)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":1.5,"crit":null,"extra":["Afferrare"]},{"n":1,"name":"Colpo di coda","sec":true,"dice":"2d8","str":0.5,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"1,5 m","raw":"Morso (2d6+1½For più Afferrare), Colpo di coda (att.sec. -5TxC, 2d8+½For)","lv18":false},"E otato di file di denti continue che si rinnovano continuamente, permettendo attacchi devastanti su prede afferrate.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"Nuotare 9 m"},{"sizes":["Piccola"],"label":"Piccola","val":"Nuotare 12 m"},{"sizes":["Media"],"label":"Media","val":"Nuotare 15 m"},{"sizes":["Grande"],"label":"Grande","val":"Nuotare 18 m"},{"sizes":["Enorme"],"label":"Enorme","val":"Nuotare 21 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"},{"sizes":["Grande","Enorme"],"label":"Grande–Enorme","val":"Percezione cieca 9 m (vibrazioni in acqua), Olfatto acuto (rileva sangue a 1,6 km)"}],"bonus":"+8 Nuotare, +4 Percezione","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d3","str":1.5,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0,75 m","raw":"Morso (1d3+1½For)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d4","str":1.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d4+1½For)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d8","str":1.5,"crit":null,"extra":["Afferrare"]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d8+1½For più Afferrare)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":1.5,"crit":null,"extra":["Afferrare","Sanguinamento 1d6"]}]],"spazio":"3 m","portata":"1,5 m","raw":"Morso (2d6+1½For più Afferrare, Sanguinamento 1d6)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"3d8","str":1.5,"crit":null,"extra":["Afferrare","Sanguinamento 2d6"]}]],"spazio":"4,5 m","portata":"3 m","raw":"Morso (3d8+1½For più Afferrare, Sanguinamento 2d6)","lv18":false}},"note":[],"capacita":[{"nome":"File di denti","tag":"dal Media","corpo":"Se inizia il round con un nemico afferrato, infligge automaticamente i danni del morso. Può anche sferrare un secondo morso ridotto (Media: 1d6+For; Grande: 1d10+For; Enorme: 2d8+For) contro un nemico già afferrato."},{"nome":"Olfatto acuto","tag":"dal Grande","corpo":"Rileva il sangue fino a 1,6 km di distanza sott'acqua. Non può essere sorpreso da creature ferite entro 18 m."},{"nome":"Frenesia da Sangue","tag":"solo Enorme","corpo":"Quando infligge Sanguinamento a una creatura, ottiene bonus morale +2 ai TxC e ai danni per 1 round."}],"chiusura":"forma da inseguimento: dal Grande l'Olfatto acuto rileva il sangue a 1,6 km e ti rende impossibile da cogliere di sorpresa da creature ferite entro 18 m. In mischia aggancia e lascia che File di denti infligga il morso in automatico ogni round; a Enorme la Frenesia da Sangue premia chi ha già aperto la ferita.","canatExtra":0},{"nome":"Cefalopode","cat":"Acquatici","specie":["Polpo","Piovra","Calamaro","Nautilo","Calamaro Gigante"],"intro":"I cefalopodi sono creature altamente intelligenti con tentacoli prensili che costituiscono la loro arma primaria, abilità mimetiche straordinarie e una Nube di Inchiostro difensiva. La Propulsione permette loro di sfuggire rapidamente ai predatori, mentre il morso inietta un veleno debilitante.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"Nuotare 6 m, Propulsione 30 m"},{"sizes":["Piccola"],"label":"Piccola","val":"Nuotare 6 m, Propulsione 45 m"},{"sizes":["Media"],"label":"Media","val":"Nuotare 9 m, Propulsione 60 m"},{"sizes":["Grande"],"label":"Grande","val":"Nuotare 18 m, Propulsione 78 m"},{"sizes":["Enorme"],"label":"Enorme","val":"Nuotare 18 m, Propulsione 90 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Visione crepuscolare"}],"bonus":"+10 Artista della fuga, +8 Furtività, +8 Nuotare","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Tentacoli","sec":false,"dice":"1d3","str":1,"crit":null,"extra":[]},{"n":1,"name":"Morso","sec":true,"dice":"1d3","str":0.5,"crit":null,"extra":["Veleno"]}]],"spazio":"0,75 m","portata":"0 m","raw":"Tentacoli ( do +20 alla Furtività finché rimane fermo. Il bonus si dimezza se si muove. Disponibile a tutte le taglie."},{"nome":"Nube di Inchiostro","tag":null,"corpo":"1 volta/minuto come azione gratuita: emette una sfera di inchiostro (Minuscola: 1,5 m raggio; Piccola-Media: 3 m; Grande-Enorme: 6 m) che concede Occultamento Totale in acqua per 1 minuto."},{"nome":"Propulsione","tag":null,"corpo":"1 volta/round come azione di round completo: schizza indietro in linea retta alla velocità indicata senza provocare attacchi di opportunità."}],"chiusura":"è la forma più versatile fuori dal combattimento: +10 Artista della fuga, Mimetismo cromatico da +20 alla Furtività e Nube di Inchiostro per rompere il contatto. Se devi combattere, aggancia con i Tentacoli e lavora di Stritolare, tenendo Propulsione come via d'uscita.","canatExtra":0},{"nome":"Pastinaca","cat":"Acquatici","specie":["Pastinaca","Razza","Razza gigante"],"intro":"La pastinaca è un pesce piatto che si mimetizza sul fondale, colpendo con un aculeo caudale carico di un veleno lancinante chiunque la disturbi o le si avvicini troppo. Eccellente per muoversi inosservata sul fondale.","vel":[{"sizes":["Minuscola","Piccola"],"label":"Minuscola–Piccola","val":"Nuotare 9 m"},{"sizes":["Media"],"label":"Media","val":"Nuotare 12 m"},{"sizes":["Grande","Enorme"],"label":"Grande–Enorme","val":"Nuotare 15 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Percezione cieca 9 m, Visione crepuscolare"}],"bonus":"+8 Furtività (sul fondale), +8 Nuotare","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Aculeo","sec":false,"dice":"1d2","str":1,"crit":null,"extra":["Veleno"]}]],"spazio":"0,75 m","portata":"0 m","raw":"Aculeo (1d2+For più Veleno)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Aculeo","sec":false,"dice":"1d4","str":1,"crit":null,"extra":["Veleno"]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Aculeo (1d4+For più Veleno)","lv18":false},"Media":{"alts":[[{"n":1,"name": +8 Nuotare","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Colpo","sec":false,"dice":"1d2","str":1,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Colpo (1d2+For)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Colpo","sec":false,"dice":"1d3","str":1,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Colpo (1d3+For)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Colpo","sec":false,"dice":"1d4","str":1,"crit":null,"extra":[]}],[{"n":1,"name":"Scarica","sec":false,"dice":null,"str":null,"crit":null,"extra":["vedi capacità"]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Colpo (1d4+For) o Scarica","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Colpo","sec":false,"dice":"1d6","str":1,"crit":null,"extra":[]}],[{"n":1,"name":"Scarica","sec":false,"dice":null,"str":null,"crit":null,"extra":["vedi capacità"]}]],"spazio":"3 m","portata":"1,5 m","raw":"Colpo (1d6+For) o Scarica","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Colpo","sec":false,"dice":"1d8","str":1,"crit":null,"extra":[]}],[{"n":1,"name":"Scarica","sec":false,"dice":null,"str":null,"crit":null,"extra":["vedi capacità"]}]],"spazio":"4,5 m","portata":"3 m","raw":"Colpo (1d8+For) o Scarica","lv18":false}},"note":[],"capacita":[{"nome":"Scarica Elettrica","tag":"dal Media","corpo":"Una volta ogni 1d4 round come azione standard: cono di 3 m (Media), 6 m (Grande) o 9 m (Enorme). Danno: 2d6 (Media), 4d6 (Grande) o 6d6 (Enorme) elettricità. Un Tiro Salvezza su Riflessi (CD 10+½DV+mod.Cos) dimezza; su TS fallito il bersaglio è anche Barcollante per 1 round."},{"nome":"Campo Elettrico","tag":null,"corpo":"Chi colpisce la razza in mischia con un attacco naturale, o è In Lotta con lei, subisce automaticamente danni elettrici: 1d6 (Media), 2d6 (Grande) o 3d6 (Enorme), una volta per turno per attaccante."},{"nome":"Sovraccarico","tag":"solo Enorme","corpo":"Una volta al giorno, come azione standard: scarica devastante in sfera di 6 m, 8d6 danni da elettricità. Un Tiro Salvezza su Riflessi dimezza; chi fallisce è anche Stordito per 1 round."}],"chiusura":"controllo d'area a corto raggio: la Scarica Elettrica batte in cono ogni 1d4 round e il Campo Elettrico punisce da solo chi ti colpisce con un attacco naturale o entra In Lotta con te. A Enorme conserva Sovraccarico per quando i nemici si concentrano.","canatExtra":0},{"nome":"Anguilla Elettrica","cat":"Acquatici","specie":["Anguilla elettrica amazzonica","Anguilla elettrica nana","Anguilla elettrica gigante"],"intro":"L'anguilla elettrica è un pesce allungato capace di generare scariche elettriche potentissime attraverso organi specializzati lungo tutto il corpo. Non è una vera anguilla ma un parente dei pesci coltello. Può generare scariche di orientamento a bassa intensità o scariche d'attacco letali, scagliate in cono, sfruttate a contatto in mischia, oppure abbinate al morso. Nelle taglie maggiori la scarica può stordire o uccidere creature di grossa taglia.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"Nuotare 9 m"},{"sizes":["Piccola"],"label":"Piccola","val":"Nuotare 12 m"},{"sizes":["Media"],"label":"Media","val":"Nuotare 15 m"},{"sizes":["Grande"],"label":"Grande","val":"Nuotare 15 m"},{"sizes":["Enorme"],"label":"Enorme","val":"Nuotare 18 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Vista Cieca 9 m (campo elettrico), Visione crepuscolare"}],"bonus":"+8 Nuotare, +4 Percezione (senso elettrico), +4 Furtività","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d3","str":1,"crit":null,"extra":[]},{"n":1,"name":"Scarica","sec":false,"dice":null,"str":null,"crit":null,"extra":["tocco","1d4 elettricità"]}]],"spazio":"0,75 m","portata":"0,75 m","raw":"Morso (1d3+For), Scarica (tocco, 1d4 elettricità)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d4","str":1,"crit":null,"extra":[]},{"n":1,"name":"Scarica","sec":false,"dice":null,"str":null,"crit":null,"extra":["tocco","1d6 elettricità"]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d4+For), Scarica (tocco, 1d6 elettricità)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d8","str":1,"crit":null,"extra":["Afferrare"]},{"n":1,"name":"Scarica","sec":false,"dice":null,"str":null,"crit":null,"extra":["cono 3 m","1d8 elettricità"]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d8+For più Afferrare), Scarica (cono 3 m, 1d8 elettricità)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":1,"crit":null,"extra":["Afferrare"]},{"n":1,"name":"Scarica","sec":false,"dice":null,"str":null,"crit":null,"extra":["cono 6 m","3d8 elettricità"]}]],"spazio":"3 m","portata":"1,5 m","raw":"Morso (2d6+For più Afferrare), Scarica (cono 6 m, 3d8 elettricità)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"3d6","str":1,"crit":null,"extra":["Afferrare"]},{"n":1,"name":"Scarica","sec":false,"dice":null,"str":null,"crit":null,"extra":["cono 9 m","6d8 elettricità"]}]],"spazio":"4,5 m","portata":"3 m","raw":"Morso (3d6+For più Afferrare), Scarica (cono 9 m, 6d8 elettricità)","lv18":false}},"note":[],"capacita":[{"nome":"Organo Elettrico","tag":null,"corpo":"Una volta per round, l'anguilla può scaricare i suoi organi elettrici in uno di questi modi: Cono, come indicato in tabella (attacco standard); Contatto in mischia, un attacco di contatto in corpo a corpo che infligge metà del danno della Scarica (arrotondato per difetto); Abbinata al Morso, se il Morso va a segno, aggiunge metà del danno della Scarica come danni elettrici extra. Inoltre, quando viene Afferrata o colpita da un attacco naturale, scarica automaticamente sull'attaccante senza consumare l'uso del round. In tutti i casi un Tiro Salvezza su Riflessi (CD 10+½DV+mod.Cos) dimezza; le creature in acqua subiscono +50% danni. Solo la Scarica in cono attiva lo Stordimento Elettrico e la Paralisi elettrica: le modalità a contatto e abbinata al Morso infliggono solo danni."},{"nome":"Stordimento Elettrico","tag":"dal Media","corpo":"Se la Scarica in cono infligge danni a una creatura, questa deve superare un TS Tempra (stessa CD) o essere Stordita per 1 round."},{"nome":"Senso Elettrico","tag":null,"corpo":"La Vista Cieca da campo elettrico (9 m) non è influenzata da oscurità, invisibilità o occultamento. Rileva automaticamente creature metalliche e creature in armatura entro 18 m. Non funziona fuori dall'acqua."},{"nome":"Paralisi elettrica","tag":"solo Enorme","corpo":"Con un critico confermato dalla Scarica in cono, la creatura colpita deve superare TS Tempra (CD +4) o essere Paralizzata per 1 round. Non applicabile ai golem o creature senza sistema nervoso."}],"chiusura":"l'Organo Elettrico ti dà una scarica ogni round e dal Media chi la subisce rischia di restare Stordito: è il miglior controllo sott'acqua del volume. Il Senso Elettrico individua anche ciò che è Invisibile; a Enorme un critico in cono può lasciare il bersaglio Paralizzato.","canatExtra":0},{"nome":"Cavalluccio Marino","cat":"Acquatici","specie":["Cavalluccio comune","Cavalluccio nano","Cavalluccio gigante","Drago foglia","Drago marino"],"intro":"Il cavalluccio marino è un pesce unico al mondo: il maschio porta le uova nel proprio marsupio. Lentissimo nuotatore, compensa con un mimetismo straordinario e una coda prensile che lo ancora alle correnti. Il drago foglia ne è la variante più mimetica. Nelle taglie maggiori si trasforma in un predatore marino sorprendente con spine velenose potenti e impulsi sonici.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"Nuotare 3 m"},{"sizes":["Piccola"],"label":"Piccola","val":"Nuotare 6 m"},{"sizes":["Media"],"label":"Media","val":"Nuotare 9 m"},{"sizes":["Grande"],"label":"Grande","val":"Nuotare 12 m"},{"sizes":["Enorme"],"label":"Enorme","val":"Nuotare 15 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Visione crepuscolare"}],"bonus":
