qua e non viene trascinato dalle correnti. Come attacco, può tentare Afferrare con la coda (CD Lottare normale)."},{"nome":"Veleno dell'aculeo","tag":"dal Piccola","corpo":"Freq. 1 round (max 4). Danno a Des: Piccola 1d2; Media 1d3; Grande 1d4; Enorme 1d6. Cura 1 TS (Piccola-Media) o 2 TS (Grande-Enorme). CD 10+½DV+mod.Cos. Le spine dorsali trasmettono il veleno al tocco."},{"nome":"Impulso Sonico","tag":"dal Media","corpo":"Come azione standard, 1 volta ogni 1d4 round: emette un impulso sonico (sfera 3 m Media, 6 m Grande, 9 m Enorme). Le creature nella sfera devono superare TS Tempra (CD 10+½DV+mod.Cos) o essere Confuse per 1 round. Inefficace fuori dall'acqua."},{"nome":"Aura Elettrica","tag":"solo Enorme","corpo":"Il drago marino enorme genera un campo elettrico difensivo. Qualsiasi creatura che lo tocchi o lo colpisca con un attacco naturale subisce automaticamente 2d6 danni da elettricità senza TS."}],"chiusura":"forma d'elezione per l'infiltrazione: Mimetismo Straordinario vale +20 alla Furtività e la Coda Prensile ti ancora senza prove, immune allo Sbilanciare e alle correnti. Dal Media l'Impulso Sonico aggiunge un'opzione di controllo; a Enorme l'Aura Elettrica difende chi ti tocca. DINOSAURI E RETTILI PREISTORICI I dinosauri sono creature preistoriche di straordinaria potenza — Rapaci Bipedi, Ceratopsidi, Corazzati a Coda, Sauropodi, Preistorici Speciali. Le forme di taglia Minuscola e Piccola rappresentano cuccioli o specie più gracili (Compsognathus, piccoli rapaci). Le forme Enormi rappresentano le specie più iconiche. Accedere alle forme di dinosauro potrebbe richiedere l'approvazione del GM in base all'ambientazione della campagna.","canatExtra":0},{"nome":"Rapace Bipede","cat":"Dinosauri","specie":["Compsognathus","Velociraptor","Deinonychus","Utahraptor","Allosauro","Tirannosauro"],"intro":"I rapaci bipedi sono i predatori più agili tra i dinosauri. Le forme piccole (Compsognathus, Velociraptor) usano artigli e balzi veloci; le forme enormi (Allosauro, T-Rex) hanno un morso devastante, un ruggito capace di terrorizzare intere schiere di nemici, e sono in grado di inghiottire le prede più piccole.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"12 m"},{"sizes":["Piccola"],"label":"Piccola","val":"12 m"},{"sizes":["Media"],"label":"Media","val":"15 m"},{"sizes":["Grande"],"label":"Grande","val":"15 m"},{"sizes":["Enorme"],"label":"Enorme","val":"18 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"}],"bonus":"+8 Percezione","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d3","str":1,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Morso (1d3+For)","lv18":false},"Piccola":{"alts":[[{"n":2,"name":"Artigli","sec":false,"dice":"1d4","str":1,"crit":null,"extra":["Afferrare"]},{"n":1,"name":"Morso","sec":true,"dice":"1d4","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"2 Artigli (1d4+For più Afferrare), Morso (att.sec. -5TxC, 1d4+½For)","lv18":false},"Media":{"alts":[[{"n":2,"name":"Artigli","sec":false,"dice":"1d6","str":1,"crit":null,"extra":["Afferrare"]},{"n":1,"name":"Morso","sec":true,"dice":"1d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"2 Artigli (1d6+For più Afferrare), Morso (att.sec. -5TxC, 1d6+½For)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":1,"crit":"19-20","extra":["Afferrare"]},{"n":2,"name":"Artigli","sec":true,"dice":"1d8","str":0.5,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"3 m","raw":"Morso (2d6+For/19-20 più Afferrare), 2 Artigli (att.sec. -5TxC, 1d8+½For)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"3d8","str":1.5,"crit":"19-20","extra":["Afferrare"]},{"n":2,"name":"Artigli","sec":true,"dice":"2d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"4,5 m","portata":"4,5 m","raw":"Morso (3d8+1½For/19-20 più Afferrare), 2 Artigli (att.sec. -5TxC, 2d6+½For)","lv18":false}},"note":[],"capacita":[{"nome":"Ruggito [dal Grande] [PAURA]","tag":null,"corpo":"Una volta al giorno, come azione standard, un ruggito assordante. Tutte le creature entro 18 m che lo odono devono superare un TS su Volontà (CD 10+½DV+mod.Car) o essere Scosse per 1 minuto. Chi fallisce il TS di 4 o più è invece In Preda al Panico per 1d4 round."},{"nome":"Sventramento (Speroni)","tag":"dal Media","corpo":"Se colpisce lo stesso bersaglio con entrambi gli Artigli nello stesso round, affonda gli speroni falcati infliggendo danni extra pari a (dado Artiglio)+1½For e provocando [SANGUINAMENTO]: 1d6 (Media/Grande) o 2d6 (Enorme) all'inizio di ogni turno del bersaglio finché non riceve cure magiche o una prova di Guarire (CD 15)."},{"nome":"Balzare","tag":"dal Media","corpo":"Quando compie una Carica, può effettuare un attacco completo (Morso + Artigli); se entrambi gli Artigli colpiscono, si applica anche lo Sventramento."},{"nome":"Inghiottire","tag":"solo Enorme","corpo":"Se inizia il turno con un avversario di taglia Grande o inferiore Afferrato in bocca, può tentare una nuova prova di lotta (BMC) per inghiottirlo. La preda inghiottita è considerata In Lotta e Accecata, subisce 3d8+For danni contundenti per round e può agire solo con armi leggere o attacchi naturali. Per tagliarsi un varco deve colpire con un'arma tagliente o perforante l'interno della creatura, che ha CA 16 (10 + CA Naturale della forma Enorme), infliggendo PF pari a 1/10 dei PF massimi del druido (arrotondati per eccesso), poiché in Forma Selvatica è il druido a fornire i propri PF. Aperto il varco la preda esce; la forma non può inghiottire di nuovo finché la ferita non è rimarginata."}],"chiusura":"il predatore più completo del volume: Balzare dà l'attacco completo in Carica e, se entrambi gli Artigli vanno a segno, Sventramento aggiunge il danno degli speroni nello stesso round. Dal Grande apri con il Ruggito per gli effetti di [PAURA]; a Enorme, Inghiottire chiude lo scontro su un singolo bersaglio.","canatExtra":0},{"nome":"Ceratopside","cat":"Dinosauri","specie":["Protoceratope","Triceratope cucciolo","Stiracosauro","Triceratope","Torosaurus"],"intro":"I ceratopsidi sono dinosauri corazzati con corna frontali possenti. La loro carica è catastrofica per qualsiasi nemico che si frapponga. Nelle taglie maggiori possono Travolgere con il peso del corpo, e sanno anche stringersi in formazione difensiva a fianco dei propri alleati.","vel":[{"sizes":["Minuscola","Piccola","Media"],"label":"Minuscola–Media","val":"9 m"},{"sizes":["Grande"],"label":"Grande","val":"12 m"},{"sizes":["Enorme"],"label":"Enorme","val":"12 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"}],"bonus":"+4 Percezione","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Corno o Colpo di testa","sec":false,"dice":"1d4","str":1.5,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Corno o Colpo di testa (1d4+1½For)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Corno o Colpo di testa","sec":false,"dice":"1d8","str":1.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Corno o Colpo di testa (1d8+1½For)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Corno o Colpo di testa","sec":false,"dice":"1d10","str":1.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Corno o Colpo di testa (1d10+1½For)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Corno o Colpo di testa","sec":false,"dice":"3d6","str":1.5,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"1,5 m","raw":"Corno o Colpo di testa (3d6+1½For)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Corno o Colpo di testa","sec":false,"dice":"4d8","str":1.5,"crit":null,"extra":[]}]],"spazio":"4,5 m","portata":"3 m","raw":"Corno o Colpo di testa (4d8+1½For)","lv18":false}},"note":[],"capacita":[{"nome":"Carica Possente","tag":null,"corpo":"Quando effettua una Carica con il Corno, i danni sono raddoppiati (dadi) e la Forza conta doppia: Piccola 2d8+2×For, Media 2d10+2×For, Grande 6d6+2×For, Enorme 8d8+2×For."},{"nome":"Incornata","tag":"dal Grande","corpo":"Quando la Carica Possente col Corno va a segno, il bersaglio deve superare un TS Riflessi (CD 10+½DV+mod.For) o subire [SANGUINAMENTO] (Grande 1d6 / Enorme 2d6, finché curato) ed essere reso Prono se di taglia inferiore."},{"nome":"Travolgere","tag":"dal Grande","corpo":"Come azione di round completo, Oltrepassa creature di almeno una taglia inferiore. Danni: Grande 3d6+2For, Enorme 4d8+2For. CD 10+½DV+mod.For."},{"nome":"Corazza cranica","tag":"dal Media","corpo":"La testa del ceratopside è protetta da un'ampia corazza ossea. Ottiene +2 aggiuntivo alla CA contro gli attacchi frontali e non può essere sbilanciato da attacchi frontali."},{"nome":"Muro di Corna","tag":"dal Media","corpo":"Quando è adiacente a un alleato, entrambi ottengono +2 alla CA contro gli attacchi frontali. Inoltre, la sua mole fornisce copertura agli alleati direttamente dietro di lui."}],"chiusura":"combatti in linea, non da solo: Muro di Corna dà +2 alla CA a te e all'alleato adiacente e fornisce copertura, mentre Corazza cranica ti protegge frontalmente. L'apertura resta Carica Possente, che dal Grande innesca Incornata e l'effetto di [SANGUINAMENTO].","canatExtra":0},{"nome":"Tiranosauride corazzato a coda","cat":"Dinosauri","specie":["Ankylosauride","Nodosauro","Stegosauro","Anchilosauro","Diplodoco"],"intro":"Questi dinosauri usano la coda come arma principale: la clava ossea dell'anchilosauro può stordire le prede, mentre la coda a frusta del diplodoco ha una portata devastante. Sono creature lente ma con difese naturali eccezionali, capaci di rannicchiarsi in una posizione quasi impenetrabile o di spazzare con la coda tutti gli avversari a portata.","vel":[{"sizes":["Minuscola","Piccola","Media"],"label":"Minuscola–Media","val":"9 m"},{"sizes":["Grande"],"label":"Grande","val":"12 m"},{"sizes":["Enorme"],"label":"Enorme","val":"15 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"}],"bonus":"+4 Percezione","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Colpo di coda","sec":false,"dice":"1d4","str":1.5,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Colpo di coda (1d4+1½For)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Colpo di coda","sec":false,"dice":"1d8","str":1.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"3 m","raw":"Colpo di coda (1d8+1½For)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Colpo di coda","sec":false,"dice":"1d10","str":1.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"3 m","raw":"Colpo di coda (1d10+1½For)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Colpo di coda","sec":false,"dice":"3d6","str":1.5,"crit":null,"extra":["Stordimento"]}]],"spazio":"3 m","portata":"1,5+3 m","raw":"Colpo di coda (3d6+1½For più Stordimento)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Colpo di coda","sec":false,"dice":"4d8","str":1.5,"crit":"19-20x2","extra":["Stordimento"]}]],"spazio":"4,5 m","portata":"3+3 m","raw":"Colpo di coda (4d8+1½For più Stordimento, 19-20x2)","lv18":false}},"note":[],"capacita":[{"nome":"Stordimento","tag":"dal Grande","corpo":"Una creatura colpita deve superare TS Tempra (CD 10+½DV+mod.For) o essere stordita per 1 round. Se il colpo è critico e il TS è fallito: stordita per 1d4 round."},{"nome":"Corazza ossea","tag":null,"corpo":"Ottiene +1 aggiuntivo alla CA Naturale rispetto alla tabella standard. Inoltre, ottiene RD 5/— (Grande) o RD 10/— (Enorme)."},{"nome":"Difesa Rannicchiata","tag":"dal Media","corpo":"Come azione standard può rannicchiarsi esponendo solo la corazza: fino all'inizio del suo prossimo turno ottiene +4 alla CA e RD +5, ma non può muoversi. Può comunque colpire con la Coda come attacco di opportunità chi lo attacca in mischia."},{"nome":"Coda Spazzante","tag":"dal Grande","corpo":"Come azione standard, spazza la coda colpendo tutte le creature entro la sua portata: un attacco di Colpo di coda contro ciascuna (danni normali; lo Stordimento si applica normalmente a ognuna)."},{"nome":"Coda a portata estesa","tag":"dal Piccola","corpo":"La portata della coda è 3 m (Piccola-Media) o 4,5 m (Grande) o 6 m (Enorme), superiore alla norma per la taglia."}],"chiusura":"forma da tenuta: Corazza ossea vale RD 5/— al Grande e RD 10/— a Enorme, e Difesa Rannicchiata compra un round di +4 alla CA quando serve. In attacco sfrutta la portata estesa della coda e, dal Grande, Coda Spazzante per colpire tutti quelli che hai intorno lasciandoli Storditi.","canatExtra":1},{"nome":"Sauropode","cat":"Dinosauri","specie":["Brachiosaurus cucciolo","Diplodoco","Brachiosaurus","Titanosauro"],"intro":"I sauropodi sono i più grandi animali mai esistiti. Anche nelle forme ridotte la loro presenza è imponente. Il Travolgere è praticamente impossibile da evitare nelle taglie grandi, così come il calpestio delle zampe colossali. Dall'alto della loro statura dominano il campo di battaglia con lo sguardo.","vel":[{"sizes":["Minuscola","Piccola","Media"],"label":"Minuscola–Media","val":"9 m"},{"sizes":["Grande"],"label":"Grande","val":"12 m"},{"sizes":["Enorme"],"label":"Enorme","val":"15 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"}],"bonus":"+4 Percezione","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Schianto","sec":false,"dice":"1d3","str":1.5,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Schianto (1d3+1½For)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Schianto","sec":false,"dice":"1d4","str":1.5,"crit":null,"extra":[]},{"n":1,"name":"Coda","sec":true,"dice":"1d4","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Schianto (1d4+1½For), Coda (att.sec. -5TxC, 1d4+½For)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Schianto","sec":false,"dice":"1d8","str":1.5,"crit":null,"extra":[]},{"n":1,"name":"Coda","sec":true,"dice":"1d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Schianto (1d8+1½For), Coda (att.sec. -5TxC, 1d6+½For)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Schianto","sec":false,"dice":"2d6","str":1.5,"crit":null,"extra":[]},{"n":1,"name":"Coda","sec":true,"dice":"2d6","str":0.5,"crit":null,"extra":["Stordimento"]}]],"spazio":"3 m","portata":"1,5+3 m","raw":"Schianto (2d6+1½For), Coda (att.sec. -5TxC, 2d6+½For più Stordimento)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Schianto","sec":false,"dice":"3d6","str":1.5,"crit":null,"extra":[]},{"n":1,"name":"Coda","sec":true,"dice":"3d6","str":0.5,"crit":null,"extra":["Stordimento"]}]],"spazio":"4,5 m","portata":"3+3 m","raw":"Schianto (3d6+1½For), Coda (att.sec. -5TxC, 3d6+½For più Stordimento)","lv18":false}},"note":[],"capacita":[{"nome":"Calpestamento","tag":"dal Grande","corpo":"Come azione standard, il sauropode pesta il terreno con le zampe colossali: tutte le creature di taglia inferiore adiacenti subiscono i danni dello Schianto (Grande 2d6+1½For, Enorme 3d6+1½For); un TS Riflessi (CD 10+½DV+mod.For) dimezza."},{"nome":"Vista Panoramica","tag":null,"corpo":"L'altezza eccezionale conferisce +4 alle prove di Percezione per avvistare a distanza (cumulativo col bonus razziale) e il sauropode non può essere fiancheggiato da creature di taglia inferiore a Grande."},{"nome":"Travolgere","tag":"dal Grande","corpo":"Come azione di round completo, Oltrepassa creature di almeno una taglia inferiore. Danni: Grande 2d6+1½For, Enorme 3d6+1½For. CD 10+½DV+mod.For."},{"nome":"Stordimento coda","tag":"dal Grande","corpo":"Il colpo di coda impone TS Tempra (CD 10+½DV+mod.For) o stordimento per 1 round."},{"nome":"Presenza massiccia","tag":"solo Enorme","corpo":"Qualsiasi creatura di taglia Piccola o inferiore nel quadretto adiacente al Sauropode che fallisca un TS Volontà (CD 10+½DV+mod.For) è spaventata per 1 round."}],"chiusura":"occupa lo spazio e lascia lavorare la mole: dal Grande Calpestamento colpisce tutti gli adiacenti più piccoli e Travolgere apre un varco senza prove. A Enorme, Presenza massiccia lascia Spaventate da sola le creature di taglia Piccola o inferiore che ti si affiancano.","canatExtra":0},{"nome":"Spinosauro","cat":"Dinosauri","specie":["Spinosaurus aegyptiacus","Spinosaurus B","Baryonyx","Suchomimus"],"intro":"Lo spinosauro era forse il più grande predatore terrestre mai esistito, con la caratteristica vela dorsale e un muso da coccodrillo specializzato nella caccia ai pesci. Semi-acquatico, si muoveva agevolmente tra terra e acqua. La sua vela dorsale, ricca di vasi sanguigni, serviva per termoregolazione. Le forme Enormi rappresentano adulti che potevano superare i 14 metri.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"12 m"},{"sizes":["Piccola"],"label":"Piccola","val":"15 m"},{"sizes":["Media"],"label":"Media","val":"15 m"},{"sizes":["Grande"],"label":"Grande","val":"15 m, Nuotare 9 m"},{"sizes":["Enorme"],"label":"Enorme","val":"15 m, Nuotare 12 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"}],"bonus":"+4 Percezione, +8 Nuotare","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d3","str":1,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Morso (1d3+For)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":1,"crit":null,"extra":["Afferrare"]},{"n":2,"name":"Artigli","sec":true,"dice":"1d4","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d6+For più Afferrare), 2 Artigli (att.sec. -5TxC, 1d4+½For)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d8","str":1,"crit":null,"extra":["Afferrare"]},{"n":2,"name":"Artigli","sec":true,"dice":"1d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d8+For più Afferrare), 2 Artigli (att.sec. -5TxC, 1d6+½For)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":1,"crit":"19-20","extra":["Afferrare"]},{"n":2,"name":"Artigli","sec":true,"dice":"1d8","str":0.5,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"3 m","raw":"Morso (2d6+For/19-20 più Afferrare), 2 Artigli (att.sec. -5TxC, 1d8+½For)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d8","str":1.5,"crit":"19-20","extra":["Afferrare"]},{"n":2,"name":"Artigli","sec":true,"dice":"1d10","str":0.5,"crit":null,"extra":[]},{"n":1,"name":"Coda","sec":true,"dice":"1d10","str":0.5,"crit":null,"extra":[]}]],"spazio":"4,5 m","portata":"4,5 m","raw":"Morso (2d8+1½For/19-20 più Afferrare), 2 Artigli (att.sec. -5TxC, 1d10+½For), Coda (att.sec. -5TxC, 1d10+½For)","lv18":false}},"note":[],"capacita":[{"nome":"Vela Dorsale","tag":null,"corpo":"Quando si trova sotto luce solare diretta o in ambienti caldi, la termoregolazione conferisce +1 ai TxC e ai danni per 1 ora. La vela è vulnerabile: ogni critico confermato da dietro impone -1 temporaneo al bonus fino alla guarigione."},{"nome":"Pescatore","tag":null,"corpo":"Ha vantaggio nella caccia in acqua o in ambienti umidi: può usare il Morso su creature acquatiche o vicino all'acqua come se avesse la capacità Scatto (una volta al minuto). Ottiene +4 ai TxC contro creature acquatiche."},{"nome":"Semi-acquatico","tag":"dal Grande","corpo":"Può trattenere il fiato per round pari a 4× il punteggio di Costituzione. Si muove normalmente in acque poco profonde senza malus. In acqua profonda usa la velocità di Nuotare indicata."},{"nome":"Inghiottire","tag":"solo Enorme","corpo":"Se inizia il turno con un avversario di taglia Grande o inferiore Afferrato in bocca, può tentare una nuova prova di lotta (BMC) per inghiottirlo. La preda inghiottita è considerata In Lotta e Accecata, subisce 2d8+For danni contundenti per round e può agire solo con armi leggere o attacchi naturali. Per tagliarsi un varco deve colpire con un'arma tagliente o perforante l'interno della creatura, che ha CA 16 (10 + CA Naturale della forma Enorme), infliggendo PF pari a 1/10 dei PF massimi del druido (arrotondati per eccesso), poiché in Forma Selvatica è il druido a fornire i propri PF. Aperto il varco la preda esce; la forma non può inghiottire di nuovo finché la ferita non è rimarginata."}],"chiusura":"è la forma anfibia da caccia: Pescatore e Semi-acquatico ti rendono efficace dentro e ai bordi dell'acqua, e la Vela Dorsale vale +1 a TxC e danni per un'ora sotto sole diretto o in clima caldo. A Enorme, Inghiottire toglie di mezzo un avversario Grande o inferiore.","canatExtra":0},{"nome":"Dilofosauro Sputatore","cat":"Dinosauri","specie":["Dilophosaurus wetherilli","Ceratosauro acidulo","Guanlongsauro velenifero","Dilofosauro gigante"],"intro":"Il dilofosauro è un predatore bipede di medie dimensioni noto per la sua cresta ossea doppia e la capacità di sputare un acido corrosivo a distanza, utilizzato per immobilizzare le prede prima dell'attacco finale. Agile e veloce, compensa la corporatura relativamente esile con attacchi a distanza e la cresta intimidatoria che usa come segnale di minaccia. Nelle taglie Enormi l'acido diventa abbastanza potente da corrodere metalli e armature.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"9 m"},{"sizes":["Piccola"],"label":"Piccola","val":"12 m"},{"sizes":["Media"],"label":"Media","val":"15 m"},{"sizes":["Grande"],"label":"Grande","val":"15 m"},{"sizes":["Enorme"],"label":"Enorme","val":"18 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto, Visione crepuscolare"}],"bonus":"+4 Furtività, +4 Percezione","attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d3","str":1,"crit":null,"extra":["Acido 1"]},{"n":2,"name":"Artigli","sec":true,"dice":"1d2","str":0.5,"crit":null,"extra":[]}]],"spazio":"0,75 m","portata":"0 m","raw":"Morso (1d3+For più Acido 1), 2 Artigli (att.sec. -5TxC, 1d2+½For)","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d4","str":1,"crit":null,"extra":["Acido 1d2"]},{"n":2,"name":"Artigli","sec":true,"dice":"1d3","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d4+For più Acido 1d2), 2 Artigli (att.sec. -5TxC, 1d3+½For)","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":1,"crit":null,"extra":["Acido 1d4"]},{"n":2,"name":"Artigli","sec":true,"dice":"1d4","str":0.5,"crit":null,"extra":[]}]],"spazio":"1,5 m","portata":"1,5 m","raw":"Morso (1d6+For più Acido 1d4), 2 Artigli (att.sec. -5TxC, 1d4+½For)","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":1,"crit":null,"extra":["Acido 1d6"]},{"n":2,"name":"Artigli","sec":true,"dice":"1d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"3 m","portata":"3 m","raw":"Morso (2d6+For più Acido 1d6), 2 Artigli (att.sec. -5TxC, 1d6+½For)","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d8","str":1,"crit":null,"extra":["Acido 1d8"]},{"n":2,"name":"Artigli","sec":true,"dice":"2d6","str":0.5,"crit":null,"extra":[]}]],"spazio":"4,5 m","portata":"4,5 m","raw":"Morso (2d8+For più Acido 1d8), 2 Artigli (att.sec. -5TxC, 2d6+½For)","lv18":false}},"note":[],"capacita":[{"nome":"Immunità all'Acido","tag":null,"corpo":"Il dilofosauro è immune a tutti i danni da acido e agli effetti corrosivi."},{"nome":"Sputo Acido","tag":null,"corpo":"Come azione standard (ricarica 1d3 round): il dilofosauro sputa un getto di acido come attacco a distanza (attacco di contatto, gittata 9 m, senza incrementi). Danni: Minuscola 1d4; Piccola 1d6; Media 2d6; Grande 3d6; Enorme 4d6 danni da acido. Il bersaglio deve superare TS Riflessi (CD 10+½DV+mod.Des) per dimezzare. Se il TS fallisce, l'acido continua a bruciare: 1d4 danni aggiuntivi all'inizio del round successivo (uno solo). Oggetti metallici colpiti devono superare TS Tempra (stessa CD) o subire penalità -1 ai TxC/CA per 24 ore (metallo corroso)."},{"nome":"Spruzzi di Acido","tag":"dal Media","corpo":"Quando il dilofosauro viene colpito da un critico confermato in mischia, l'impatto fa spruzzare acido in tutte le direzioni: tutte le creature a 1,5 m devono superare TS Riflessi (CD 10+½DV+mod.Des) o subire 1d4 danni da acido."},{"nome":"Cresta Intimidatoria","tag":null,"corpo":"Come azione standard, 1 volta al giorno: il dilofosauro alza la sua cresta colorata ed emette un verso. Tutte le creature con DV < i propri DV entro 9 m devono superare TS Volontà (CD 10+½DV+mod.Car) o essere Scosse per 1d4 round."},{"nome":"Corrosione Totale","tag":"solo Enorme","corpo":"Quando il dilofosauro infligge danni con lo Sputo Acido su una creatura che indossa armatura metallica, l'armatura perde 1 punto di bonus CA fino alla riparazione (CD Artigianato Armaiolo 15 + ore di lavoro). Max -3 per armatura."}],"chiusura":"combatti a distanza: lo Sputo Acido è un attacco di contatto con ricarica 1d3 round, e a Enorme Corrosione Totale consuma progressivamente le armature metalliche. Immunità all'Acido ti rende sicuro anche quando gli Spruzzi di Acido partono da un critico subito da te.","canatExtra":0}];
const VEGETALI = [{"nome":"Annullamente","vol":"vegetali","cat":"Funghi e muffe","specie":["Muffa Schiavizzante","Muffa Gialla","Fungo Torpente"],"intro":"L'Annullamente è una massa fungina radicata capace di proiettare spore neurotossiche e di erodere l'intelletto di chi le si avvicina. Cresce in caverne umide e boschi marcescenti, dove la sua Aura di Risucchio Mentale intontisce prede e predatori prima ancora del contatto diretto. Alle taglie maggiori sviluppa una rudimentale Resistenza agli Incantesimi, segno di una consapevolezza che va oltre il semplice istinto vegetale.","vel":[{"sizes":["Piccola"],"label":"Piccola","val":"3 m, Scalare 3 m"},{"sizes":["Media"],"label":"Media","val":"4,5 m, Scalare 4,5 m"},{"sizes":["Grande"],"label":"Grande","val":"6 m, Scalare 6 m"},{"sizes":["Enorme"],"label":"Enorme","val":"7,5 m, Scalare 7,5 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Visione crepuscolare"}],"bonus":"","tratti":["Immunità: Tratti dei Vegetali. RI 22 (Grande), 25 (Enorme). Radici: Immune alla manovra Sbilanciare."],"attacchi":{"Piccola":{"alts":[[{"n":1,"name":"Schianto","sec":false,"dice":"1d4","str":1.5,"crit":null,"extra":[],"ranged":false,"touch":false}]],"dist":[{"n":1,"name":"Spore","sec":false,"dice":null,"str":0,"crit":null,"extra":["Debolezza mentale"],"ranged":true,"touch":true,"gittata":"9 m"}],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Media":{"alts":[[{"n":1,"name":"Schianto","sec":false,"dice":"1d6","str":1.5,"crit":null,"extra":[],"ranged":false,"touch":false}]],"dist":[{"n":1,"name":"Spore","sec":false,"dice":null,"str":0,"crit":null,"extra":["Debolezza mentale"],"ranged":true,"touch":true,"gittata":"12 m"}],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Schianto","sec":false,"dice":"1d8","str":1.5,"crit":null,"extra":[],"ranged":false,"touch":false}]],"dist":[{"n":1,"name":"Spore","sec":false,"dice":null,"str":0,"crit":null,"extra":["Deb interi gruppi di nemici con un'unica emanazione. Predilige gli ambienti freddi e umidi, ma proprio il gelo intenso può indurlo in un breve letargo che ne sospende le capacità offensive più sofisticate. Il colpo diretto del suo corpo carnoso resta comunque un'arma pesante a ogni taglia.","vel":[{"sizes":["Piccola"],"label":"Piccola","val":"4,5 m"},{"sizes":["Media"],"label":"Media","val":"6 m"},{"sizes":["Grande"],"label":"Grande","val":"6 m"},{"sizes":["Enorme"],"label":"Enorme","val":"6 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Percezione tellurica 18 m, Visione crepuscolare"}],"bonus":"","tratti":["Immunità: Tratti dei Vegetali. Resistenze: Freddo 20. Debolezza: Letargo Invernale. Radici: Immune alla manovra Sbilanciare."],"attacchi":{"Piccola":{"alts":[[{"n":1,"name":"Schianto","sec":false,"dice":"1d6","str":1.5,"crit":null,"extra":["Spore"],"ranged":false,"touch":false}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Media":{"alts":[[{"n":1,"name":"Schianto","sec":false,"dice":"1d8","str":1.5,"crit":null,"extra":["Spore"],"ranged":false,"touch":false}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Schianto","sec":false,"dice":"2d6","str":1.5,"crit":null,"extra":["Spore"],"ranged":false,"touch":false}]],"dist":[],"spazio":"3 m","portata":"1,5 m","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Schianto","sec":false,"dice":"2d8","str":1.5,"crit":null,"extra":["Spore"],"ranged":false,"touch":false}]],"dist":[],"spazio":"4,5 m","portata":"3 m","lv18":false}},"note":[],"capacita":[{"nome":"Nube Allucinatoria (1/minuto)","tag":null,"corpo":"Azione standard. Raggio 6 m (Piccola/Media) — 9 m (Grande) — 12 m (Enorme). TS Tempra (CD 10+½DV+mod.Cos) ogni round o Allucinazioni (tabella 1d6): (1) sabbie mobili — (2) sciame insetti — (3) oggetto-vipera — (4) soffocamento — (5) rimpicciolimento — (6) scioglimento. Effetto di [VELENO]. Dura 5 round; vento forte dissipa."},{"nome":"Spore","tag":null,"corpo":"Creature colpite dallo Schianto: TS Tempra (CD 10+½DV+mod.Cos) o le spore attecchiscono. Frequenza 1 round (max 6); 1d2 a Cos (Piccola/Media) — 1d3 a Cos (Grande) — 1d4 a Cos (Enorme). Cura 2 TS."},{"nome":"Letargo Invernale","tag":null,"corpo":"Qualsiasi effetto di freddo rallenta il Basidirond per 1d4 round, impedendo l'uso di Nube Allucinatoria e Spore."}],"chiusura":"usa la Nube Allucinatoria in apertura di scontro per disorientare più nemici insieme, poi passa allo Schianto per il danno diretto. In climi rigidi ricorda il Letargo Invernale.","canatExtra":0},{"nome":"Ascomoide","vol":"vegetali","cat":"Funghi e muffe","specie":["Ascomoide","Sferofungo","Vescica di Spore"],"intro":"L'Ascomoide è una massa fungina sferica che si muove rotolando a velocità sorprendente, lasciando dietro di sé nubi di spore tossiche a ogni movimento. Si affida più alla propria mobilità e alla superiorità numerica delle spore che alla forza bruta, sebbene dalla taglia Grande in su sia in grado di travolgere fisicamente chi le si oppone. Resiste bene al fuoco e all'elettricità, ma resta vulnerabile alle armi da taglio dopo un attacco riuscito contro il suo velenoso rivestimento.","vel":[{"sizes":["Piccola"],"label":"Piccola","val":"9 m"},{"sizes":["Media"],"label":"Media","val":"9 m"},{"sizes":["Grande"],"label":"Grande","val":"12 m"},{"sizes":["Enorme"],"label":"Enorme","val":"12 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Percezione tellurica 18 m, Visione crepuscolare"}],"bonus":"+8 Furtività nel sottobosco","tratti":["Immunità: Tratti dei Vegetali. Resistenze: Elettricità 20, Fuoco 20. Radici: Immune alla manovra Sbilanciare."],"attacchi":{"Piccola":{"alts":[[{"n":1,"name":"Schianto","sec":false,"dice":"1d6","str":1.5,"crit":null,"extra":["Spore"],"ranged":false,"touch":false}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Media":{"alts":[[{"n":1,"name":"Schianto","sec":false,"dice":"1d8","str":1.5,"crit":null,"extra":["Spore"],"ranged":false,"touch":false}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Schianto","sec":false,"dice":"2d6","str":1.5,"crit":null,"extra":["Spore"],"ranged":false,"touch":false}]],"dist":[],"spazio":"3 m","portata":"1,5 m","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Schianto","sec":false,"dice":"2d8","str":1.5,"crit":null,"extra":["Spore"],"ranged":false,"touch":false}]],"dist":[],"spazio":"4,5 m","portata":"3 m","lv18":false}},"note":[],"capacita":[{"nome":"Spore (1/round come gratuita)","tag":null,"corpo":"Getto di spore a 9 m (Piccola/Media) — 12 m (Grande) — 15 m (Enorme). A impatto genera nube (raggio 3 m) che dura 1 round. Creature nell'area: TS Tempra (CD 10+½DV+mod.Cos) o Nauseato mentre rimangono nella nube, più esposizione al Veleno."},{"nome":"Veleno","tag":null,"corpo":"Freq. 1 round (max 6): 1d2 a For (Piccola/Media) — 1d3 a For (Grande) — 1d4 a For (Enorme). Cura 2 TS. CD 10+½DV+mod.Cos."},{"nome":"Travolgere","tag":"dal Grande","corpo":"Azione di round completo. Oltrepassa creature di taglia inferiore senza prova. Danni: come Schianto. TS Riflessi (CD 10+½DV+mod.For) per dimezzare."}],"chiusura":"le Spore intrappolano un'area con un'azione gratuita ogni round: apri il combattimento rotolando in mezzo ai nemici, poi lascia che Veleno e Schianto pesante facciano il resto.","canatExtra":0},{"nome":"Psicospora","vol":"vegetali","cat":"Funghi e muffe","specie":["Psicospora","Fungo Spinoso","Muschio Psicotico"],"intro":"La Psicospora è un fungo irto di spine taglienti, capace di percepire l'ambiente circostante in ogni direzione grazie alla sua Visione a 360°. Combina attacchi ravvicinati avvelenati con una sferzata di frammenti spinosi lanciati a distanza, mentre il tossico che pervade i suoi tessuti punisce chiunque tenti di colpirla con lame o armi perforanti. Il veleno agisce sulla mente prima ancora che sul corpo, insinua — 27 m (Enorme). Le creature colpite subiscono anche Dolore."}],"chiusura":"i quattro Pungiglioni colpiscono in mischia mentre le Spine minacciano a distanza: alterna i bersagli per applicare Dolore su più nemici e tenerli Barcollanti a turno.","canatExtra":0},{"nome":"Erba Vorace","vol":"vegetali","cat":"Erbe e rampicanti","specie":["Erba Vorace","Erba Falciante","Fronda Vampira"],"intro":"L'Erba Vorace cresce in fitti tappeti erbosi e attacca con tre fronde taglienti che aprono ferite capaci di far perdere sangue a ogni colpo. Non è un predatore veloce né particolarmente resistente, ma si rigenera succhiando il sangue delle vittime già ferite: più a lungo dura il combattimento, più la pianta si rinvigorisce. Alle taglie maggiori il Sanguinamento che infligge diventa quasi impossibile da arrestare senza cure dedicate.","vel":[{"sizes":["Piccola"],"label":"Piccola","val":"3 m"},{"sizes":["Media"],"label":"Media","val":"3 m"},{"sizes":["Grande"],"label":"Grande","val":"4,5 m"},{"sizes":["Enorme"],"label":"Enorme","val":"6 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Visione crepuscolare"}],"bonus":"","tratti":["Immunità: Tratti dei Vegetali. RD 5/tagliente. Radici: Immune alla manovra Sbilanciare."],"attacchi":{"Piccola":{"alts":[[{"n":3,"name":"Fronde","sec":false,"dice":"1d3","str":1,"crit":null,"extra":["Sanguinamento 1"],"ranged":false,"touch":false,"tipo":"taglienti"}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Media":{"alts":[[{"n":3,"name":"Fronde","sec":false,"dice":"1d4","str":1,"crit":null,"extra":["Sanguinamento 1"],"ranged":false,"touch":false,"tipo":"taglienti"}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Grande":{"alts":[[{"n":3,"name":"Fronde","sec":false,"dice":"1d6","str":1,"crit":null,"extra":["Sanguinamento 1d3"],"ranged":false,"touch":false,"tipo":"taglienti"}]],"dist":[],"spazio":"3 m","portata":"1,5 m","lv18":false},"Enorme":{"alts":[[{"n":3,"name":" ntro":"Il Loto Cadaverico cresce nei pressi di cimiteri e campi di battaglia dimenticati, nutrendosi della decomposizione che lo circonda. Le sue quattro liane afferrano senza mai impegnarsi in una vera lotta, lasciando la pianta libera di continuare a colpire mentre trascina le vittime verso l'inghiottimento. La sua Visione a 360° rende quasi impossibile coglierlo di sorpresa da qualunque direzione.","vel":[{"sizes":["Piccola"],"label":"Piccola","val":"3 m"},{"sizes":["Media"],"label":"Media","val":"3 m"},{"sizes":["Grande"],"label":"Grande","val":"3 m"},{"sizes":["Enorme"],"label":"Enorme","val":"3 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Percezione tellurica 9 m, Scurovisione 18 m, Visione a 360°"}],"bonus":"","tratti":["Immunità: Tratti dei Vegetali. RD 5/tagliente. Resistenze: Acido 10, Elettricità 10. Radici: Immune alla manovra Sbilanciare."],"attacchi":{"Piccola":{"alts":[[{"n":4,"name":"Liane","sec":false,"dice":"1d3","str":1,"crit":null,"extra":["Afferrare"],"ranged":false,"touch":false}]],"dist":[],"spazio":"1,5 m","portata":"3 m","lv18":false},"Media":{"alts":[[{"n":4,"name":"Liane","sec":false,"dice":"1d4","str":1,"crit":null,"extra":["Afferrare"],"ranged":false,"touch":false}]],"dist":[],"spazio":"1,5 m","portata":"3 m","lv18":false},"Grande":{"alts":[[{"n":4,"name":"Liane","sec":false,"dice":"1d6","str":1,"crit":null,"extra":["Afferrare"],"ranged":false,"touch":false}]],"dist":[],"spazio":"3 m","portata":"4,5 m","lv18":false},"Enorme":{"alts":[[{"n":4,"name":"Liane","sec":false,"dice":"1d8","str":1,"crit":null,"extra":["Afferrare"],"ranged":false,"touch":false}]],"dist":[],"spazio":"4,5 m","portata":"6 m","lv18":false}},"note":[],"capacita":[{"nome":"Liane","tag":null,"corpo":"Il Loto non è considerato In Lotta quando afferra con le liane, e può mantenere più prese con la stessa azione standard."},{"nome":"Inghiottire","tag":null,"corpo":"Inizia il turno con avversario afferrato: prova di combattimento per inghiottirlo. Danni interni: 4d6 acido (Piccola/Media) — 6d6 acido (Grande) — 8d6 acido (Enorme) per round. Fuga: 1/10 dei Punti Ferita totali con arma tagliente o perforante."},{"nome":"Stritolare","tag":null,"corpo":"Con ogni prova di Lottare riuscita infligge danni contundenti aggiuntivi come il danno delle Liane."},{"nome":"Mimetismo","tag":null,"corpo":"CD Percezione 20 per notarlo prima del primo attacco. Grazie alla Visione a 360° non può essere Attaccato ai Fianchi."}],"chiusura":"le quattro Liane afferrano senza mai entrare In Lotta: puoi mantenere prese multiple e poi Inghiottire un bersaglio già catturato senza perdere azioni.","canatExtra":0},{"nome":"Drosera Gigante","vol":"vegetali","cat":"Fiori e piante carnivore","specie":["Drosera Gigante","Rosolida Gigante","Pianta Vischiosa"],"intro":"La Drosera Gigante intrappola le prede con un secreto adesivo che si indurisce a contatto, immobilizzandole per i colpi successivi dei suoi schianti acidi. Quando i nemici hanno consumato ogni riserva di energia, rilascia una nube di polline stupefacente che ne annebbia la mente. È vulnerabile al freddo intenso, capace di rendere inerte temporaneamente il suo adesivo, ma si decompone lentamente anche dopo la fine dei suoi giorni.","vel":[{"sizes":["Piccola"],"label":"Piccola","val":"4,5 m"},{"sizes":["Media"],"label":"Media","val":"6 m"},{"sizes":["Grande"],"label":"Grande","val":"6 m"},{"sizes":["Enorme"],"label":"Enorme","val":"6 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Percezione tellurica 18 m, Visione crepuscolare"}],"bonus":"","tratti":["Immunità: Tratti dei Vegetali. RD 5/tagliente. Resistenze: Acido 20."],"attacchi":{"Piccola":{"alts":[[{"n":2,"name":"Schianti","sec":false,"dice":"1d4","str":1,"crit":"19-20","extra":["Acido 1d3","Adesivo"],"ranged":false,"touch":false}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Media":{"alts":[[{"n":2,"name":"Schianti","sec":false,"dice":"1d6","str":1,"crit":"19-20","extra":["Acido 1d4","Adesivo"],"ranged":false,"touch":false}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Grande":{"alts":[[{"n":2,"name":"Schianti","sec":false,"dice":"1d8","str":1,"crit":"19-20","extra":["Acido 1d6","Adesivo"],"ranged":false,"touch":false}]],"dist":[],"spazio":"3 m","portata":"3 m","lv18":false},"Enorme":{"alts":[[{"n":2,"name":"Schianti","sec":false,"dice":"2d6","str":1,"crit":"19-20","extra":["Acido 1d8","Adesivo"],"ranged":false,"touch":false}]],"dist":[],"spazio":"4,5 m","portata":"4,5 m","lv18":false}},"note":[],"capacita":[{"nome":"Adesivo","tag":null,"corpo":"La Drosera trasuda adesivo: afferra automaticamente le creature colpite dallo Schianto. Armi che colpiscono: TS Riflessi (CD 10+½DV+mod.Cos) o restano bloccate (Forza CD 20 per staccarle). Alcol forte o solvente universale dissolvono l'adesivo. Diventa inerte per 1 round dopo 10 o più danni da freddo. Si decompone 5 round dopo che la pianta cessa di vivere."},{"nome":"Polline Stupefacente (1/giorno)","tag":null,"corpo":"Al primo azzeramento dei Punti Fatica, rilascia automaticamente una nube (raggio 6 m). TS Tempra (CD 10+½DV+mod.Cos) o 1d6 a Int più Barcollante per 1d4 round. Effetto di [VELENO]."},{"nome":"Stritolare","tag":null,"corpo":"Con ogni prova di Lottare riuscita infligge danni contundenti e acidi aggiuntivi come lo Schianto."}],"chiusura":"l'Adesivo blocca chi colpisce lo Schianto in mischia: usalo per immobilizzare gli attaccanti corpo a corpo, poi rilascia il Polline Stupefacente quando la Fatica del nemico si esaurisce.","canatExtra":0},{"nome":"Pianta Carnivora","vol":"vegetali","cat":"Fiori e piante carnivore","specie":["Pianta Carnivora","Dionea Gigante","Tagliola Vegetale"],"intro":"La Pianta Carnivora è ricoperta di bocche dentate capaci di mordere da ogni lato, e le più grandi possono avvolgere completamente una preda abbastanza piccola in una cavità digestiva ermetica. Non ha bisogno di velocità o astuzia: la sua unica strategia è restare immobile finché una vittima non si avvicina troppo. Il rischio di soffocamento all'interno di una bocca che avvolge è pericoloso quanto l'acido che la riempie.","vel":[{"sizes":["Piccola"],"label":"Piccola","val":"3 m"},{"sizes":["Media"],"label":"Media","val":"3 m"},{"sizes":["Grande"],"label":"Grande","val":"3 m"},{"sizes":["Enorme"],"label":"Enorme","val":"3 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Percezione tellurica 18 m, Visione crepuscolare"}],"bonus":"+8 Furtività nel sottobosco","tratti":["Immunità: Tratti dei Vegetali. Resistenze: Acido 20. Radici: Immune alla manovra Sbilanciare."],"attacchi":{"Piccola":{"alts":[[{"n":4,"name":"Morsi","sec":false,"dice":"1d3","str":1,"crit":null,"extra":[],"ranged":false,"touch":false}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Media":{"alts":[[{"n":4,"name":"Morsi","sec":false,"dice":"1d4","str":1,"crit":null,"extra":[],"ranged":false,"touch":false}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Grande":{"alts":[[{"n":4,"name":"Morsi","sec":false,"dice":"1d6","str":1,"crit":null,"extra":[],"ranged":false,"touch":false}]],"dist":[],"spazio":"3 m","portata":"3 m","lv18":false},"Enorme":{"alts":[[{"n":4,"name":"Morsi","sec":false,"dice":"1d8","str":1,"crit":null,"extra":[],"ranged":false,"touch":false}]],"dist":[],"spazio":"4,5 m","portata":"4,5 m","lv18":false}},"note":[],"capacita":[{"nome":"Avvolgere","tag":null,"corpo":"Se inizia il turno con un avversario di almeno due categorie di taglia inferiore In Lotta con una delle bocche: prova di combattimento per immobilizzarlo. Danni: come Morso + 2d6 acido (Piccola/Media) — Morso + 3d6 acido (Grande) — Morso + 4d6 acido (Enorme) per round. La cavità è ermetica: rischio soffocamento. Fuga come da immobilizzazione, ma nessuna linea di vista o effetto dall'interno. Una bocca che avvolge non può attaccare altri bersagli."}],"chiusura":"quattro Morsi distribuiti su altrettante bocche permettono di afferrare più bersagli insieme: fai Avvolgere solo sulle prede di taglia adeguata, lasciando che l'acido lavori round dopo round.","canatExtra":0},{"nome":"Querciaviva","vol":"vegetali","cat":"Alberi e guardiani del bosco","specie":["Querciaviva","Quercia Vigile","Guardiano Radicato"],"intro":"Il Querciaviva è un guardiano radicato dotato di dozzine di appendici simili a radici, capaci di trascinare le vittime a portata del suo Morso. Assorbe l'energia degli incantesimi che la sua Resistenza agli Incantesimi respinge, conservandola per scatenare un'Aura di Paura devastante contro chi lo minaccia. Resiste bene a fuoco ed elettricità, e le sue radici lo ancorano saldamente al suolo che protegge.* Portata con Appendici.","vel":[{"sizes":["Piccola"],"label":"Piccola","val":"3 m"},{"sizes":["Media"],"label":"Media","val":"3 m"},{"sizes":["Grande"],"label":"Grande","val":"3 m"},{"sizes":["Enorme"],"label":"Enorme","val":"3 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Scurovisione 18 m"}],"bonus":"+4 Furtività in ambienti boschivi","tratti":["Immunità: Tratti dei Vegetali. Resistenze: Elettricità 20, Fuoco 20. RI 19 (Piccola/Media) — 22 (Grande) — 25 (Enorme). Radici: Immune alla manovra Sbilanciare."],"attacchi":{"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d4","str":1,"crit":null,"extra":[],"ranged":false,"touch":false},{"n":3,"name":"Appendici","sec":true,"dice":"1d2","str":0.5,"crit":null,"extra":["Trascinare 3 m"],"ranged":false,"touch":false}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m / 3 m*","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":1,"crit":null,"extra":[],"ranged":false,"touch":false},{"n":3,"name":"Appendici","sec":true,"dice":"1d3","str":0.5,"crit":null,"extra":["Trascinare 3 m"],"ranged":false,"touch":false}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m / 4,5 m*","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d8","str":1,"crit":null,"extra":[],"ranged":false,"touch":false},{"n":3,"name":"Appendici","sec":true,"dice":"1d4","str":0.5,"crit":null,"extra":["Trascinare 3 m"],"ranged":false,"touch":false}]],"dist":[],"spazio":"3 m","portata":"3 m / 6 m*","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":1,"crit":null,"extra":[],"ranged":false,"touch":false},{"n":3,"name":"Appendici","sec":true,"dice":"1d6","str":0.5,"crit":null,"extra":["Trascinare 3 m"],"ranged":false,"touch":false}]],"dist":[],"spazio":"4,5 m","portata":"4,5 m / 7,5 m*","lv18":false}},"note":["Portata con Appendici."],"capacita":[{"nome":"Appendici","tag":null,"corpo":"Il Querciaviva ha dozzine di radici-appendici ma ne usa solo 3 per round. Se il Trascinare porta un bersaglio entro la portata del Morso, può effettuare immediatamente un attacco con il Morso (+4 al TxC) contro quel bersaglio."},{"nome":"Assorbire Incantesimi","tag":null,"corpo":"Se la RI la protegge da un effetto magico, assorbe l'energia. Può conservare un incantesimo alla volta per attivare l'Aura di Paura."},{"nome":"Aura di Paura","tag":null,"corpo":"Azione standard: attiva l'aura (raggio 3 m per livello dell'incantesimo assorbito, dura 1 round). TS Volontà (CD 10+½DV+mod.Car) o In Preda al Panico per 1d4 round."}],"chiusura":"le Appendici trascinano il bersaglio a portata di Morso: se il Trascinare riesce, il Morso di rincalzo colpisce con +4 al TxC nello stesso round. Conserva l'Aura di Paura per quando la RI assorbe un incantesimo nemico.","canatExtra":0},{"nome":"Treant","vol":"vegetali","cat":"Alberi e guardiani del bosco","specie":["Treant","Pastore degli Alberi","Antico del Bosco"],"intro":"Il Treant è un albero senziente e possente, capace di scagliare rocce a distanze notevoli prima ancora che il nemico si avvicini per il corpo a corpo. I suoi due schianti raddoppiano il danno contro strutture e oggetti, rendendolo temibile tanto in battagli +½DV+mod.Cos). Effetti di [VELENO]. Frequenza 1 round (max 4). Danno a Forza: Minuscola 1; Piccola 1d2; Media 1d3; Grande 1d4; Enorme 1d6. A Enorme, su TS fallito di 5 o più il bersaglio è Paralizzato 1 round. Cura 1 TS (Minuscola-Media) o 2 TS (Grande-Enorme)."},{"nome":"Tessitura di Tela","tag":"dal Piccola","corpo":"Come azione standard, lancia una rete di tela a max 6 m: TS Riflessi (CD 10+½DV+mod.Des) o Intralciato. PF della tela = 2×DV del ragno; rompere = CD Forza 10+½DV. Per liberarsi: prova di Lottare o di Artista della Fuga contro la DMC del ragno. Il ragno è immune e si muove sulla tela senza penalità."},{"nome":"Imboscata dalla Tela","tag":"dal Media","corpo":"In quadretti coperti di tela propria: +4 Furtività e +2 TxC al primo attacco a sorpresa contro creature intrappolate o adiacenti alla tela."},{"nome":"Sangue Velenoso","tag":"solo Enorme","corpo":"Chiunque infligga danno al ragno con arma da mischia non-portata (corpo a corpo entro 1,5 m) deve superare TS Tempra (stessa CD del Veleno) o essere esposto agli effetti di [VELENO] del ragno."},{"nome":"Filo di Sicurezza","tag":null,"corpo":"Il ragno mantiene sempre un filo ancorato dietro di sé. Non subisce danni da caduta da qualunque altezza e può risalire il filo con un'azione di movimento. Finché il filo è ancorato non può essere Sbilanciato né spinto fuori dal proprio quadretto."}],"chiusura":"la forma Minuscola è ideale per esplorazione e infiltrazione silenziosa; le forme grandi combinano controllo dell'area con la tela e un morso letale.","canatExtra":0},{"nome":"Scorpione","vol":"parassiti","cat":"Aracnidi","specie":["Scorpione del deserto","Scorpione imperatore","Scorpione velenoso","Scorpione gigante","Scorpione titanico"],"intro":"Predatori notturni armati di chele e di un pungiglione velenoso. La doppia presa permette di Afferrare le prede mentre il pungiglione le avvelena: dalle taglie più grandi il veleno diventa progressivamente paralizzante e la corazza acquista uno spessore quasi impen O]. Frequenza 1 round (max 6). Danno a Forza: Minuscola 1; Piccola 1d2; Media 1d3; Grande 1d4; Enorme 1d6. A Grande ed Enorme, il bersaglio è anche Barcollante 1 round. Cura 1 TS (Minuscola-Media) o 2 TS (Grande-Enorme)."},{"nome":"Afferrare con Chele","tag":"dal Piccola","corpo":"Quando colpisce con una chela, può tentare la manovra Afferrare come azione gratuita senza provocare attacchi di opportunità. Per liberarsi: Lottare o Artista della Fuga contro la DMC."},{"nome":"Costrizione delle Chele","tag":"dal Grande","corpo":"Se colpisce con entrambe le chele nello stesso round contro la stessa creatura, infligge 1d6+½For danni extra da stritolamento."},{"nome":"Carapace Spesso","tag":"dal Grande","corpo":"Ottiene RD 3/perforante. RD 5/perforante nella taglia Enorme."},{"nome":"Coda sulla Presa","tag":"dal Piccola","corpo":"Contro una creatura che lo Scorpione tiene Afferrata con le chele, l'attacco di Pungiglione ottiene +4 al Tiro per Colpire."}],"chiusura":"forma efficace per controllare il bersaglio con le chele e accumulare round di veleno con il pungiglione; la Coda sulla Presa rende la combo affidabile anche con la penalità dell'attacco secondario.","canatExtra":0},{"nome":"Solifuga","vol":"parassiti","cat":"Aracnidi","specie":["Solifuga","Galeode","Solifuga del deserto","Solifuga regina","Titano arido"],"intro":"Aracnidi velocissimi privi di veleno e tela, compensano con velocità impressionante e doppie mandibole massicce in grado di tranciare la pelle. Vivono in ambienti aridi e cacciano per inseguimento. Tutti i loro attacchi vengono dalla forza e dalla mobilità, non dalla pazienza.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"9 m"},{"sizes":["Piccola"],"label":"Piccola","val":"15 m"},{"sizes":["Media"],"label":"Media","val":"15 m"},{"sizes":["Grande"],"label":"Grande","val":"12 m"},{"sizes":["Enorme"],"label":"Enorme","val":"12 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Sensi Vibrazione 6 m, Visione crepuscolare, Visione a 360°"}],"bonus":"+8 Acrobazia, +4 Percezione, +4 Sopravvivenza (tracce in ambienti aridi; può seguire due tracce simultaneamente senza penalità)","tratti":[],"attacchi":{"Minuscola":{"alts":[[{"n":2,"name":"Mandibole","sec":false,"dice":"1d3","str":1,"crit":null,"extra":["entrambe primarie"]}]],"dist":[],"spazio":"0,75 m","portata":"0 m","lv18":false},"Piccola":{"alts":[[{"n":2,"name":"Mandibole","sec":false,"dice":"1d4","str":1,"crit":null,"extra":[]}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Media":{"alts":[[{"n":2,"name":"Mandibole","sec":false,"dice":"1d6","str":1,"crit":null,"extra":[]}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Grande":{"alts":[[{"n":2,"name":"Mandibole","sec":false,"dice":"1d8","str":1,"crit":null,"extra":[]}]],"dist":[],"spazio":"3 m","portata":"1,5 m","lv18":false},"Enorme":{"alts":[[{"n":2,"name":"Mandibole","sec":false,"dice":"2d6","str":1,"crit":null,"extra":[]}]],"dist":[],"spazio":"4,5 m","portata":"3 m","lv18":false}},"note":[],"capacita":[{"nome":"Velocità Fulminea","tag":null,"corpo":"Tutte le velocità terrestri sono incrementate di +3 m (già incluso nei valori sopra). La solifuga non è mai considerata in svantaggio in inseguimento."},{"nome":"Resistenza al Caldo","tag":null,"corpo":"Resistenza al fuoco 5 (Minuscola-Piccola), 10 (Media-Grande), 15 (Enorme). Bonus +4 ai TS contro effetti ambientali di caldo estremo."},{"nome":"Imboscata Solare","tag":"dal Piccola","corpo":"In ambienti aridi, desertici o rocciosi assolati: +4 Furtività e +2 TxC al primo attacco a sorpresa."},{"nome":"Frenesia Predatoria","tag":"dal Media","corpo":"Quando uccide una creatura con un attacco di Mandibola, ottiene immediatamente un attacco gratuito di Mandibola contro un nemico adiacente."},{"nome":"Trituratura","tag":"dal Grande","corpo":"Se entrambe le Mandibole colpiscono la stessa creatura nello stesso round, le lame tranciano la pelle: il bersaglio subisce effetti di [SANGUINAMENTO] per 1d6 danni all'inizio di ogni suo turno, finché non riceve cure magiche o una prova di Guarire CD 15."}],"chiusura":"forma ideale per cacce in inseguimento, ambienti aridi e combattimenti dove conta la velocità; la Trituratura aggiunge un danno nel tempo che compensa l'assenza di veleno.","canatExtra":0},{"nome":"Opilione","vol":"parassiti","cat":"Aracnidi","specie":["Opilione","Falangio","Opilione dei muri","Opilione gigante","Titano dalle lunghe zampe"],"intro":"Aracnidi dal corpo minuscolo sospeso su zampe sproporzionate, prive di veleno, di tela e persino di una vera separazione tra cefalotorace e addome. Non cacciano per agguato ma per pura copertura di terreno: le zampe permettono di scavalcare ostacoli, attraversare crepacci e colpire da distanze impossibili per la loro mole. Quando afferrati, si liberano staccando un arto. Le taglie maggiori diventano camminatori inarrestabili che passano sopra interi schieramenti.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"9 m, Scalare 6 m"},{"sizes":["Piccola"],"label":"Piccola","val":"12 m, Scalare 9 m"},{"sizes":["Media"],"label":"Media","val":"12 m, Scalare 9 m"},{"sizes":["Grande"],"label":"Grande","val":"12 m, Scalare 6 m"},{"sizes":["Enorme"],"label":"Enorme","val":"9 m, Scalare 6 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Sensi Vibrazione 6 m, Visione crepuscolare (vista debole)"}],"bonus":"+8 Acrobazia, +8 Scalare, +4 Furtività","tratti":[],"attacchi":{"Minuscola":{"alts":[[{"n":2,"name":"Chelicere","sec":false,"dice":"1d3","str":1,"crit":null,"extra":[]}]],"dist":[],"spazio":"0,75 m","portata":"1,5 m","lv18":false},"Piccola":{"alts":[[{"n":2,"name":"Chelicere","sec":false,"dice":"1d4","str":1,"crit":null,"extra":[]}]],"dist":[],"spazio":"1,5 m","portata":"3 m","lv18":false},"Media":{"alts":[[{"n":2,"name":"Chelicere","sec":false,"dice":"1d6","str":1,"crit":null,"extra":[]}]],"dist":[],"spazio":"1,5 m","portata":"3 m","lv18":false},"Grande":{"alts":[[{"n":2,"name":"Chelicere","sec":false,"dice":"1d8","str":1,"crit":null,"extra":[]}]],"dist":[],"spazio":"3 m","portata":"3 m","lv18":false},"Enorme":{"alts":[[{"n":2,"name":"Chelicere","sec":false,"dice":"2d6","str":1,"crit":null,"extra":[]}]],"dist":[],"spazio":"4,5 m","portata":"4,5 m","lv18":false}},"note":[],"capacita":[{"nome":"Zampe Smisurate","tag":null,"corpo":"La Portata è superiore di 1,5 m allo standard della taglia (già in tabella). Ignora il terreno difficile e supera ostacoli alti fino a 1,5 m senza rallentare."},{"nome":"Autotomia","tag":null,"corpo":"Come reazione, per liberarsi da Afferrato, Intralciato o Immobilizzato, stacca una zampa: si libera automaticamente. Ogni zampa persa riduce la velocità di 1,5 m e non ricresce durante la trasformazione. Massimo 3 usi per trasformazione."},{"nome":"Secrezione Repellente","tag":"dal Piccola","corpo":"Azione gratuita, 1/incontro. Ogni creatura adiacente subisce effetti di [VELENO]: TS Tempra (CD 10+½DV+mod.Cos) o Nauseata 1 round; in caso di fallimento non può usare Fiuto per 1 ora."},{"nome":"Andatura Oscillante","tag":"dal Media","corpo":"+2 schivare alla CA contro attacchi a distanza."},{"nome":"Passo del Titano","tag":"solo Enorme","corpo":"Può attraversare gli spazi occupati da creature di taglia Media o inferiore senza provocare attacchi di opportunità. Ogni creatura il cui spazio viene attraversato considera quel quadretto terreno difficile fino alla fine del turno dell'opilione."}],"chiusura":"forma di mobilità e portata, non di danno. Eccellente per superare terreni impraticabili, colpire da fuori portata e sganciarsi da qualunque presa.","canatExtra":0},{"nome":"Ragno Botola","vol":"parassiti","cat":"Aracnidi","specie":["Ragno botola","Ragno minatore","Ctenizide","Ragno botola gigante","Guardiano della soglia"],"intro":"A differenza dei cugini tessitori, i ctenizidi non costruiscono tele ma tane verticali chiuse da uno sportello di seta e terra, indistinguibile dal suolo. Attendono immobili per giorni, percependo le vibrazioni dei passi attraverso il terreno, poi esplodono fuori dalla botola e trascinano la preda sottoterra prima che possa reagire. Il veleno attacca i nervi anziché i muscoli. Nelle taglie maggiori la tana diventa una trappola capace di inghiottire un cavallo.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"4,5 m, Scalare 4,5 m"},{"sizes":["Piccola"],"label":"Piccola","val":"6 m, Scalare 6 m"},{"sizes":["Media"],"label":"Media","val":"9 m, Scalare 6 m"},{"sizes":["Grande"],"label":"Grande","val":"9 m, Scalare 4,5 m"},{"sizes":["Enorme"],"label":"Enorme","val":"9 m, Scalare 4,5 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Sensi Vibrazione 12 m, Visione crepuscolare, Visione a 360°"}],"bonus":"+8 Furtività (+12 in tana o su terreno smosso), +4 Percezione, +4 Scalare","tratti":[],"attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d4","str":1.5,"crit":null,"extra":["Veleno e Afferrare"]}]],"dist":[],"spazio":"0,75 m","portata":"0 m","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":1.5,"crit":null,"extra":["Veleno e Afferrare"]}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d8","str":1.5,"crit":null,"extra":["Veleno e Afferrare"]}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":1.5,"crit":null,"extra":["Veleno e Afferrare"]}]],"dist":[],"spazio":"3 m","portata":"1,5 m","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d8","str":1.5,"crit":null,"extra":["Veleno e Afferrare"]}]],"dist":[],"spazio":"4,5 m","portata":"3 m","lv18":false}},"note":[],"capacita":[{"nome":"Veleno","tag":null,"corpo":"Morso, TS Tempra (CD 10+½DV+mod.Cos). Effetti di [VELENO]. Frequenza 1 round (max 4). Danno a Destrezza: Minuscola 1; Piccola 1d2; Media 1d3; Grande 1d4; Enorme 1d6. Cura 1 TS (Minuscola-Media) o 2 TS (Grande-Enorme)."},{"nome":"Scavare la Tana","tag":null,"corpo":"Con 10 minuti di lavoro su terreno smosso costruisce una tana con botola mimetica (Percezione CD 20+½DV per individuarla). Dentro la tana ottiene +4 alla CA, non può essere fiancheggiato e la sua Furtività sale a +12."},{"nome":"Agguato dalla Botola","tag":null,"corpo":"Il primo attacco contro una creatura che entra nella sua portata mentre è nella tana ottiene +4 TxC e i dadi di danno raddoppiati. Il bersaglio è Colto alla sprovvista contro quell'attacco."},{"nome":"Trascinare nella Tana","tag":"dal Piccola","corpo":"Se ha Afferrato col Morso una creatura di taglia pari o inferiore, come azione di movimento tenta una prova contestata di Lottare: se vince, trascina il bersaglio nella tana e richiude la botola. All'interno il bersaglio è Immobilizzato e non ha linea di vista verso l'esterno. Per liberarsi: Lottare o Artista della Fuga contro la DMC del ragno."},{"nome":"Sensi del Terreno","tag":"dal Media","corpo":"Percepisce automaticamente ogni creatura a contatto col suolo entro 18 m, anche attraverso pareti di terra o roccia."},{"nome":"Tana Titanica","tag":"solo Enorme","corpo":"La tana può contenere creature fino a taglia Grande. Finché il ragno si trova al suo interno ottiene RD 5/—."}],"chiusura":"forma da imboscata pura e da controllo del terreno. Richiede preparazione, ma un solo round di agguato può togliere un nemico dal combattimento.","canatExtra":0},{"nome":"Centopiede","vol":"parassiti","cat":"Miriapodi","specie":["Centopiede di casa","Centopiede crudele","Centopiede gigante","Centopiede d'antri","Centopiede titanico"],"intro":"Predatori velenosi e flessibili, i centopiedi possono entrare in spazi impossibili per altre creature della loro taglia. Il loro morso inietta un veleno debilitante che cresce in potenza con la mole. Le taglie maggiori cadono in frenesia quando ferite a morte.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"6 m, Scalare 6 m"},{"sizes":["Piccola"],"label":"Piccola","val":"12 m, Scalare 12 m"},{"sizes":["Media"],"label":"Media","val":"12 m, Scalare 9 m"},{"sizes":["Grande"],"label":"Grande","val":"12 m, Scalare 6 m"},{"sizes":["Enorme"],"label":"Enorme","val":"9 m, Scalare 4,5 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Sensi Vibrazione 9 m; oltre tale raggio è considerato Accecato"}],"bonus":"+8 Furtività, +8 Scalare","tratti":[],"attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d4","str":1.5,"crit":null,"extra":["Veleno"]}]],"dist":[],"spazio":"0,75 m","portata":"0 m","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":1.5,"crit":null,"extra":["Veleno"]}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d8","str":1.5,"crit":null,"extra":["Veleno"]}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":1.5,"crit":null,"extra":["Veleno"]}]],"dist":[],"spazio":"3 m","portata":"1,5 m","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d8","str":1.5,"crit":null,"extra":["Veleno"]}]],"dist":[],"spazio":"4,5 m","portata":"3 m","lv18":false}},"note":[],"capacita":[{"nome":"Veleno","tag":null,"corpo":"Morso, TS Tempra (CD 10+½DV+mod.Cos). Effetti di [VELENO]. Frequenza 1 round (max 4). Danno a Destrezza: Minuscola 1; Piccola 1d2; Media 1d3; Grande 1d4; Enorme 1d6. Cura 1 TS (Minuscola-Media) o 2 TS (Grande-Enorme)."},{"nome":"Corpo Flessibile","tag":"dal Piccola","corpo":"Può passare attraverso spazi di metà la sua larghezza senza penalità di movimento (es. una fessura larga 75 cm per un centopiede Medio)."},{"nome":"Costrizione Anulare","tag":"dal Media","corpo":"Dopo aver colpito col Morso, come azione gratuita può avvolgere il proprio corpo attorno al bersaglio: Afferrare senza provocare attacchi di opportunità. Mentre lo tiene avvolto infligge automaticamente 1d6+½For danni all'inizio di ogni suo turno e il veleno del Morso guadagna +2 alla CD. Per liberarsi: Lottare o Artista della Fuga contro la DMC."},{"nome":"Frenesia","tag":"solo Enorme","corpo":"Sotto metà PF: ottiene un attacco extra di Morso al round al BAB pieno. Persiste finché resta sotto metà PF."}],"chiusura":"forma molto efficace per esplorazione di cunicoli e per cacce con avvelenamento progressivo; la Costrizione Anulare permette finalmente di trattenere la preda mentre il veleno matura.","canatExtra":0},{"nome":"Millepiede","vol":"parassiti","cat":"Miriapodi","specie":["Millepiede dei boschi","Millepiede lucente","Millepiede gigante","Millepiede corazzato","Titano anellato"],"intro":"A differenza del cugino centopiede, il millepiede non è predatore: è una forma difensiva, lenta e blindata che si protegge con esoscheletro spesso e secrezioni tossiche. Quando minacciato si arrotola in una palla impenetrabile. Le taglie maggiori possono rilasciare nubi di gas tossico in autodifesa.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"3 m"},{"sizes":["Piccola"],"label":"Piccola","val":"4,5 m"},{"sizes":["Media"],"label":"Media","val":"6 m, Scavare 1,5 m"},{"sizes":["Grande"],"label":"Grande","val":"6 m, Scavare 3 m"},{"sizes":["Enorme"],"label":"Enorme","val":"4,5 m, Scavare 3 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Sensi Vibrazione 6 m, Visione crepuscolare (limitata)"}],"bonus":"+4 ai TS contro effetti di veleno e malattia","tratti":[],"attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d4","str":1.5,"crit":null,"extra":[]}]],"dist":[],"spazio":"0,75 m","portata":"0 m","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":1.5,"crit":null,"extra":[]}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d8","str":1.5,"crit":null,"extra":[]}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":1.5,"crit":null,"extra":[]}]],"dist":[],"spazio":"3 m","portata":"1,5 m","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d8","str":1.5,"crit":null,"extra":[]}]],"dist":[],"spazio":"4,5 m","portata":"3 m","lv18":false}},"note":[],"capacita":[{"nome":"Secrezione Tossica","tag":"dal Piccola","corpo":"Qualunque creatura che tocca il millepiede o lo colpisce in mischia con attacco senz'arma o naturale deve superare TS Tempra (CD 10+½DV+mod.Cos) o essere Accecata per 1d4 round. Effetti di [VELENO]."},{"nome":"Gas Tossico","tag":"dal Grande","corpo":"Azione standard, 1/incontro: rilascia una nube tossica in un cono di 4,5 m (6 m per Enorme). Effetti di [VELENO]. Tutte le creature nell'area devono superare TS Tempra (CD 10+½DV+mod.Cos) o essere Nauseate per 1d4 round."},{"nome":"Arrotolarsi","tag":null,"corpo":"Azione di movimento: il millepiede si arrotola su sé stesso. Ottiene +4 schivare alla CA finché resta arrotolato, ma non può attaccare né muoversi; è immune a Sbilanciare. Conserva tutti i suoi PF e bonus difensivi. Srotolarsi è di nuovo un'azione di movimento."},{"nome":"Esoscheletro Pesante","tag":"dal Media","corpo":"Ottiene RD 3/contundente. RD 5/contundente nella taglia Enorme."},{"nome":"Rotolamento","tag":"dal Grande","corpo":"Mentre è arrotolato può muoversi rotolando a metà velocità. Ogni creatura di taglia pari o inferiore nel percorso subisce 2d6+1½For danni da impatto e cade Prona (TS Riflessi CD 10+½DV+mod.For dimezza ed evita la caduta)."}],"chiusura":"forma di sopravvivenza più che di attacco: ottima per resistere, ostacolare in modo passivo e ora anche per aprirsi un varco rotolando attraverso i nemici.","canatExtra":0},{"nome":"Scutigera","vol":"parassiti","cat":"Miriapodi","specie":["Scutige
