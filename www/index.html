zione e inseguimento, specialmente contro bersagli aerei; a Enorme diventa anche una presa quasi inescapabile.","canatExtra":0},{"nome":"Locusta","vol":"parassiti","cat":"Insetti","specie":["Cavalletta","Locusta del deserto","Locusta migratoria","Locusta gigante","Locusta titanica"],"intro":"Insetti dalle zampe possenti, capaci di salti impressionanti. Solo la forma Minuscola può volare (Bassa Quota). Le mandibole possono triturare in pezzi qualunque vegetale o legno, comprese armi e scudi in legno. Le forme maggiori possono richiamare uno sciame di locuste alleate.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"4,5 m, Salto 9 m, Volare 12 m (Bassa Quota)"},{"sizes":["Piccola"],"label":"Piccola","val":"9 m, Salto 12 m"},{"sizes":["Media"],"label":"Media","val":"12 m, Salto 12 m"},{"sizes":["Grande"],"label":"Grande","val":"12 m, Salto 9 m"},{"sizes":["Enorme"],"label":"Enorme","val":"9 m, Salto 6 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Visione a 360° (nessuna penalità da fianchi o spalle; mai Colta alla sprovvista da nemici visibili; immune a furtivo per accerchiamento), Visione crepuscolare"}],"bonus":"+8 Acrobazia (specialmente in salti)","tratti":[],"attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d4","str":1.5,"crit":null,"extra":[]}]],"dist":[],"spazio":"0,75 m","portata":"0 m","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":1.5,"crit":null,"extra":[]}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d8","str":1.5,"crit":null,"extra":[]}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":1.5,"crit":null,"extra":[]}]],"dist":[],"spazio":"3 m","portata":"1,5 m","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d8","str":1.5,"crit":null,"extra":[]}]],"dist":[],"spazio":"4,5 m","portata":"3 m","lv18":false}},"note":[],"capacita":[{"nome":"Volo","tag":"solo Minuscola","corpo":"Soggetto al riquadro Volo dei Parassiti."},{"nome":"Salto Possente","tag":null,"corpo":"La locusta può saltare ×4 la distanza normale per la sua Forza. Sempre considerata “in rincorsa” per le prove di Salto."},{"nome":"Mandibole Voraci","tag":null,"corpo":"I danni della Locusta sono raddoppiati contro oggetti di natura vegetale (alberi, piante), corde, sartiame e provviste, e contro armi/scudi di legno. Su oggetti indossati o impugnati applica la scala Scheggiato → Rotto → distrutto."},{"nome":"Richiamo dello Sciame","tag":"dal Media, 1/giorno","corpo":"Azione standard: richiama uno sciame di locuste in un raggio di 9 m. L'area diventa terreno difficile e infligge 1d4 danni da locuste/round a chiunque vi transiti (TS Riflessi CD 10+½DV+mod.Cos dimezza). Lo sciame dura 1 minuto."},{"nome":"Fuga Esplosiva","tag":"dal Grande","corpo":"Reazione a un colpo critico subito: la locusta balza 6 m in una direzione di sua scelta e ottiene +2 schivare alla CA fino al suo prossimo turno."},{"nome":"Piaga","tag":"solo Enorme, 1/giorno","corpo":"Il Richiamo dello Sciame diventa utilizzabile 3 volte al giorno, il raggio sale a 18 m e la durata a 5 minuti. Ogni creatura che inizia il turno nell'area deve superare un TS su Tempra (CD 10+½DV+mod.Cos) o restare Accecata finché non lascia l'area: le locuste coprono occhi e bocca."},{"nome":"Ali Perdute","tag":null,"corpo":"Oltre la taglia Minuscola non può volare. La velocità terrestre è già adeguata in tabella e non subisce penalità per corsa su terreno accidentato."},{"nome":"Ali Residue","tag":null,"corpo":"Le ali rallentano la caduta: altezza considerata inferiore di 6 m (nessun danno e nessun Prono entro 6 m; max 9 m di riduzione con Acrobazia CD 15). Può planare di 1,5 m ogni 3 m di discesa."}],"chiusura":"forma eccellente per attraversare terreni difficili (salti), distruggere armi e armature di legno, e creare ostacoli con lo sciame; a Enorme la Piaga può decidere uno scontro d'area.","canatExtra":0},{"nome":"Zanzara / Mosca","vol":"parassiti","cat":"Insetti","specie":["Mosca","Zanzara","Tafano","Mosca cavallina","Zanzara gigante"],"intro":"Parassiti aerei che si nutrono di sangue. Solo la taglia Minuscola può volare. Sono portatori di malattie e in volo riescono a passare quasi inosservati. Le taglie maggiori diventano predatori a terra a tutti gli effetti, ma mantengono la dipendenza dal sangue.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"4,5 m, Volare 15 m (perfetta, Bassa Quota)"},{"sizes":["Piccola"],"label":"Piccola","val":"9 m"},{"sizes":["Media"],"label":"Media","val":"12 m"},{"sizes":["Grande"],"label":"Grande","val":"12 m"},{"sizes":["Enorme"],"label":"Enorme","val":"9 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Visione a 360° (nessuna penalità da fianchi o spalle; mai Colta alla sprovvista da nemici visibili; immune a furtivo per accerchiamento), Visione composta, Visione crepuscolare"}],"bonus":"+4 Furtività in volo (Minuscola)","tratti":[],"attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Puntura","sec":false,"dice":"1d4","str":1.5,"crit":null,"extra":["Succhiare Sangue"]}]],"dist":[],"spazio":"0,75 m","portata":"0 m","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Puntura","sec":false,"dice":"1d6","str":1.5,"crit":null,"extra":["Succhiare Sangue"]}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Media":{"alts":[[{"n":1,"name":"Puntura","sec":false,"dice":"1d8","str":1.5,"crit":null,"extra":["Succhiare Sangue"]}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Puntura","sec":false,"dice":"2d6","str":1.5,"crit":null,"extra":["Succhiare Sangue"]}]],"dist":[],"spazio":"3 m","portata":"1,5 m","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Puntura","sec":false,"dice":"2d8","str":1.5,"crit":null,"extra":["Succhiare Sangue"]}]],"dist":[],"spazio":"4,5 m","portata":"3 m","lv18":false}},"note":[],"capacita":[{"nome":"Volo","tag":"solo Minuscola","corpo":"Soggetto al riquadro Volo dei Parassiti."},{"nome":"Succhiare Sangue","tag":null,"corpo":"Quando colpisce con la Puntura, può iniziare a succhiare sangue come azione gratuita. Mentre resta adiacente al bersaglio, ogni round infligge danno temporaneo a Forza: Minuscola/Piccola 1; Media 1d2; Grande 1d3; Enorme 1d4 (TS Tempra CD 10+½DV+mod.Cos dimezza, minimo 0)."},{"nome":"Puntura Silenziosa","tag":"fino a Media","corpo":"Il bersaglio non si accorge della puntura se fallisce una prova di Percezione (CD 15+½DV della zanzara/mosca). Effetto interrompibile da chi nota la creatura."},{"nome":"Portatrice di Malattia","tag":"dal Media","corpo":"Al morso, il bersaglio deve superare TS Tempra (CD 10+½DV+mod.Cos) o contrarre una malattia simil-malarica: effetti di [MALATTIA], 1d4 PF di danno temporaneo/giorno, recupero con CD 13 Cura Malattie o 2 TS consecutivi riusciti. La malattia incuba 1 giorno."},{"nome":"Volo Irregolare","tag":"solo Minuscola","corpo":"In volo: bonus +4 CA contro Attacchi di Opportunità. Movimento erratico difficile da prevedere."},{"nome":"Dissanguamento","tag":"solo Enorme","corpo":"Mentre succhia sangue, la ferita non si chiude: il bersaglio subisce effetti di [SANGUINAMENTO] per 1d6 danni all'inizio di ogni suo turno anche dopo che la zanzara si è staccata, finché non riceve cure magiche o una prova di Guarire CD 15. Ogni punto di Forza drenato conferisce alla zanzara 5 PF temporanei."},{"nome":"Ali Perdute","tag":null,"corpo":"Oltre la taglia Minuscola non può volare. La velocità terrestre è già adeguata in tabella e non subisce penalità per corsa su terreno accidentato."},{"nome":"Ali Residue","tag":null,"corpo":"Le ali rallentano la caduta: altezza considerata inferiore di 6 m (nessun danno e nessun Prono entro 6 m; max 9 m di riduzione con Acrobazia CD 15). Può planare di 1,5 m ogni 3 m di discesa."}],"chiusura":"la Minuscola è ideale per spionaggio silenzioso; le taglie maggiori sono predatori parassitari a tutti gli effetti, e a Enorme lasciano ferite che continuano a sanguinare.","canatExtra":0},{"nome":"Ape","vol":"parassiti","cat":"Insetti","specie":["Ape operaia","Ape mellifera","Ape carpentiera","Ape gigante","Regina dell'alveare"],"intro":"A differenza delle vespe, le api pungono una volta sola: il pungiglione uncinato resta nella carne della vittima e viene strappato via, ferita che l'ape paga cara. Per questo combattono di mandibole e riservano il colpo mortale al momento decisivo. Sono creature d'alveare, capaci di indicare alle compagne una posizione esatta con una danza, e di produrre propoli e miele dalle proprietà curative riconosciute anche dagli alchimisti. Le regine titaniche comandano sciami che oscurano il sole.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"4,5 m, Volare 18 m (buona, Bassa Quota)"},{"sizes":["Piccola"],"label":"Piccola","val":"12 m"},{"sizes":["Media"],"label":"Media","val":"15 m"},{"sizes":["Grande"],"label":"Grande","val":"15 m"},{"sizes":["Enorme"],"label":"Enorme","val":"12 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Visione composta, Visione a 360° (nessuna penalità da fianchi o spalle; mai Colta alla sprovvista da nemici visibili; immune a furtivo per accerchiamento), Visione crepuscolare, Sensi Vibrazione 6 m"}],"bonus":"+4 Percezione, +8 Sopravvivenza (orientamento), +4 Volare (Minuscola)","tratti":[],"attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d4","str":1.5,"crit":null,"extra":[]}]],"dist":[],"spazio":"0,75 m","portata":"0 m","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d6","str":1.5,"crit":null,"extra":[]}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Media":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"1d8","str":1.5,"crit":null,"extra":[]}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d6","str":1.5,"crit":null,"extra":[]}]],"dist":[],"spazio":"3 m","portata":"1,5 m","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Morso","sec":false,"dice":"2d8","str":1.5,"crit":null,"extra":[]}]],"dist":[],"spazio":"4,5 m","portata":"3 m","lv18":false}},"note":[],"capacita":[{"nome":"Volo","tag":"solo Minuscola","corpo":"Soggetto al riquadro Volo dei Parassiti. Manovrabilità buona."},{"nome":"Pungiglione Uncinato","tag":null,"corpo":"Una volta per trasformazione, azione standard: attacco di mischia che infligge il danno del Morso con dadi raddoppiati più effetti di [VELENO] (TS Tempra CD 10+½DV+mod.Cos; frequenza 1 round, max 6; danno a Costituzione: Minuscola 1; Piccola 1d2; Media 1d3; Grande 1d4; Enorme 1d6; cura 2 TS). Il pungiglione resta nella ferita: l'ape subisce 1d6 danni per Dado Vita, che ignorano ogni RD."},{"nome":"Danza dell'Alveare","tag":null,"corpo":"Azione di round completo: comunica a tutti gli alleati entro 30 m che possono vederla la posizione esatta di un luogo o di una creatura osservata nelle ultime 24 ore. Gli alleati ottengono +4 a Sopravvivenza per raggiungerla e non possono perdersi lungo il percorso."},{"nome":"Propoli","tag":"dal Piccola","corpo":"Con 10 minuti di lavoro produce una dose. Applicata come azione standard, cura 1d8 PF +1 per Dado Vita e conferisce +4 ai TS contro effetti di [VELENO] e [MALATTIA] per 1 ora. Massimo 3 dosi per trasformazione; le dosi sopravvivono al termine della forma ma si guastano dopo 24 ore."},{"nome":"Difesa dell'Alveare","tag":"dal Media","corpo":"Entro 9 m da un alleato a metà PF o meno, ottiene +2 ai TxC in mischia, +2 ai danni e +2 schivare alla CA."},{"nome":"Sciame Reale","tag":"solo Enorme, 1/giorno","corpo":"Azione standard: sciame in un raggio di 12 m per 1 minuto. Ogni creatura che inizia il turno nell'area subisce 2d6 danni ed effetti di [VELENO] (TS Tempra CD 10+½DV+mod.Cos dimezza e annulla il veleno). Gli alleati dell'ape sono immuni."},{"nome":"Ali Perdute","tag":null,"corpo":"Oltre la taglia Minuscola non può volare. La velocità terrestre è già adeguata in tabella e non subisce penalità per corsa su terreno accidentato."},{"nome":"Ali Residue","tag":null,"corpo":"Le ali rallentano la caduta: altezza considerata inferiore di 6 m (nessun danno e nessun Prono entro 6 m; max 9 m di riduzione con Acrobazia CD 15). Può planare di 1,5 m ogni 3 m di discesa."}],"chiusura":"unica forma del volume con una capacità curativa. Vale come supporto ed esploratrice; il Pungiglione Uncinato è un colpo da spendere una volta sola.","canatExtra":0},{"nome":"Falena","vol":"parassiti","cat":"Insetti","specie":["Falena","Sfinge testa di morto","Falena lunare","Falena gigante","Spettro delle ali polverose"],"intro":"Insetti notturni dalle ali coperte di scaglie microscopiche che si staccano a nuvola al minimo urto, accecando chiunque le respiri. Non hanno mandibole per mordere: afferrano con le zampe uncinate e si affidano al camuffamento, al volo silenzioso e a un olfatto capace di seguire una traccia di feromoni per chilometri. Nelle taglie maggiori le ali diventano vele di polvere velenosa e il disegno sul dorso, che imita due enormi occhi, terrorizza i predatori.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"4,5 m, Volare 15 m (buona, Bassa Quota)"},{"sizes":["Piccola"],"label":"Piccola","val":"9 m"},{"sizes":["Media"],"label":"Media","val":"12 m"},{"sizes":["Grande"],"label":"Grande","val":"12 m"},{"sizes":["Enorme"],"label":"Enorme","val":"9 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Fiuto (30 m per feromoni e tracce), Visione crepuscolare, Scurovisione 18 m"}],"bonus":"+8 Furtività (+12 al buio o in ambienti boschivi), +8 Sopravvivenza (tracce olfattive), +4 Volare (Minuscola)","tratti":[],"attacchi":{"Minuscola":{"alts":[[{"n":2,"name":"Zampe Uncinate","sec":false,"dice":"1d3","str":1,"crit":null,"extra":["Afferrare"]}]],"dist":[],"spazio":"0,75 m","portata":"0 m","lv18":false},"Piccola":{"alts":[[{"n":2,"name":"Zampe Uncinate","sec":false,"dice":"1d4","str":1,"crit":null,"extra":["Afferrare"]}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Media":{"alts":[[{"n":2,"name":"Zampe Uncinate","sec":false,"dice":"1d6","str":1,"crit":null,"extra":["Afferrare"]}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Grande":{"alts":[[{"n":2,"name":"Zampe Uncinate","sec":false,"dice":"1d8","str":1,"crit":null,"extra":["Afferrare"]}]],"dist":[],"spazio":"3 m","portata":"1,5 m","lv18":false},"Enorme":{"alts":[[{"n":2,"name":"Zampe Uncinate","sec":false,"dice":"2d6","str":1,"crit":null,"extra":["Afferrare"]}]],"dist":[],"spazio":"4,5 m","portata":"3 m","lv18":false}},"note":[],"capacita":[{"nome":"Volo","tag":"solo Minuscola","corpo":"Soggetto al riquadro Volo dei Parassiti. Il volo è completamente silenzioso: nessuna penalità a Furtività mentre vola."},{"nome":"Polvere di Scaglie","tag":null,"corpo":"Azione standard, una volta ogni 1d4 round: cono di 3 m (Minuscola/Piccola), 4,5 m (Media), 6 m (Grande), 9 m (Enorme). TS Riflessi (CD 10+½DV+mod.Cos) o Accecato 1d4 round; chi supera il TS è comunque Offuscato (20%) per 1 round."},{"nome":"Mimetismo Immobile","tag":null,"corpo":"Se resta immobile contro una superficie compatibile (corteccia, roccia, tessuto), ottiene +10 a Furtività e può nascondersi anche mentre è osservata."},{"nome":"Richiamo Feromonico","tag":"dal Piccola","corpo":"Azione standard: rilascia feromoni percepibili fino a 1,5 km sottovento. Una creatura animale o vermine con Fiuto che li percepisce deve superare un TS su Volontà (CD 10+½DV+mod.Car) o muoversi verso la fonte per 1d4 round. Effetti di [AMMALIAMENTO]."},{"nome":"Occhi sulle Ali","tag":"dal Media","corpo":"Azione di movimento: le creature entro 9 m che la vedono devono superare un TS su Volontà (CD 10+½DV+mod.Car) o restare Scosse per 1d4 round. Effetti di [PAURA]. Immunità 24 ore dopo un TS superato."},{"nome":"Manto di Polvere","tag":"solo Enorme","corpo":"Ogni creatura che inizia il turno adiacente alla falena deve superare un TS su Tempra (CD 10+½DV+mod.Cos) o restare Nauseata 1 round. La Polvere di Scaglie diventa utilizzabile ogni round."},{"nome":"Ali Perdute","tag":null,"corpo":"Oltre la taglia Minuscola non può volare. La velocità terrestre è già adeguata in tabella e non subisce penalità per corsa su terreno accidentato."},{"nome":"Ali Residue","tag":null,"corpo":"Le ali rallentano la caduta: altezza considerata inferiore di 6 m (nessun danno e nessun Prono entro 6 m; max 9 m di riduzione con Acrobazia CD 15). Può planare di 1,5 m ogni 3 m di discesa."}],"chiusura":"forma di controllo e infiltrazione notturna. Non regge uno scontro frontale, ma acceca, spaventa e sparisce. L'unica forma del volume con Scurovisione.","canatExtra":0},{"nome":"Cicala","vol":"parassiti","cat":"Insetti","specie":["Cicala","Cicala cantatrice","Cicala dei diciassette anni","Cicala gigante","Urlatrice titanica"],"intro":"Insetti dal corpo tozzo e dalle ali membranose, celebri per il canto assordante prodotto da due membrane rigide sull'addome: alle taglie maggiori il suono cessa di essere un richiamo e diventa un'arma, capace di frantumare vetro e ossa. Si nutrono conficcando un rostro rigido nei tessuti. Passano anni sottoterra allo stato di ninfa prima di emergere, e conservano da quella fase la capacità di scavare e di restare immobili per giorni.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"4,5 m, Scavare 1,5 m, Volare 12 m (Bassa Quota)"},{"sizes":["Piccola"],"label":"Piccola","val":"9 m, Scavare 3 m"},{"sizes":["Media"],"label":"Media","val":"12 m, Scavare 3 m"},{"sizes":["Grande"],"label":"Grande","val":"12 m, Scavare 4,5 m"},{"sizes":["Enorme"],"label":"Enorme","val":"9 m, Scavare 4,5 m"}],"sensi":[{"sizes":["Minuscola","Piccola","Media","Grande","Enorme"],"label":"Tutte le taglie","val":"Sensi Vibrazione 12 m, Visione crepuscolare, Visione a 360° (nessuna penalità da fianchi o spalle; mai Colta alla sprovvista da nemici visibili; immune a furtivo per accerchiamento)"}],"bonus":"+8 Percezione (udito), +4 Furtività, +4 Scalare","tratti":[],"attacchi":{"Minuscola":{"alts":[[{"n":1,"name":"Rostro","sec":false,"dice":"1d4","str":1.5,"crit":null,"extra":[]}]],"dist":[],"spazio":"0,75 m","portata":"0 m","lv18":false},"Piccola":{"alts":[[{"n":1,"name":"Rostro","sec":false,"dice":"1d6","str":1.5,"crit":null,"extra":[]}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Media":{"alts":[[{"n":1,"name":"Rostro","sec":false,"dice":"1d8","str":1.5,"crit":null,"extra":[]}]],"dist":[],"spazio":"1,5 m","portata":"1,5 m","lv18":false},"Grande":{"alts":[[{"n":1,"name":"Rostro","sec":false,"dice":"2d6","str":1.5,"crit":null,"extra":[]}]],"dist":[],"spazio":"3 m","portata":"1,5 m","lv18":false},"Enorme":{"alts":[[{"n":1,"name":"Rostro","sec":false,"dice":"2d8","str":1.5,"crit":null,"extra":[]}]],"dist":[],"spazio":"4,5 m","portata":"3 m","lv18":false}},"note":[],"capacita":[{"nome":"Volo","tag":"solo Minuscola","corpo":"Soggetto al riquadro Volo dei Parassiti. Volo rumoroso: -4 a Furtività mentre vola."},{"nome":"Canto Assordante","tag":null,"corpo":"Azione standard, una volta ogni 1d4 round: cono di 3 m (Minuscola/Piccola), 4,5 m (Media), 6 m (Grande), 9 m (Enorme). Danno sonoro: 1d6 (Minuscola/Piccola), 2d6 (Media), 3d6 (Grande), 4d6 (Enorme). TS Tempra (CD 10+½DV+mod.Cos) dimezza; chi fallisce è anche Assordato 1d4 round. Effetti di [SONORO]. Le creature sorde sono immuni al danno del canto."},{"nome":"Rostro Perforante","tag":null,"corpo":"Il Rostro ignora 3 punti di RD di qualunque tipo e considera CA di contatto contro bersagli inermi o Immobilizzati."},{"nome":"Ninfa Sotterranea","tag":null,"corpo":"Può scavare e restare sepolta a tempo indeterminato senza bisogno di respirare finché è sottoterra. Emergendo da sotto un bersaglio ottiene +4 TxC e il bersaglio è Colto alla sprovvista."},{"nome":"Frantumare","tag":"dal Media","corpo":"Il Canto Assordante infligge danno doppio agli oggetti fragili (vetro, cristallo, ceramica) e alle creature di tipo Costrutto o Melma di cristallo. Gli oggetti non custoditi si infrangono automaticamente; quelli custoditi seguono la scala Scheggiato → Rotto → distrutto."},{"nome":"Coro","tag":"dal Grande","corpo":"Se un alleato usa un effetto sonoro nello stesso round, la CD del Canto Assordante sale di +2 e il raggio raddoppia."},{"nome":"Urlo Devastante","tag":"solo Enorme, 1/giorno","corpo":"Azione di round completo: emissione a raggio 12 m. Danno sonoro 6d6, TS Tempra (CD 10+½DV+mod.Cos) dimezza. Chi fallisce è Stordito 1 round e Assordato per 1 ora. Ogni struttura o oggetto non custodito nell'area subisce il danno pieno senza tiro salvezza."},{"nome":"Ali Perdute","tag":null,"corpo":"Oltre la taglia Minuscola non può volare. La velocità terrestre è già adeguata in tabella e non subisce penalità per corsa su terreno accidentato."},{"nome":"Ali Residue","tag":null,"corpo":"Le ali rallentano la caduta: altezza considerata inferiore di 6 m (nessun danno e nessun Prono entro 6 m; max 9 m di riduzione con Acrobazia CD 15). Può planare di 1,5 m ogni 3 m di discesa."}],"chiusura":"unica fonte di danno sonoro del volume e unica forma con Scavare tra gli insetti. Il Canto colpisce ad area senza tiro per colpire, quindi ignora la penalità agli attacchi secondari.","canatExtra":0},{"nome":"Cervo Volante","vol":"parassiti","cat":"Insetti","specie":["Lucanide","Cervo volante europeo","Cervo volante gigante","Re dei cervi volanti","Titano cornuto"],"intro":"I cervi volanti hanno mandibole enormi simili a corna che usano per la lotta. Solo la Minuscola può volare (con difficoltà). La loro presa è leggendaria: una volta che le mandibole hanno preso il bersaglio, è difficilissimo liberarsi. Nelle taglie maggiori possono sollevare e scagliare avversari come oggetti.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"4,5 m, Vo  volo ma danno una spinta. Quando compie una Carica, la distanza percorribile raddoppia e la carica può includere un cambio di direzione."},{"nome":"Lancio dell'Avversario","tag":"dal Grande","corpo":"Mentre tiene Afferrato un bersaglio di taglia pari o inferiore col morso, come azione standard può scagliarlo: gittata 1,5 m × mod.For; il bersaglio subisce 1d6+For danni per ogni 1,5 m percorsi (max 5d6) e cade Prono; se impatta un muro o un'altra creatura, entrambi subiscono il danno."},{"nome":"Corna Incrociate","tag":"solo Enorme","corpo":"Come azione standard può caricare la presa: contro una creatura Afferrata al Morso, chiude le mandibole con forza tale da infliggere il danno del Morso con dadi triplicati. La creatura deve superare un TS su Tempra (CD 10+½DV+mod.For) o applicare il sistema di locazione del corpo per amputazione dell'arto trattenuto."},{"nome":"Ali Perdute","tag":null,"corpo":"Oltre la taglia Minuscola non può volare. La velocità terrestre è già adeguata in tabella e non subisce penalità per corsa su terreno accidentato."},{"nome":"Ali Residue","tag":null,"corpo":"Le ali rallentano la caduta: altezza considerata inferiore di 6 m (nessun danno e nessun Prono entro 6 m; max 9 m di riduzione con Acrobazia CD 15). Può planare di 1,5 m ogni 3 m di discesa."}],"chiusura":"forma di lotta pura: prende, stritola, lancia. Eccellente per controllo del campo di battaglia; a Enorme le Corna Incrociate possono chiudere lo scontro con un'amputazione.","canatExtra":0},{"nome":"Scarabeo Rinoceronte","vol":"parassiti","cat":"Insetti","specie":["Scarabeo rinoceronte","Scarabeo Atlante","Scarabeo Ercole","Scarabeo gigante cornuto","Scarabeo titanico"],"intro":"Il corno frontale ricurvo è l'arma primaria di questi coleotteri. Caricano con violenza e l'esoscheletro è uno dei più spessi del regno animale: cresce di livello in livello fino a una corazza praticamente impenetrabile alle armi contundenti. Solo la Minuscola può volare (con difficoltà).","vel":[{"sizes":["Mi ione gratuita senza provocare attacchi di opportunità."},{"nome":"Esoscheletro Possente","tag":"dal Piccola","corpo":"Ottiene RD 2/contundente. RD 5/contundente nella taglia Grande, e RD 10/contundente nella taglia Enorme."},{"nome":"Slancio Alare","tag":"dal Piccola","corpo":"I resti delle ali non sostengono il volo ma danno una spinta. Quando compie una Carica, la distanza percorribile raddoppia e la carica può includere un cambio di direzione."},{"nome":"Spinta Inarrestabile","tag":"solo Enorme","corpo":"Come azione di round completo, può tentare di Travolgere creature di almeno una taglia inferiore senza prova. Bersagli: TS Riflessi (CD 10+½DV+mod.For) o subiscono 3d6+1½For danni e cadono Proni."},{"nome":"Ali Perdute","tag":null,"corpo":"Oltre la taglia Minuscola non può volare. La velocità terrestre è già adeguata in tabella e non subisce penalità per corsa su terreno accidentato."},{"nome":"Ali Residue","tag":null,"corpo":"Le ali rallentano la caduta: altezza considerata inferiore di 6 m (nessun danno e nessun Prono entro 6 m; max 9 m di riduzione con Acrobazia CD 15). Può planare di 1,5 m ogni 3 m di discesa."}],"chiusura":"forma da sfondamento: carica violentissima, durezza estrema; con lo Slancio Alare e il registro Devastante è l'unica forma del volume pensata per abbattere in un solo colpo.","canatExtra":0},{"nome":"Scarabeo del Fuoco","vol":"parassiti","cat":"Insetti","specie":["Scarabeo del fuoco","Scarabeo lucciola","Scarabeo bombardiere","Scarabeo gigante ardente","Titano del fuoco"],"intro":"Il classico coleottero bioluminescente capace di spruzzare una secrezione caustica esplosiva. Non vola in alcuna taglia: si è specializzato nella chimica difensiva. La luce delle sue ghiandole è regolabile e può essere usata come torcia naturale. Nelle forme maggiori il sangue stesso infiammato fa danni a chiunque lo ferisca.","vel":[{"sizes":["Minuscola"],"label":"Minuscola","val":"4,5 m"},{"sizes":["Piccola"],"label":"Piccola","val":"9 m"},{"sizes":["Media"],"
